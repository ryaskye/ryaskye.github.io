<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Low Tide Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: one landscape 1280x800 stage, scaled to fit and letterboxed over deep water. Single deliberate look (the painted art sets it), so no dark/light switch. */
:root{
  --ink:#5A3E2B; --paper:#FFF4DF; --paper2:#FBE6C4; --sea:#173F4F; --sea2:#1E5A6E;
  --gold:#F5C542; --coral:#E9785A; --teal:#2D7D8C;
  --font:'Fredoka','Baloo 2','Nunito',ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
html{background:var(--sea)}
body{margin:0;overflow:hidden;position:relative;background:var(--sea);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform-origin:50% 50%;overflow:hidden;border-radius:22px;
  background:var(--sea2);box-shadow:0 18px 60px rgba(0,0,0,.35)}
#cv{position:absolute;inset:0;width:1280px;height:800px;display:block;touch-action:none}
.hot{position:absolute;background:transparent;border:0;padding:0;margin:0;cursor:pointer;border-radius:22px;z-index:4}
.hot:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.hot.round{border-radius:50%}
.hot img{width:100%;height:100%;display:block;pointer-events:none}
.hot:active img{transform:scale(.92)}
#btnSound{background:var(--paper);border:4px solid var(--ink);border-radius:50%;box-shadow:inset 0 -5px 0 var(--paper2)}
#btnSound img{width:62%;height:62%;margin:19% auto 0}
#btnSound.off::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:4px;margin-top:-2px;background:var(--coral);transform:rotate(-40deg);border-radius:4px}
#ov{position:absolute;inset:0;background:rgba(18,48,60,.55);display:grid;place-items:center;z-index:10}
.panel{width:560px;max-height:760px;overflow:auto;background:var(--paper);border:5px solid var(--ink);border-radius:34px;padding:26px 34px 24px;
  box-shadow:0 10px 0 rgba(90,62,43,.4);text-align:center;box-sizing:border-box}
.panel.wide{width:1060px}
.panel.wide h2{font-size:34px}.panel.wide .row{margin-top:8px}.panel.wide .ibtn img{width:68px;height:68px}
.panel h2{margin:0 0 6px;font-weight:600;font-size:40px;line-height:1.1;text-wrap:balance}
.panel p{margin:6px 0;font-size:20px;line-height:1.35;text-wrap:balance}
.panel .sub{color:var(--teal);font-weight:500}
.row{display:flex;justify-content:center;gap:26px;margin-top:18px;flex-wrap:wrap}
.ibtn{background:none;border:0;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 19px var(--font);color:var(--ink);cursor:pointer;border-radius:18px}
.ibtn img{width:84px;height:84px;object-fit:contain;display:block}
.ibtn.wideimg img{width:180px;height:76px}
.ibtn:active img{transform:scale(.92)}
.ibtn:focus-visible,.pill:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.pill{display:block;width:100%;margin-top:12px;font:600 21px var(--font);color:var(--ink);background:#FFFBF2;border:4px solid var(--ink);
  border-radius:999px;padding:11px 14px;box-shadow:inset 0 -6px 0 var(--paper2);cursor:pointer}
.pill:active{transform:translateY(2px)}
.pill.warn{background:var(--coral);color:#fff;box-shadow:inset 0 -6px 0 #C85E44}
.stars{display:flex;justify-content:center;gap:10px;margin:8px 0 2px}
.stars img{width:74px;height:72px}
.stars img:nth-child(2){transform:translateY(-12px)}
.stars img.off{filter:grayscale(1) brightness(1.25);opacity:.4}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;text-align:left;margin:14px 20px 4px;font-size:21px;font-variant-numeric:tabular-nums}
.stats img{width:32px;height:32px;object-fit:contain}
.stats b{font-weight:600;text-align:right}
.bonus{display:inline-block;margin-top:8px;background:#E3F6F4;border:3px solid var(--teal);border-radius:999px;padding:4px 14px;font-weight:600;color:var(--teal)}
.dishes{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:12px 0 4px}
.dish{background:#FFFBF2;border:3px solid #E3CBA5;border-radius:16px;padding:6px 4px 5px;font-size:13px;line-height:1.2}
.dish img{width:46px;height:40px;object-fit:contain;display:block;margin:0 auto 4px}
.dish b{display:block;font-weight:600;font-size:14px}
.dish span{color:#8A6A52}
.dish.locked img{filter:brightness(0) opacity(.25)}
.dish.locked{background:#F4E7D1}
.howto{text-align:left;margin:8px 8px 0;padding-left:22px;font-size:17px;line-height:1.35;columns:2;column-gap:34px}
.newdish{display:flex;align-items:center;gap:18px;text-align:left;background:#FFFBF2;border:3px solid #E3CBA5;border-radius:22px;padding:10px 16px;margin-top:12px}
.newdish img.big{width:96px;height:86px;object-fit:contain;flex:none;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.newdish b{display:block;font-size:24px;font-weight:600}
.newdish .path{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:17px;color:#7A5A42;margin-top:4px}
.newdish .path img{width:34px;height:30px;object-fit:contain}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
#loading{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(ellipse at 50% 40%,#3F9DB4 0%,#226779 55%,#173F4F 100%);color:var(--paper)}
#loading h1{margin:0;font-weight:600;font-size:76px;letter-spacing:.5px;color:var(--paper);
  text-shadow:0 5px 0 var(--ink),4px 0 0 var(--ink),-4px 0 0 var(--ink),0 -4px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink)}
#loading p{margin:0;font-size:22px;font-weight:500}
.bar{width:540px;height:38px;border:5px solid var(--ink);border-radius:999px;background:#FFF4DF;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.25);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;transition:width .15s;
  background:repeating-linear-gradient(-45deg,#F5C542 0 18px,#F7D36A 18px 36px);box-shadow:inset 0 -6px 0 rgba(200,140,30,.35)}
.bubbles span{position:absolute;bottom:-30px;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.7);animation:rise 6s linear infinite}
@keyframes rise{to{transform:translateY(-900px)}}
@media (prefers-reduced-motion: reduce){.bubbles span{animation:none;display:none}.ibtn:active img,.hot:active img,.pill:active{transform:none}.newdish img.big{animation:none}}
</style>

<script>
(()=>{
'use strict';

/* =====================================================================
   DIFFICULTY — every tuning number lives here.
   guests:   how many guests come in during the day (a group counts each member)
   every:    seconds between arrivals (each arrival varies by ±15%)
   patience: seconds a guest waits before their 5 hearts run out
   group:    chance an arrival is a group;  maxGroup: largest group size
   items:    chance of a 1-, 2- or 3-item order
   unlock:   dishes added to the menu that day
   goal:     coins to earn for the first star (tuned so a quick, tidy player gets there with time to spare)
   ===================================================================== */
const DIFFICULTY=[
  {day:1, guests:4,every:18,patience:45,group:0,  maxGroup:1,items:[1,0,0],       unlock:['salad','latte','pasta'],goal:30},
  {day:2, guests:5,every:16,patience:45,group:0,  maxGroup:1,items:[1,0,0],       unlock:['boba'],   goal:36},
  {day:3, guests:6,every:14,patience:40,group:.25,maxGroup:2,items:[1,0,0],       unlock:['shrimp'], goal:42,firstGroup:2},
  {day:4, guests:6,every:13,patience:40,group:.3, maxGroup:2,items:[.7,.3,0],     unlock:['chowder'],goal:48},
  {day:5, guests:7,every:12,patience:35,group:.3, maxGroup:2,items:[.65,.35,0],   unlock:['cookie'], goal:54},
  {day:6, guests:7,every:12,patience:35,group:.3, maxGroup:2,items:[.6,.4,0],     unlock:['ramen'],  goal:60},
  {day:7, guests:8,every:11,patience:33,group:.3, maxGroup:3,items:[.6,.4,0],     unlock:['fish'],   goal:62,firstGroup:3},
  {day:8, guests:8,every:11,patience:32,group:.3, maxGroup:3,items:[.5,.38,.12],  unlock:['burger'], goal:66},
  {day:9, guests:9,every:10,patience:30,group:.35,maxGroup:3,items:[.5,.38,.12],  unlock:['scallop'],goal:70},
  {day:10,guests:9,every:10,patience:30,group:.35,maxGroup:3,items:[.5,.38,.12],  unlock:['tempura'],goal:74},
];
const LATE_UNLOCKS=['poke','matcha','citrus','dessert']; // one per day after Day 10, at the Day 10 pace
const DAY_LENGTH=90;            // seconds
const HOT_WARN=6, HOT_BURN=4;   // hot food on a station: yellow after 6s, burnt 4s later
const COLD_SPOIL=15;            // drinks and cold dishes put down: bad after 15s
const CHEF_SPEED=290, GROUP_BONUS=.2, GROUP_WINDOW=5;
const ORDERED_DRAIN=.75;      // once their order is in, guests lose patience at 75% speed
const GROUP_MAX_ITEMS=4;      // a whole group never orders more than this many items
function dayCfg(day){
  if(day<=DIFFICULTY.length)return DIFFICULTY[day-1];
  const b=DIFFICULTY[DIFFICULTY.length-1],extra=day-DIFFICULTY.length;
  return{...b,day,unlock:LATE_UNLOCKS[extra-1]?[LATE_UNLOCKS[extra-1]]:[],goal:b.goal+extra*4};
}
function unlockDay(dish){for(let d=1;d<=DIFFICULTY.length+LATE_UNLOCKS.length;d++)if(dayCfg(d).unlock.includes(dish))return d;return 99;}
function menuFor(day){const m=[];for(let d=1;d<=day;d++)m.push(...dayCfg(d).unlock);return m;}

/* =====================================================================
   ITEMS & RECIPES — add a dish by adding a row to ITEMS, a source, and (if cooked) a recipe.
   kind: ready = cold dish, drink = drink, hot = cooked dish, raw = ingredient
   ===================================================================== */
const ITEMS={
  salad:  {n:'Seaweed Salad',  img:'food_seaweed_salad', kind:'ready',p:6},
  cookie: {n:'Starfish Cookie',img:'food_starfish_cookie',kind:'ready',p:7},
  poke:   {n:'Poke Bowl',      img:'food_poke_bowl',     kind:'ready',p:9},
  dessert:{n:'Ocean Dessert',  img:'food_ocean_dessert', kind:'ready',p:9},
  latte:  {n:'Ocean Latte',    img:'food_ocean_latte',   kind:'drink',p:6},
  boba:   {n:'Pearl Boba',     img:'food_pearl_boba',    kind:'drink',p:8},
  matcha: {n:'Matcha Drink',   img:'food_matcha_drink',  kind:'drink',p:7},
  citrus: {n:'Citrus Splash',  img:'food_citrus_splash', kind:'drink',p:7},
  pasta:  {n:'Shell Pasta',    img:'food_shell_pasta',   kind:'hot',p:10},
  chowder:{n:'Clam Chowder',   img:'food_clam_chowder',  kind:'hot',p:12},
  ramen:  {n:'Coral Ramen',    img:'food_coral_ramen',   kind:'hot',p:14},
  tempura:{n:'Tempura Bowl',   img:'food_tempura_bowl',  kind:'hot',p:14},
  shrimp: {n:'Grilled Shrimp', img:'food_grilled_shrimp',kind:'hot',p:10},
  fish:   {n:'Grilled Fish',   img:'food_grilled_fish',  kind:'hot',p:12},
  scallop:{n:'Scallop Plate',  img:'food_scallop_plate', kind:'hot',p:11},
  burger: {n:'Kelp Burger',    img:'food_kelp_burger',   kind:'hot',p:15},
  rpasta:  {n:'pasta shells',  img:'raw_shell_pasta',  kind:'raw',dish:'pasta'},
  rnoodle: {n:'noodles',       img:'raw_coral_ramen',  kind:'raw',dish:'ramen'},
  coral:   {n:'coral garnish', img:'ingredient_coral', kind:'raw',dish:'ramen'},
  rclam:   {n:'clams',         img:'raw_clam_chowder', kind:'raw',dish:'chowder'},
  rtempura:{n:'battered shrimp',img:'raw_tempura_bowl',kind:'raw',dish:'tempura'},
  rskewer: {n:'shrimp skewer', img:'raw_grilled_shrimp',kind:'raw',dish:'shrimp'},
  rfish:   {n:'fish fillets',  img:'raw_grilled_fish', kind:'raw',dish:'fish'},
  rscallop:{n:'scallops',      img:'raw_scallop_plate',kind:'raw',dish:'scallop'},
  rpatty:  {n:'kelp patty',    img:'raw_kelp_patty',   kind:'raw',dish:'burger'},
};
const RECIPES={
  pasta:  {needs:['rpasta'],          st:'stove',t:4},
  chowder:{needs:['rclam'],           st:'stove',t:5},
  ramen:  {needs:['rnoodle','coral'], st:'stove',t:6},
  tempura:{needs:['rtempura'],        st:'stove',t:6},
  shrimp: {needs:['rskewer'],         st:'grill',t:4},
  fish:   {needs:['rfish'],           st:'grill',t:5},
  scallop:{needs:['rscallop'],        st:'grill',t:4},
  burger: {needs:['rpatty'],          st:'grill',t:5,then:'board'},
};
const ORDERABLE=Object.keys(ITEMS).filter(k=>ITEMS[k].kind!=='raw');
const itemDay=id=>unlockDay(ITEMS[id].kind==='raw'?ITEMS[id].dish:id);

const W=1280,H=800;
const FONT='"Fredoka","Baloo 2",ui-rounded,system-ui,sans-serif';
const INK='#5A3E2B',PAPER='#FFF4DF',GOLD='#F5C542';
const stage=document.getElementById('stage'),cv=document.getElementById('cv'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
const reduceMotion=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------------- helpers ---------------- */
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>1-Math.pow(1-t,3);
const back=t=>{const c=1.9;t=clamp(t,0,1)-1;return 1+(c+1)*t*t*t+c*t*t;};
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function fs(c,fill,lw=3,stroke=INK){c.fillStyle=fill;c.fill();if(lw){c.lineWidth=lw;c.strokeStyle=stroke;c.lineJoin='round';c.stroke();}}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(.1,r),0,Math.PI*2);}
function line(c,x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function txt(c,s,x,y,size,col=INK,align='center',w=600){c.font=`${w} ${size}px ${FONT}`;c.textAlign=align;c.textBaseline='middle';c.fillStyle=col;c.fillText(s,x,y);}
function otxt(c,s,x,y,size,col,lw=6,w=600){c.font=`${w} ${size}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=lw;c.strokeStyle=INK;c.strokeText(s,x,y);c.fillStyle=col;c.fillText(s,x,y);}
function wrap(c,s,maxW,size,w=500){c.font=`${w} ${size}px ${FONT}`;const out=[];let cur='';for(const wd of s.split(' ')){const t=cur?cur+' '+wd:wd;if(c.measureText(t).width>maxW&&cur){out.push(cur);cur=wd;}else cur=t;}if(cur)out.push(cur);return out;}
const fmtTime=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const countOf=(arr,x)=>arr.filter(v=>v===x).length;

/* ---------------- assets ---------------- */
const HAS_BURNT=new Set(['clam_chowder','coral_ramen','grilled_shrimp','kelp_burger','seaweed_salad','shell_pasta','starfish_cookie']);
const HAS_BAD=new Set(['citrus_splash','grilled_fish','matcha_drink','ocean_dessert','ocean_latte','pearl_boba','poke_bowl','scallop_plate','tempura_bowl']);
const CHARS=['crab','jellyfish','octopus','whaleshark','seahorse','pufferfish','ray','otter'];
const ASSETS=('btn_close btn_confirm btn_home btn_journal btn_play btn_settings btn_trophy cafe_room title_screen '+
 'chef_hold_burger chef_hold_plate chef_hold_two chef_idle chef_idle_side chef_walk_carry_1 chef_walk_carry_2 chef_wave '+
 'icon_bowl icon_coin icon_exclaim icon_fork_knife icon_heart icon_music icon_pearl icon_star icon_timer icon_chef_hat '+
 'station_stove station_grill station_drink_bar station_burger_board station_trash_bin pass_shelf_plates_bell '+
 'ui_coin_display ui_day_display ui_dialog_box ui_order_ticket ui_pearl_display ui_progress_bar').split(' ');
for(const ch of CHARS)for(const p of['idle','eat1','eat2','eat3','happy'])ASSETS.push(ch+'_'+p);
for(const k in ITEMS){const n=ITEMS[k].img;ASSETS.push(n);if(n.startsWith('food_')){const f=n.slice(5);if(HAS_BURNT.has(f))ASSETS.push(n+'_burnt');if(HAS_BAD.has(f))ASSETS.push(n+'_bad');}}

const IMG={},MISSING=new Set();
function placeholder(n){
  const c=document.createElement('canvas');c.width=120;c.height=120;const x=c.getContext('2d');
  rr(x,6,6,108,108,22);x.fillStyle='rgba(255,214,224,.9)';x.fill();x.setLineDash([8,6]);x.lineWidth=4;x.strokeStyle='#C2577A';x.stroke();
  x.fillStyle='#C2577A';x.font=`600 54px ${FONT}`;x.textAlign='center';x.textBaseline='middle';x.fillText('?',60,58);
  x.font=`500 11px ${FONT}`;x.fillText(n.slice(0,18),60,98);c._missing=true;return c;
}
function img(n){
  let im=IMG[n];
  if(!im){if(!MISSING.has(n)){MISSING.add(n);console.warn('[Low Tide Café] Missing image: assets/'+n+'.png');}im=IMG[n]=placeholder(n);}
  return im;
}
const iw=im=>im.naturalWidth||im.width, ih=im=>im.naturalHeight||im.height;
function src(n){const im=img(n);return im instanceof HTMLImageElement?im.src:im.toDataURL();}
function loadAll(onProgress){
  let done=0;
  return Promise.all(ASSETS.map(n=>new Promise(res=>{
    const im=new Image();let fin=false;
    const end=ok=>{if(fin)return;fin=true;
      if(ok)IMG[n]=im;else{MISSING.add(n);console.warn('[Low Tide Café] Missing image: assets/'+n+'.png');IMG[n]=placeholder(n);}
      done++;onProgress(done,ASSETS.length);res();};
    im.onload=()=>end(true);im.onerror=()=>end(false);
    setTimeout(()=>end(im.complete&&im.naturalWidth>0),25000);
    im.src='assets/'+n+'.png';
  })));
}
const TINT={};
function tinted(n){
  if(TINT[n])return TINT[n];const im=img(n);const c=document.createElement('canvas');c.width=iw(im);c.height=ih(im);const x=c.getContext('2d');
  x.drawImage(im,0,0);x.globalCompositeOperation='source-atop';x.fillStyle='rgba(255,70,60,.32)';x.fillRect(0,0,c.width,c.height);return TINT[n]=c;
}
function spr(c,n,x,y,s,o={}){
  const im=o.tint?tinted(n):img(n);const w=iw(im)*s*(o.sx||1),h=ih(im)*s*(o.sy||1);const ax=o.ax??.5,ay=o.ay??1;
  c.save();if(o.alpha!=null)c.globalAlpha*=o.alpha;c.translate(x,y);if(o.rot)c.rotate(o.rot);if(o.flip)c.scale(-1,1);
  c.drawImage(im,-w*ax,-h*ay,w,h);c.restore();return{w,h};
}

/* ---------------- pathing ---------------- */
function nearestNode(p){let b='M',bd=1e9;for(const k in NODES){if(k==='D')continue;const d=Math.hypot(NODES[k][0]-p.x,NODES[k][1]-p.y);if(d<bd){bd=d;b=k;}}return b;}
function graphPath(a,b){
  const dist={},prev={},q=new Set(Object.keys(NODES));for(const k of q)dist[k]=Infinity;dist[a]=0;
  while(q.size){let u=null;for(const k of q)if(u===null||dist[k]<dist[u])u=k;q.delete(u);if(u===b)break;
    for(const v of ADJ[u]){const d=dist[u]+Math.hypot(NODES[u][0]-NODES[v][0],NODES[u][1]-NODES[v][1]);if(d<dist[v]){dist[v]=d;prev[v]=u;}}}
  const out=[];let u=b;while(u){out.unshift(u);if(u===a)break;u=prev[u];}return out[0]===a?out:[a,b];
}
const isK=p=>p.x>=572&&p.y<=LANE+8;
function route(from,to,endNode){
  const out=[];
  if(isK(from)&&isK(to))return[{x:to.x,y:LANE}];
  let a,b;
  if(isK(from)){out.push({x:NODES.K0[0],y:LANE});a='K0';}else a=nearestNode(from);
  b=endNode||(isK(to)?'K0':nearestNode(to));
  for(const k of graphPath(a,b))out.push({x:NODES[k][0],y:NODES[k][1]});
  if(isK(to))out.push({x:to.x,y:LANE});
  out.push({x:to.x,y:to.y});
  const clean=[];for(const p of out){const l=clean[clean.length-1];if(!l||Math.hypot(l.x-p.x,l.y-p.y)>1)clean.push(p);}
  return clean;
}
function moveAlong(o,dt,speed){
  o.moving=false;
  while(o.path.length&&dt>0){const p=o.path[0];const dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy);const step=speed*dt;
    if(Math.abs(dx)>.5)o.dir=dx<0?-1:1;
    if(d<=step){o.x=p.x;o.y=p.y;o.path.shift();dt-=d/speed;o.walkD=(o.walkD||0)+d;}
    else{o.x+=dx/d*step;o.y+=dy/d*step;dt=0;o.walkD=(o.walkD||0)+step;o.moving=true;}}
  return o.path.length===0;
}

  const free=D.tables.filter(t=>t.state==='free'&&!t.party&&t.cap>=size).sort((a,b)=>a.cap-b.cap);

  const others=cu.party.members.filter(m=>m!==cu&&m.order.length).reduce((a,m)=>a+m.order.length,0);
  const unordered=cu.party.members.filter(m=>m!==cu&&!m.order.length&&!m.left).length;

  else if(type==='smoke')D.parts.push({type,x:x+rand(-8,8),y,vx:rand(-8,8),vy:rand(-40,-25),life:1.2,max:1.2,s:rand(6,10)});
  else if(type==='steam')D.parts.push({type,x:x+rand(-8,8),y,vx:rand(-6,6),vy:rand(-34,-22),life:.9,max:.9,s:rand(4,6)});
  else if(type==='puff')D.parts.push({type,x:x+rand(-14,14),y:y+rand(-8,8),vx:rand(-25,25),vy:rand(-30,-10),life:.8,max:.8,s:rand(6,10)});
  else if(type==='bubble')D.parts.push({type,x:x+rand(-14,14),y:y+rand(-6,6),vx:rand(-10,10),vy:rand(-50,-30),life:.9,max:.9,s:rand(3,6)});
}}
function updateParts(dt){
  for(const p of D.parts){p.life-=dt;p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;}
  D.parts=D.parts.filter(p=>p.life>0);
  for(const f of D.flies){f.t+=dt;if(f.t>=f.dur&&!f.done){f.done=true;D.pillBounce=1;if(f.last)SFX.tap();}}
  D.flies=D.flies.filter(f=>!f.done);
}

/* ---------------- chef actions ---------------- */
function slotPos(key,i){const s=STN[key];const x=s.slots===2?s.x+(i?s.dx:-s.dx):s.x;return{x,y:SLOT_Y};}
function shelfPos(i){return{x:PASS.x+PASS.slotX[i],y:PASS.by-PASS.h*.42};}
const srcById=id=>SOURCES.find(s=>s.id===id);
function standPoint(a){
  if(a.type==='trash')return{x:TRASH.x,y:LANE};
  if(a.type==='fridge'||(a.type==='raw'&&a.src==='fridge'))return FRIDGE.stand;
  if(a.type==='grab'||a.type==='raw')return{x:clamp(srcById(a.src).x,600,1100),y:LANE};
  if(a.type==='table'){const t=D.tables[a.table];return{x:NODES[t.stand][0],y:NODES[t.stand][1]};}
  if(a.type==='shelf')return{x:shelfPos(a.slot).x,y:LANE};
  if(a.type==='deliver'){const sl=D.st[a.st].slots.findIndex(s=>s.state==='empty');return{x:slotPos(a.st,Math.max(0,sl)).x,y:LANE};}
  return{x:slotPos(a.st,a.slot).x,y:LANE};
}
function markerPos(a){
  if(a.type==='trash')return{x:TRASH.x,y:TRASH.by+18};
  if(a.type==='fridge'||(a.type==='raw'&&a.src==='fridge'))return{x:FRIDGE.x+FRIDGE.w/2,y:FRIDGE.y-14};
  if(a.type==='grab'||a.type==='raw'){const s=srcById(a.src);return s.area==='drink'?{x:s.x,y:s.y-34}:{x:s.x,y:s.y+30};}
  if(a.type==='table'){const t=D.tables[a.table];return{x:t.top.x+52,y:t.top.y-34};}
  if(a.type==='shelf')return{x:shelfPos(a.slot).x,y:PASS.by+16};
  if(a.type==='deliver')return{x:STN[a.st].x,y:SLOT_Y-36};
  const p=slotPos(a.st,a.slot);return{x:p.x,y:SLOT_Y-36};
}
function projectedHands(){
  let n=D.chef.hands.length;
  for(const a of D.queue){
    if(a.type==='pick'||a.type==='grab'||a.type==='raw'||(a.type==='shelf'&&a.mode==='pick'))n++;
    else if((a.type==='shelf'&&a.mode==='drop')||a.type==='trash')n--;
    else if(a.type==='deliver')n-=RECIPES[a.dish].needs.length;
    else if(a.type==='table'){const t=D.tables[a.table];if(t.party&&t.party.members.some(m=>m.state==='ordered'))n--;}
    n=clamp(n,0,2);
  }
  return n;
}
function handsFull(){if(projectedHands()>=2){shakeChef();toast('Flippers full! Serve something, set it on the pass shelf, or toss it in the bin.');return true;}return false;}
function addAction(a){
  if(D.queue.length>=6){toast('The chef can only keep 6 jobs in mind. Tap a number to cancel one.');SFX.nope();return false;}
  a.id=++actId;a.waitT=0;D.queue.push(a);SFX.tap();return true;
}
function cancelAction(a){const i=D.queue.indexOf(a);if(i<0)return;D.queue.splice(i,1);if(D.chef.cur===a){D.chef.cur=null;D.chef.path=[];}SFX.pop();}
function shakeChef(){D.chef.shake=.4;SFX.nope();}
function toast(s){D.toast={s,t:2.8};}
function lockedToast(id){toast(`${ITEMS[id].kind==='raw'?ITEMS[id].n[0].toUpperCase()+ITEMS[id].n.slice(1):ITEMS[id].n} unlocks on Day ${itemDay(id)}.`);SFX.nope();}
function tapSource(s){
  if(!unlocked(s.item)){D.fx[s.id]={t:.55,shake:true};lockedToast(s.item);return;}
  if(handsFull())return;
  addAction({type:ITEMS[s.item].kind==='raw'?'raw':'grab',src:s.id,item:s.item});
}
function tapFridge(){
  if(!fridgeUnlocked()){D.stShake.fridge=.35;SFX.nope();toast(`The fridge is broken. It gets fixed on Day ${fridgeOpenDay()}.`);return;}
  if(!S.hints.fridge){S.hints.fridge=true;writeSave();showFridgeIntro();}
  D.fridgeUI=true;D.fridgeBounce=1;SFX.fridge();
  if(!D.queue.some(a=>a.type==='fridge'||(a.type==='raw'&&a.src==='fridge')))addAction({type:'fridge'});
}
function tapFridgeItem(id){
  if(!unlocked(id)){lockedToast(id);return;}
  if(handsFull())return;
  const k=D.queue.findIndex(a=>a.type==='fridge');
  const a={type:'raw',src:'fridge',item:id};
  if(k>=0){a.id=++actId;a.waitT=0;if(D.chef.cur===D.queue[k]){D.chef.cur=null;}D.queue[k]=a;SFX.tap();}else addAction(a);
  D.fridgeUI=false;
}
function heldRecipeFor(st){
  // a recipe at this station whose ingredients the chef is holding (complete or partial)
  const raw=D.chef.hands.filter(h=>ITEMS[h.id].kind==='raw').map(h=>h.id);
  for(const d in RECIPES){const r=RECIPES[d];if(r.st!==st)continue;if(r.needs.some(x=>raw.includes(x))){const missing=r.needs.filter(x=>!raw.includes(x));return{dish:d,missing};}}
  return null;
}
function tapStation(key,si){
  if(!stationOpen(key)){D.stShake[key]=.3;SFX.nope();toast(`The ${STN[key].label} opens on Day ${stationDay(key)}.`);return;}
  const st=D.st[key],slot=st.slots[si];
  const pickQueued=D.queue.some(a=>a.type==='pick'&&a.st===key&&a.slot===si);
  if(slot.state!=='empty'){
    if(key==='grill'&&slot.dish==='burger'&&slot.state!=='bad'){toast('The kelp patty moves to the burger board by itself when it is done.');SFX.nope();return;}
    if(pickQueued){D.stShake[key]=.3;SFX.nope();return;}
    if(handsFull())return;
    addAction({type:'pick',st:key,slot:si});return;
  }
  const hr=heldRecipeFor(key);
  if(hr){addAction({type:'deliver',st:key,dish:hr.dish});return;}
  D.stShake[key]=.3;SFX.nope();
  toast(key==='stove'?'Tap a raw ingredient (pasta shells, noodles, clams…) and the chef brings it here.':key==='grill'?'Tap a raw ingredient in the fridge and the chef grills it here.':'Kelp patties move here from the grill by themselves.');
}
function tapShelf(i){
  if(D.shelf[i]){if(handsFull())return;addAction({type:'shelf',slot:i,mode:'pick'});}
  else{if(projectedHands()<=0){D.stShake.shelf=.3;SFX.nope();toast('Pick something up first, then tap the pass shelf to set it down.');return;}addAction({type:'shelf',slot:i,mode:'drop'});}
}
function tapTable(i){
  const t=D.tables[i];
  if(!(t.party||t.state==='coins')){t.bounce=.4;SFX.nope();return;}
  if(t.party){const ms=t.party.members.filter(m=>!m.left);
    if(ms.length&&ms.every(m=>m.state==='eating'||m.state==='done')){t.bounce=.4;SFX.nope();toast('They are still eating.');return;}}
  addAction({type:'table',table:i});
}
function wantedIds(){const s=new Set();for(const c of D.cust)if(c.state==='ordered')for(const n of c.need)s.add(n);return s;}
function setPose(n,t){const ch=D.chef;ch.pose=n;ch.busy=t;}
function workPose(t=.45){setPose('chef_idle_side',t);}
function perform(a){
  const ch=D.chef;
  if(a.type==='fridge'){D.fridgeOpen=Math.max(D.fridgeOpen,1.2);D.fridgeBounce=1;return;}
  if(a.type==='grab'){
    if(ch.hands.length>=2){shakeChef();return;}
    ch.hands.push({id:a.item,bad:false,t:0});D.fx[a.src]={t:.3};workPose(.25);a.item==='latte'||ITEMS[a.item].kind==='drink'?SFX.pour():SFX.pop();return;
  }
  if(a.type==='raw'){
    if(ch.hands.length>=2){shakeChef();toast('Flippers full!');return;}
    ch.hands.push({id:a.item,bad:false,t:0});SFX.pop();
    if(a.src==='fridge'){D.fridgeOpen=1;D.fridgeBounce=1;SFX.fridge();}else D.fx[a.src]={t:.3};
    workPose(.25);
    const dish=ITEMS[a.item].dish,r=RECIPES[dish];
    const raw=ch.hands.map(h=>h.id);const missing=r.needs.filter(x=>!raw.includes(x));
    if(missing.length){const nx=D.queue[1];if(nx&&nx.type==='raw'&&missing.includes(nx.item))return;}
    return{next:{type:'deliver',st:r.st,dish}};
  }
  if(a.type==='deliver'){
    const r=RECIPES[a.dish];const raw=ch.hands.map(h=>h.id);const missing=r.needs.filter(x=>!raw.includes(x));
    if(missing.length){D.stShake[a.st]=.3;SFX.nope();toast(`${ITEMS[a.dish].n} needs ${missing.map(m=>ITEMS[m].n).join(' and ')} too. Tap it and the chef will bring it.`);
      if(!S.hints.missing){S.hints.missing=true;writeSave();}return;}
    const i=D.st[a.st].slots.findIndex(s=>s.state==='empty');
    if(i<0){D.stFull[a.st]=2.5;SFX.nope();toast(`The ${STN[a.st].label} is full. Pick up a dish to make room.`);return;}
    for(const x of r.needs){const k=ch.hands.findIndex(h=>h.id===x);ch.hands.splice(k,1);}
    Object.assign(D.st[a.st].slots[i],{state:'cooking',dish:a.dish,raw:r.needs.slice(),t:0,wait:0});
    workPose(.5);a.st==='grill'?SFX.sizzle():SFX.pour();burst(slotPos(a.st,i).x,SLOT_Y-14,'steam',4);
    return;
  }
  if(a.type==='pick'){
    const s=D.st[a.st].slots[a.slot];
    if(s.state==='cooking')return'wait';
    if(s.state==='done'||s.state==='bad'){if(ch.hands.length>=2){shakeChef();return;}if(a.st==='grill'&&s.dish==='burger'&&s.state==='done')return;
      ch.hands.push({id:s.dish,bad:s.state==='bad',t:0});Object.assign(s,es());workPose(.25);SFX.pop();}
    else shakeChef();
    return;
  }
  if(a.type==='shelf'){
    if(a.mode==='pick'){if(D.shelf[a.slot]&&ch.hands.length<2){ch.hands.push(D.shelf[a.slot]);D.shelf[a.slot]=null;SFX.pop();}else shakeChef();return;}
    if(!ch.hands.length){shakeChef();return;}
    const j=D.shelf[a.slot]?D.shelf.findIndex(x=>!x):a.slot;if(j<0){shakeChef();toast('The pass shelf is full.');return;}
    const w=wantedIds();let k=ch.hands.findIndex(h=>h.bad||!w.has(h.id));if(k<0)k=0;
    const it=ch.hands.splice(k,1)[0];it.t=0;D.shelf[j]=it;SFX.pop();return;
  }
  if(a.type==='trash'){
    const k=ch.hands.findIndex(h=>h.bad);
    if(k>=0)ch.hands.splice(k,1);else if(ch.hands.length)ch.hands.pop();else{shakeChef();return;}
    burst(TRASH.x,TRASH.by-TRASH.h,'puff',7);SFX.trash();ch.busy=.2;return;
  }
  if(a.type==='table'){
    const t=D.tables[a.table],p=t.party;
    if(p){
      const ms=p.members.filter(m=>!m.left);let did=false;
      for(const m of ms)if(m.state==='ready'){takeOrder(m,t);did=true;}
      for(const m of ms)if(m.state==='ordered'){for(let k=ch.hands.length-1;k>=0;k--){const h=ch.hands[k];if(!h.bad&&m.need.includes(h.id)){ch.hands.splice(k,1);serveItem(m,t,h.id);did=true;}}}
      if(did){ch.busy=.25;return;}
      if(ms.some(m=>m.state==='walk'||m.state==='reading'))return'wait';
      shakeChef();t.bounce=.4;
      if(ms.some(m=>m.state==='ordered'))toast('You are not carrying anything this table ordered.');
      return;
    }
    if(t.state==='coins'){collect(t);ch.dishT=.8;ch.busy=.5;return;}
    shakeChef();t.bounce=.4;
  }
}
function updateChef(dt){
  const ch=D.chef;ch.shake=Math.max(0,ch.shake-dt);
  if(ch.dishT>0){ch.dishT-=dt;if(ch.dishT<=0)burst(ch.x,ch.y-110,'puff',4);}
  if(ch.busy>0){ch.busy-=dt;ch.walking=false;if(ch.busy<=0){ch.busy=0;ch.pose=null;}return;}
  if(!ch.cur&&D.queue.length){ch.cur=D.queue[0];ch.path=route(ch,standPoint(ch.cur));}
  if(ch.cur){
    const arrived=moveAlong(ch,dt,CHEF_SPEED);ch.walking=!arrived;
    if(arrived){const a=ch.cur;let r=perform(a);
      if(r==='wait'){a.waitT+=dt;if(a.waitT>10)r=null;}
      if(r!=='wait'){const i=D.queue.indexOf(a);if(i>=0)D.queue.splice(i,1);ch.cur=null;if(!ch.busy)ch.busy=.1;
        if(r&&r.next){r.next.id=++actId;r.next.waitT=0;D.queue.unshift(r.next);}}}
  }else ch.walking=false;
}

/* ---------------- tutorial & hints ---------------- */
function pastaAnywhere(){return D.st.stove.slots.some(s=>s.dish==='pasta'&&(s.state==='cooking'||s.state==='done'))||D.chef.hands.some(h=>(h.id==='pasta'||h.id==='rpasta')&&!h.bad)||D.shelf.some(h=>h&&h.id==='pasta'&&!h.bad)||D.queue.some(a=>a.item==='rpasta'||a.type==='deliver');}
function pastaSpot(){const i=D.st.stove.slots.findIndex(s=>s.dish==='pasta'&&(s.state==='cooking'||s.state==='done'));const p=slotPos('stove',Math.max(0,i));return{x:p.x,y:p.y-28};}
function tutT(){const c=D.tut.crab;if(!c||c.party.table<0)return null;return D.tables[c.party.table];}
function tutTableTgt(){const t=tutT();if(!t)return null;const c=D.tut.crab;return{x:c.x,y:c.y-92};}
const cs=()=>D.tut.crab&&D.tut.crab.state;
const TUT=[

  {text:'They paid! Tap the table to collect the coins and clear the dishes.',tgt:()=>{const t=tutT();return t?{x:t.top.x,y:t.top.y-40}:null;},done:()=>{const t=tutT();return!t||t.state==='free';}},
  {text:'Lovely! Salad sits in the display case and lattes at the drink bar. Just tap them to grab one.',tgt:()=>({x:srcById('salad').x,y:srcById('salad').y-22}),done:()=>D.tut.t>4.5,noPause:true},
];
function tutOverride(){

function tutStep(){return tutOverride()||TUT[D.tut.i];}
function tutArrow(){if(!D.tut||!D.tut.crab)return null;const st=tutStep();if(!st||!st.tgt||st.noPause)return null;return st.tgt();}
function updateTutorial(dt){
  const tu=D.tut;tu.t+=dt;
  if(!tu.crab){tu.delay-=dt;if(tu.delay<=0){const p=spawnParty(['crab'],{frozen:true,forced:'pasta'});tu.crab=p.members[0];D.guestsLeft--;}return;}

function setHint(key,text,tgt,done,dur=8){S.hints[key]=true;writeSave();D.hint={key,text,tgt,done,t:0,dur};}
function updateHints(dt){
  if(D.hint){D.hint.t+=dt;if(D.hint.done()||D.hint.t>D.hint.dur)D.hint=null;return;}
  if(D.tut)return;

  const ch=D.chef;
  if(ch.hands.some(h=>h.bad)&&!S.hints.bin){setHint('bin','Tap the bin to throw away spoiled food.',()=>({x:TRASH.x,y:TRASH.by-TRASH.h-6}),()=>!D.chef.hands.some(h=>h.bad));return;}

}

/* ---------------- day flow ---------------- */
function trySpawn(){
  if(D.guestsLeft<=0)return;
  if(D.line.length>=3){D.spawnT=1.5;return;}
  const cfg=D.cfg;const pool=CHARS.filter(c=>c!=='whaleshark');
  let n=1;
  const maxG=Math.min(cfg.maxGroup,D.guestsLeft);
  if(cfg.firstGroup&&!D.groupDone&&D.guestsLeft<=cfg.guests-1&&maxG>=cfg.firstGroup){n=cfg.firstGroup;}
  else if(maxG>=2&&Math.random()<cfg.group)n=Math.random()<.35&&maxG>=3?3:2;
  if(n>=2)D.groupDone=true;
  let types;
  if(n===1&&D.day>=3&&Math.random()<.08)types=['whaleshark'];
  else{types=[];for(let i=0;i<n;i++)types.push(pick(pool));}
  D.guestsLeft-=n;spawnParty(types);
  D.spawnT=cfg.every*rand(.85,1.15)*(n>1?1.2:1);
}
function updateDay(dt){
  D.elapsed+=dt;
  if(D.ending>0){D.ending-=dt;updateParts(dt);updateChef(dt);if(D.ending<=0)endDay();return;}
  if(D.intro>0)D.intro-=dt;
  for(const k in D.fx){D.fx[k].t+=dt;if(D.fx[k].t>1.2)delete D.fx[k];}
  if(D.tut)updateTutorial(dt);
  const arrow=D.tut&&tutArrow();
  const started=D.elapsed>1.6;
  if(started&&!D.closed&&!arrow){D.time+=dt;if(D.time>=D.len){D.time=D.len;D.closed=true;toast('Closing time! The door is shut. Finish serving the guests inside.');SFX.door();}}
  if(D.closed)D.closeT+=dt;
  if(started&&!D.closed&&!D.tut){D.spawnT-=dt;if(D.spawnT<=0)trySpawn();}
  // stations
  for(const key in D.st){D.st[key].slots.forEach((s,i)=>{
    const p=slotPos(key,i);
    if(s.state==='cooking'){s.t+=dt;if(Math.random()<dt*3)burst(p.x,p.y-16,key==='grill'?'smoke':'steam',1);
      if(s.t>=RECIPES[s.dish].t){s.state='done';s.wait=0;burst(p.x,p.y-10,'spark',7);SFX.ding();}}
    else if(s.state==='done'){
      if(key==='grill'&&RECIPES[s.dish].then==='board'){const j=D.st.board.slots.findIndex(b=>b.state==='empty');
        if(j>=0){Object.assign(D.st.board.slots[j],{state:'done',dish:'burger',raw:[],t:0,wait:0});D.fx['board'+j]={t:0};const q=slotPos('board',j);burst(q.x,q.y,'spark',8);SFX.ding();Object.assign(s,es());return;}}
      s.wait+=dt;if(s.wait>=HOT_WARN+HOT_BURN){s.state='bad';burst(p.x,p.y-10,'smoke',8);SFX.burn();}}
    else if(s.state==='bad'&&Math.random()<dt*2.5)burst(p.x,p.y-16,'smoke',1);
  });}
  for(const k in D.stShake)D.stShake[k]=Math.max(0,D.stShake[k]-dt);
  for(const k in D.stFull)D.stFull[k]=Math.max(0,D.stFull[k]-dt);
  D.fridgeOpen=Math.max(0,D.fridgeOpen-dt);D.fridgeBounce=Math.max(0,D.fridgeBounce-dt*2.5);
  // put-down food on the pass shelf
  D.shelf.forEach(h=>{if(h&&!h.bad&&(ITEMS[h.id].kind==='ready'||ITEMS[h.id].kind==='drink')){h.t+=dt;if(h.t>=COLD_SPOIL){h.bad=true;SFX.burn();}}});
  processLine();
  // customers
  for(const cu of D.cust){
    cu.happyT=Math.max(0,cu.happyT-dt);const s=cu.state;
    if(s==='walkin'||s==='walkline'||s==='walk'){
      if(cu.delay>0)cu.delay-=dt;
      else if(moveAlong(cu,dt,cu.def.sp)){
        if(s==='walkline'||s==='walkin')cu.state='line';
        else{cu.state='reading';cu.t=rand(1.2,2);cu.hearts=Math.min(5,cu.hearts+1);SFX.pop();}
      }
    }
    else if(s==='reading'){cu.t-=dt;if(cu.t<=0){cu.state='ready';SFX.pop();}}
    else if(s==='eating'){cu.eatT-=dt;if(Math.random()<dt*3)burst(cu.x,cu.y-30,'spark',1);
      if(cu.eatT<=0){const t=D.tables[cu.party.table];t.bowls.push(foodPos(t,cu));cu.state='done';cu.happyT=0;checkParty(cu.party);}}
    else if(s==='leave'){if(moveAlong(cu,dt,cu.def.sp*1.15))cu.gone=true;}
    if(DRAIN.has(cu.state)&&!cu.frozen){
      cu.hearts-=dt*5/cu.pat*(cu.state==='ordered'?ORDERED_DRAIN:1);
      if(cu.hearts<=0){cu.hearts=0;if(cu.state==='line'||cu.state==='walkline')partyLeaveLine(cu.party);else memberLeave(cu,true);}
    }
  }
  D.cust=D.cust.filter(c=>!c.gone);
  D.parties=D.parties.filter(p=>p.members.some(m=>!m.gone));
  updateChef(dt);
  D.tickets.forEach((k,i)=>{const ty=96+i*64;k.y+=(ty-k.y)*Math.min(1,dt*10);});
  for(const t of D.tables)t.bounce=Math.max(0,t.bounce-dt*2);
  D.pillBounce=Math.max(0,D.pillBounce-dt*4);
  if(D.toast){D.toast.t-=dt;if(D.toast.t<=0)D.toast=null;}
  updateHints(dt);
  updateParts(dt);
  if(D.closed&&D.closeT>70)for(const c of D.cust)if(!c.left&&c.state!=='eating')memberLeave(c,DRAIN.has(c.state));
  if(D.closed&&D.cust.length===0&&!D.ending){
    for(const t of D.tables)if(t.state==='coins')collect(t);
    D.queue.length=0;D.chef.cur=null;D.fridgeUI=false;D.ending=2.4;
  }
}
function starsFor(r){if(r.coins<r.goal)return 0;return 1+(r.missed===0?1:0)+(r.coins>=Math.round(r.goal*1.25)?1:0);}
function endDay(){
  const r={day:D.day,coins:D.coins,goal:D.goal,served:D.served,missed:D.missed,bonus:D.bonus};r.stars=starsFor(r);
  S.last=r;S.coins+=D.coins;S.pearls+=r.stars;S.best=Math.max(S.best||0,D.coins);S.servedTotal=(S.servedTotal||0)+D.served;S.daysPlayed=(S.daysPlayed||0)+1;
  S.day+=1;writeSave();
  fadeTo(()=>{G.scene='title';D=null;G.disp=S.coins;syncButtons();showResults();});
}

function render(){

  if(G.scene==='loading'){ctx.fillStyle='#226779';ctx.fillRect(0,0,W,H);return;}
  if(G.scene==='game'&&D)renderGame(ctx);else renderTitle(ctx);
  if(G.fade){const f=G.fade;const a=f.phase==='out'?clamp(f.t/f.d,0,1):1-clamp(f.t/f.d,0,1);ctx.fillStyle=`rgba(18,48,60,${a})`;ctx.fillRect(0,0,W,H);}

function updateFade(dt){const f=G.fade;if(!f)return;f.t+=dt;if(f.t>=f.d){if(f.phase==='out'){f.cb&&f.cb();f.phase='in';f.t=0;}else G.fade=null;}}

function update(dt){
  updateAmbient(dt);updateFade(dt);
  const target=S.coins+(G.scene==='game'&&D?D.coins:0);G.disp+=(target-G.disp)*Math.min(1,dt*6);if(Math.abs(target-G.disp)<.5)G.disp=target;
  if(G.scene==='game'&&D&&!G.paused){const n=Math.max(1,Math.ceil(G.speed));const sdt=dt*G.speed/n;for(let i=0;i<n&&D;i++)updateDay(sdt);}
}

function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
const inRect=(p,r)=>p.x>=r[0]&&p.x<=r[0]+r[2]&&p.y>=r[1]&&p.y<=r[1]+r[3];
function onDown(p){
  if(G.fade||G.scene!=='game'||!D||G.paused||D.ending>0||!ov.hidden)return;
  if(D.fridgeUI){
    for(let i=0;i<FRIDGE_ITEMS.length;i++){const q=fridgeCell(i);if(Math.abs(p.x-q.x)<30&&Math.abs(p.y-q.y)<28){tapFridgeItem(FRIDGE_ITEMS[i]);return;}}
    if(inRect(p,[FPANEL.x,FPANEL.y,FPANEL.w,FPANEL.h]))return;
    D.fridgeUI=false;D.queue=D.queue.filter(a=>a.type!=='fridge');if(D.chef.cur&&D.chef.cur.type==='fridge'){D.chef.cur=null;D.chef.path=[];}
    if(inRect(p,[FRIDGE.x,FRIDGE.y,FRIDGE.w,FRIDGE.h]))return;
  }
  for(let i=D.queue.length-1;i>=0;i--){const a=D.queue[i];if(a._mx!=null&&Math.hypot(p.x-a._mx,p.y-a._my)<16){cancelAction(a);return;}}
  for(const s of SOURCES)if(Math.hypot(p.x-s.x,p.y-s.y)<s.r+5){tapSource(s);return;}
  if(inRect(p,[FRIDGE.x,FRIDGE.y,FRIDGE.w,FRIDGE.h])){tapFridge();return;}
  for(const key in STN){const s=STN[key];if(inRect(p,[s.x-50,198,100,140])){
    let bi=p.x<s.x?0:1;const sl=D.st[key].slots;
    if(sl[bi].state==='empty'&&sl[1-bi].state!=='empty'&&Math.abs(p.x-s.x)<12)bi=1-bi;
    tapStation(key,bi);return;}}
  if(inRect(p,[PASS.x-74,336,148,70])){let bi=0,bd=1e9;PASS.slotX.forEach((o,i)=>{const d=Math.abs(p.x-(PASS.x+o));if(d<bd){bd=d;bi=i;}});tapShelf(bi);return;}
  if(inRect(p,[TRASH.x-32,TRASH.by-TRASH.h-12,64,TRASH.h+16])){if(!D.chef.hands.length&&projectedHands()<=0){SFX.nope();toast('Nothing to throw away.');return;}addAction({type:'trash'});return;}
  for(const t of D.tables)if(inRect(p,t.hit)){tapTable(t.i);return;}
}

  const cards=ids.map(d=>{const day=unlockDay(d);const open=day<=S.day;const it=ITEMS[d];
    const how=it.kind==='ready'?'Display case':it.kind==='drink'?'Drink bar':`${STN[RECIPES[d].st].label[0].toUpperCase()+STN[RECIPES[d].st].label.slice(1)} · ${RECIPES[d].t}s`;
    return `<div class="dish${open?'':' locked'}">${im(it.img)}<b>${open?it.n:'???'}</b><span>${open?how:'Day '+day}</span>${open?`<br><span>${it.p} coins</span>`:''}</div>`;}).join('');
  openOv(`<h2>Café Journal</h2><p class="sub">Your menu so far</p><div class="dishes">${cards}</div>
  <ul class="howto"><li>Guests seat themselves. Tap a table to take orders, serve food, and collect coins.</li>
  <li>Display case dishes and drinks are ready: tap one and the chef grabs it.</li>
  <li>Tap a raw ingredient and the chef carries it to the stove or grill. Tap the cooked dish when the ring is green.</li>
  <li>Coral Ramen needs noodles and coral. Seafood lives in the fridge from Day 3.</li>
  <li>Hot food burns 10s after it's ready. Drinks and cold dishes go bad 15s after you put them down.</li>
  <li>The chef carries two things. Serve a whole group within 5s for +20% coins.</li></ul>
  <div class="row">${ib('close','btn_close','Close')}</div>`,true);
}
function showRecords(){
  openOv(`<h2>Records</h2>
  <div class="stats"><img alt="" src="${src('icon_chef_hat')}"><span>Days completed</span><b>${S.daysPlayed||0}</b>
  <img alt="" src="${src('icon_coin')}"><span>Coins saved</span><b>${S.coins}</b>
  <img alt="" src="${src('icon_pearl')}"><span>Pearls (one per star)</span><b>${S.pearls||0}</b>
  <img alt="" src="${src('icon_star')}"><span>Best day</span><b>${S.best||0} coins</b>
  <img alt="" src="${src('icon_heart')}"><span>Guests served</span><b>${S.servedTotal||0}</b></div>
  <div class="row">${ib('close','btn_close','Close')}</div>`);
}
function showResults(){
  const r=S.last;if(!r)return;
  const verdict=r.stars===3?'A perfect tide! Everyone left smiling.':r.stars===2?'Busy and brilliant.':r.stars===1?'Goal reached. The regulars are pleased.':'Short of the goal. Tomorrow is a new tide.';
  openOv(`<h2>Day ${r.day} closed!</h2><div class="stars">${[1,2,3].map(i=>`<img alt="${r.stars>=i?'star earned':'star not earned'}" class="${r.stars>=i?'':'off'}" src="${src('icon_star')}">`).join('')}</div>
  <p class="sub">${verdict}</p>
  <div class="stats"><img alt="" src="${src('icon_coin')}"><span>Coins earned</span><b>${r.coins}</b>
  <img alt="" src="${src('icon_star')}"><span>Daily goal</span><b>${r.goal}</b>
  <img alt="" src="${src('icon_heart')}"><span>Guests served</span><b>${r.served}</b>
  <img alt="" src="${src('icon_exclaim')}"><span>Left unhappy</span><b>${r.missed}</b></div>
  ${r.bonus?`<span class="bonus">${r.bonus} group bonus${r.bonus>1?'es':''} (+20%)</span>`:''}
  <p style="font-size:16px;margin-top:10px">${r.stars} star${r.stars===1?'':'s'} = ${r.stars} pearl${r.stars===1?'':'s'}. Stars: reach the goal · nobody leaves unhappy · beat the goal by 25%.</p>
  <div class="row">${ib('next','btn_play',`Open Day ${S.day}`,'wideimg')}${ib('close','btn_home','Title screen')}</div>`);
}
ov.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;ensureAudio();const act=b.dataset.act;SFX.tap();
  if(act==='resume'){closeOv();G.paused=false;}
  else if(act==='unlockGo'){closeOv();G.paused=false;if(D)sparkleItems(D.newDishes);}
  else if(act==='sound'){toggleSound();b.textContent=soundLabel();}
  else if(act==='restart'){closeOv();fadeTo(()=>{newDay();G.paused=false;});}
  else if(act==='home'){closeOv();fadeTo(()=>{G.scene='title';D=null;G.paused=false;G.disp=S.coins;syncButtons();});}
  else if(act==='close'){closeOv();}
  else if(act==='next'){startDay();}
  else if(act==='askReset'){openOv(`<h2>Start over?</h2><p>This erases your days, coins, pearls and records.</p><div class="row">${ib('doReset','btn_confirm','Erase progress')}${ib('settings','btn_close','Keep my café')}</div>`);}
  else if(act==='settings'){showSettings();}
  else if(act==='doReset'){const m=S.muted;Object.assign(S,FRESH(),{muted:m});writeSave();G.disp=0;closeOv();}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(G.scene==='game'&&D){if(D.fridgeUI){D.fridgeUI=false;return;}if(!ov.hidden){const k=ov.dataset.kind;closeOv();G.paused=false;if(k==='unlock')sparkleItems(D.newDishes);}else showPause();}
  else if(!ov.hidden)closeOv();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.scene==='game'&&D&&!G.paused&&ov.hidden&&D.ending<=0)showPause();});

/* ---------------- sizing & boot ---------------- */
let scale=1,dpr=1,rebuildT=null;
function resize(){
  const bw=document.body.clientWidth,bh=document.body.clientHeight;
  scale=Math.min(bw/W,bh/H);dpr=Math.min(3,window.devicePixelRatio||1);
  stage.style.transform=`translate(-50%,-50%) scale(${scale})`;
  cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);
  clearTimeout(rebuildT);rebuildT=setTimeout(()=>{if(G.scene!=='loading')buildBg();},120);
}
function measure(){
  for(const k in STN){const s=STN[k];s.sc=fitS(s.n,s.box[0],s.box[1]);s.h=ih(img(s.n))*s.sc;}
  DRINKBAR.sc=fitS(DRINKBAR.n,DRINKBAR.box[0],DRINKBAR.box[1]);
  PASS.sc=fitS(PASS.n,132,76);PASS.h=ih(img(PASS.n))*PASS.sc;
  TRASH.sc=fitS(TRASH.n,50,68);TRASH.h=ih(img(TRASH.n))*TRASH.sc;
}
window.addEventListener('resize',resize);
loadSave();G.disp=S.coins;updateSoundIcon();resize();syncButtons();
const fontP=(document.fonts&&document.fonts.load)?Promise.race([document.fonts.load(`600 40px ${FONT}`),new Promise(r=>setTimeout(r,2000))]).catch(()=>{}):Promise.resolve();
const fill=$('loadFill'),cnt=$('loadCount');
Promise.all([loadAll((d,n)=>{fill.style.width=(d/n*100)+'%';cnt.textContent=`${d} / ${n}`;fill.parentNode.setAttribute('aria-valuenow',Math.round(d/n*100));}),fontP]).then(()=>{
  measure();buildBg();
  for(const el of document.querySelectorAll('img[data-src]'))el.src=src(el.dataset.src);
  if(MISSING.size)console.warn('[Low Tide Café] '+MISSING.size+' image(s) missing, using placeholders:',[...MISSING].join(', '));
  $('loadMsg').textContent='Ready!';
  setTimeout(()=>{$('loading').style.transition='opacity .4s';$('loading').style.opacity='0';G.scene='title';syncButtons();
    setTimeout(()=>{$('loading').hidden=true;},420);},250);
});
requestAnimationFrame(frame);

// test hooks (used by the automated playtest)
window.__ltc={G,S,get D(){return D;},STN,PASS,TRASH,FRIDGE,TABLES,SOURCES,ITEMS,RECIPES,DIFFICULTY,dayCfg,spawnParty,tapStation,tapTable,tapShelf,tapSource:id=>tapSource(srcById(id)),
  tapFridge,tapFridgeItem,addAction,startDay,newDay,tapAt:(x,y)=>onDown({x,y}),setSpeed:v=>{G.speed=v;},projectedHands,unlocked:id=>D&&unlocked(id),fridgeCell};
})();
</script>
