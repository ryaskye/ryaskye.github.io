  if(R.clockFlash>0) R.clockFlash -= dt;

  updateDlg(dt);
  R.barks.forEach(b=>{ const was=b.t; b.t+=dt; if(was<0 && b.t>=0){ for(let i=0;i<4;i++) setTimeout(()=>blip(b.who), i*55); } });

}

function toggleMirror(force){
  if(!R || !(G.scene==='DRIVE'||G.scene==='STOP'||G.scene==='DEPOT_INTRO')) return;
  R.mirror.open = force!==undefined? force : !R.mirror.open;
  if(R.mirror.open && !META.seenMirror){ META.seenMirror = true; saveMeta(); }
  sfx('mirror');
}
function noticeDetail(det){
  if(R.flags[det.flag]){ R.mirror.caption = det; R.mirror.captionT = 5; return; }
  R.flags[det.flag] = true; R.mirror.caption = det; R.mirror.captionT = 6;
  sfx('notice'); toast('◉  Noticed: '+det.label+' — new things to say', '#3FF0FF', 3.5);
}

/* ----------------------------- NIGHT END ----------------------------- */
function buildSummary(){
  const rows = [];
  NIGHT.summary.forEach(s=>{
    if(s.who!=='mom' && !R.rode[s.who]) return;
    const line = s.lines.find(l=>cond(l.if)); if(line) rows.push({who:s.who, name:charName(s.who), text:line.text});
  });
  const L = Math.round(lateNow());
  return { night:NIGHT.id, day:NIGHT.day, title:NIGHT.title, num:NIGHT.num, rows,
    noticed: NIGHT.details.filter(d=>R.flags[d.flag]).map(d=>d.label), noticeTotal:NIGHT.details.length,
    late: L, clock: fmtClock(R.clock), nightWriteups:R.nightWriteups, writeups:R.writeups };
}
function endNight(){
  if(R.song){ R.song=null; stopSong(); }

  META.nightIndex = Math.max(META.nightIndex, NIGHT.num); META.checkpoint = null; saveMeta();

function fadeIn(){ G.fade = 1; G.fadeDir = -1; G.fadeCb = null; }
function goTitle(){ fadeOut(()=>{ if(R && R.song){ R.song=null; stopSong(); } G.scene='TITLE'; G.titleT=0; R=null; DLG.cur=null; DLG.queue=[]; fadeIn(); }); }

/* ============================= RENDER: SETUP & HELPERS ============================= */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let FIT = 1, DPR = 1, RS = 1;
function resize(){
  const cs = getComputedStyle(document.body);
  const aw = document.body.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = document.body.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  FIT = Math.max(0.1, Math.min(aw/W, ah/H));
  DPR = Math.min(2, window.devicePixelRatio||1);
  cv.style.width = Math.round(W*FIT)+'px'; cv.style.height = Math.round(H*FIT)+'px';
  cv.width = Math.round(W*FIT*DPR); cv.height = Math.round(H*FIT*DPR);
  const nrs = clamp(FIT*DPR, 1, 2);

}
const CACHE = { map:new Map(), clear(){ this.map.clear(); FAR_TILES.length=0; SKY=null; CLOUDS=null; GRAIN=null; VIGNETTE=null; GLOWS.clear(); } };
const INK = '#120A24';
const BLD = ['#2A1E5C','#4B2A8A','#6A2C7A','#2F3FA8','#8A3C9E'];
const WINC = ['#5CFF6A','#6FE3FF','#FF6AD5','#FFB347'];
const NEON = {pink:'#FF4FA3', cyan:'#3FF0FF', red:'#FF4B4B', lime:'#7CFF4F'};
const NEONS = ['#FF4FA3','#3FF0FF','#FF4B4B','#7CFF4F'];
const FD = '"Bebas Neue", Impact, sans-serif', FB = 'Nunito, "Segoe UI", sans-serif', FM = '"Permanent Marker", "Comic Sans MS", cursive';

function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=Math.max(1,Math.ceil(w*RS)); c.height=Math.max(1,Math.ceil(h*RS)); const x=c.getContext('2d'); x.setTransform(RS,0,0,RS,0,0); return {c,x,w,h}; }
function hexRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; }

const GLOWS = new Map();
function glow(color, r){

/* ============================= SKY / FAR / CLOUDS ============================= */
let SKY=null, CLOUDS=null, GRAIN=null, VIGNETTE=null; const FAR_TILES=[];
function makeSky(){
  const S = mkCanvas(W, H), c = S.x;
  const g = c.createLinearGradient(0,0,0,470); g.addColorStop(0,'#1B1240'); g.addColorStop(1,'#3A1F6B');
  c.fillStyle=g; c.fillRect(0,0,W,H);

const MID_F = 0.45, FAR_F = 0.1, ROAD_F = 1.25, BASE_Y = 446;

function buildWorld(){
  MID = []; NEAR = []; PUDDLES = []; BOKEH = [];
  const C = ROUTE.C, total = C[C.length-1] + 3000;
  // landmarks reserved in mid coordinates
  const marks = NIGHT.stops.map((s,i)=>{ const w = s.landmark==='waterfront'? 1100 : s.landmark==='station'? 560 : s.landmark==='depot'? 560 : 460; const cx = C[i]*MID_F + 700; return {type:s.landmark, x:cx-w/2, w, top: {depot:300, hospital:120, mill:190, diner:300, station:170, waterfront:330}[s.landmark]}; });
  const r = mulberry(1234 + NIGHT.num*77);
  let x = -500, mi = 0; const end = total*MID_F + 1600;
  const types = ['grid','brick','shop','deli','neon','graffiti','grid','brick','neon','shop'];
  while(x < end){
    const m = marks[mi];
    if(m && x + 180 > m.x){ // fill gap then place landmark
      if(m.x - x > 40) MID.push({type:'alley', x, w:m.x-x, top:BASE_Y-60, seed:Math.floor(r()*1e9)});
      MID.push({type:m.type, x:m.x, w:m.w, top:m.top, seed:Math.floor(r()*1e9), landmark:true});
      x = m.x + m.w; mi++; continue;
    }
    const type = types[Math.floor(r()*types.length)];
    const w = type==='graffiti'? 220+r()*120 : 180+r()*150;
    const top = type==='graffiti'? 320+r()*30 : 110+r()*170;
    const ww = m ? Math.min(w, Math.max(120, m.x - x)) : w;
    MID.push({type, x, w:ww, top, seed:Math.floor(r()*1e9), shop:SHOPS[Math.floor(r()*SHOPS.length)]});
    x += ww + (r()<0.3? 18+r()*30 : 0);
  }
  // near objects (far sidewalk)
  const reserved = C.map(c=>[c+760, c+1220]);
  const nr = mulberry(99 + NIGHT.num);
  let nx = -400;
  while(nx < total){
    nx += 170 + nr()*260;
    if(reserved.some(([a,b])=>nx>a && nx<b)) continue;
    const q = nr(); let type='lamp';
    if(q<0.38) type='lamp'; else if(q<0.46) type='traffic'; else if(q<0.56) type='sign'; else if(q<0.6) type='stop'; else if(q<0.67) type='hydrant'; else if(q<0.78) type='trash'; else if(q<0.83) type='dumpster'; else type='car';
    const segI = C.findIndex((c,i)=>i<C.length-1 && nx>=c && nx<C[i+1]);
    NEAR.push({type, x:nx, seed:Math.floor(nr()*1e9), tint: type==='lamp'? (nr()<0.7?'#FFB347': nr()<0.5?'#3FF0FF':'#FF6AD5') : null, street: (NIGHT.segments[Math.max(0,segI)]||{}).street||'MAIN ST'});
  }
  NIGHT.stops.forEach((s,i)=>{ NEAR.push({type:'shelter', x:C[i]+880}); NEAR.push({type:'busstop', x:C[i]+1078, name:s.name}); if(s.landmark==='mill') NEAR.push({type:'lamp', x:C[i]+1000, tint:'#FFB347', flicker:true}); });
  NEAR.sort((a,b)=>a.x-b.x);
  const pr = mulberry(5);
  for(let px=-200; px<total*ROAD_F+2000; px += 260 + pr()*520) PUDDLES.push({x:px, y:650+pr()*48, rx:34+pr()*60, ry:5+pr()*5});
  for(let i=0;i<34;i++) BOKEH.push({x:pr()*1800, y:180+pr()*260, r:10+pr()*26, c:['#FF4FA3','#FF4B4B','#FFB347','#7CFF4F','#6FE3FF'][Math.floor(pr()*5)], a:0.12+pr()*0.18, ph:pr()*6});
}
function midCanvas(b){

  e = mkCanvas(b.w + pad*2, hh); e.ox = b.x - pad; e.oy = b.top - pad;
  const c = e.x; c.translate(pad - b.x, pad - b.top);
  drawMid(c, b);
  CACHE.map.set(key, e);
  if(CACHE.map.size > 60){ const first = CACHE.map.keys().next().value; CACHE.map.delete(first); }
  return e;
}

    if(o.type==='lamp') out.push({x:sx+28, y:276, c:o.tint||'#FFB347', flick:o.flicker});

/* ============================= BACKGROUND COMPOSITE ============================= */
function drawBackground(c, cam, t){
  if(!SKY) makeSky(); if(!CLOUDS) makeClouds();
  if(FAR_TILES.length===0){ FAR_TILES.push(makeFarTile(21), makeFarTile(57)); }
  c.drawImage(SKY.c, 0, 0, W, H);

  c.drawImage(CLOUDS.c, cx, 20, 2600, 260); c.drawImage(CLOUDS.c, cx+2600, 20, 2600, 260);
  // far skyline (two tiles alternate)
  const fx = cam*FAR_F; const period = 3200; const off = ((fx % period)+period)%period;
  for(let k=-1;k<3;k++){ const tx = k*1600 - off; if(tx > W || tx < -1600) continue; const tile = FAR_TILES[((k + Math.floor(fx/period)*2) % 2 + 2) % 2]; c.drawImage(tile.c, tx, 0, 1600, 520); }

  for(const b of BOKEH){ const bx = ((b.x - cam*0.2) % 1800 + 1800) % 1800 - 260; drawGlow(c, b.c, bx, b.y + Math.sin(t*0.6+b.ph)*6, b.r, b.a*(0.8+0.2*Math.sin(t*1.3+b.ph))); }
  c.globalCompositeOperation='source-over';
  // mid buildings
  const mx = cam*MID_F;
  for(const b of MID){ const sx = b.x - mx; if(sx + b.w < -60) continue; if(sx > W+60) break;
    const e = midCanvas(b); c.drawImage(e.c, e.ox - mx, e.oy, e.w, e.h); }
  // far sidewalk
  c.fillStyle='#8E7BC9'; c.fillRect(0, BASE_Y, W, SIDEWALK_Y-BASE_Y+18);
  c.fillStyle='#B57BD6'; c.fillRect(0, BASE_Y, W, 5);
  c.strokeStyle=rgba(INK,0.7); c.lineWidth=2;
  const jo = ((cam % 90)+90)%90; c.beginPath(); for(let x=-jo; x<W; x+=90){ c.moveTo(x, BASE_Y); c.lineTo(x-14, SIDEWALK_Y+18); } c.stroke();
  c.fillStyle='#5E4F9A'; c.fillRect(0, SIDEWALK_Y+18, W, 6);
  // road behind the bus
  c.fillStyle='#241A4A'; c.fillRect(0, SIDEWALK_Y+24, W, 140);

  c.globalCompositeOperation='source-over';
  drawNear(c, cam, t);
}

/* ============================= RAIN ============================= */
const RAIN = { far:[], near:[], drops:[], splash:[], spray:[], front:[] };
function rainI(){ return (NIGHT && NIGHT.rain!==undefined)? NIGHT.rain : 1; }
function initRain(){
  for(let i=0;i<260;i++) RAIN.far.push({x:Math.random()*W, y:Math.random()*H, v:700+Math.random()*250});
  for(let i=0;i<120;i++) RAIN.near.push({x:Math.random()*W, y:Math.random()*H, v:1200+Math.random()*400});
  WINDOWS.forEach((wnd,wi)=>{ for(let i=0;i<15;i++){ const d=newDrop(wi); d.k=i; RAIN.drops.push(d); } });
}
function newDrop(wi){ const wnd = WINDOWS[wi]; return {wi, x:wnd[0]+6+Math.random()*(wnd[1]-wnd[0]-12), y:WIN_Y0+6+Math.random()*(WIN_Y1-WIN_Y0-20), r:1.5+Math.random()*2.5, vy:0, slide:Math.random()<0.3, trail:0, life:4+Math.random()*8}; }
function updateRain(dt, speed){
  const slant = 0.18 + speed*0.35;
  for(const arr of [RAIN.far, RAIN.near]) for(const d of arr){ d.y += d.v*dt; d.x -= d.v*dt*slant; if(d.y>H){ d.y=-20; d.x=Math.random()*(W+300); } if(d.x<-40) d.x += W+80; }
  for(let i=0;i<RAIN.drops.length;i++){ const d=RAIN.drops[i];
    d.life -= dt; if(d.slide){ d.vy = Math.min(60, d.vy + dt*40); d.y += d.vy*dt; d.trail = Math.min(26, d.trail + d.vy*dt*0.6); }
    else if(Math.random()<dt*0.08) d.slide = true;
    d.x -= speed*dt*18;
    const wnd = WINDOWS[d.wi]; if(d.y > WIN_Y1-4 || d.life<=0 || d.x < wnd[0]+3){ const k=d.k; RAIN.drops[i] = newDrop(d.wi); RAIN.drops[i].k=k; }
  }
  const I = rainI();
  if(Math.random()<dt*40*I) RAIN.splash.push({x:Math.random()*W, y:640+Math.random()*78, t:0});
  if(Math.random()<dt*25*I) RAIN.splash.push({x:Math.random()*W, y:640+Math.random()*78, t:0});
  // puddle spray off the wheels
  if(R && R.speed>0.25 && (G.scene==='DRIVE')){
    for(const wx of [250, 1084]){
      const hit = PUDDLES.some(p=>{ const px = p.x - R.cam*ROAD_F; return Math.abs(px-wx) < p.rx+10; });
      if(hit){ const n = Math.random()<dt*60*R.speed*I ? 3 : 0; for(let k=0;k<n;k++) RAIN.spray.push({x:wx-30+Math.random()*20, y:660, vx:-(80+Math.random()*260)*R.speed, vy:-(140+Math.random()*240), t:0}); }
    }
  }
  RAIN.spray.forEach(s=>{ s.t+=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=900*dt; }); RAIN.spray = RAIN.spray.filter(s=>s.t<0.7 && s.y<730);
  updateFront(dt);
  RAIN.splash.forEach(s=>s.t+=dt); RAIN.splash = RAIN.splash.filter(s=>s.t<0.25);
}
function drawRain(c, arr, alpha, len, speed){
  const slant = 0.18 + speed*0.35;
  const n = Math.floor(arr.length * clamp(rainI()/1.7, 0, 1));
  c.strokeStyle = rgba('#D9C8FF', alpha); c.lineWidth = arr===RAIN.near?1.6:1; c.beginPath();
  for(let i=0;i<n;i++){ const d=arr[i]; c.moveTo(d.x, d.y); c.lineTo(d.x + len*slant, d.y - len); }
  c.stroke();
}

/* ============================= ROAD (foreground) ============================= */
function drawRoad(c, cam, t, lights, busLit){
  c.fillStyle='#241A4A'; c.fillRect(0, 600, W, 120);
  // wet sheen band
  const g = c.createLinearGradient(0,600,0,720); g.addColorStop(0,'rgba(58,31,107,0.0)'); g.addColorStop(1,'rgba(58,31,107,0.6)'); c.fillStyle=g; c.fillRect(0,600,W,120);
  // lane dashes
  const ro = ((cam*ROAD_F)%160+160)%160; c.fillStyle=rgba('#FFB347',0.28);
  for(let x=-ro; x<W; x+=160) c.fillRect(x, 690, 70, 5);
  // long wobbly reflections
  c.globalCompositeOperation='lighter';
  if(busLit) WINDOWS.forEach(([a,b])=>streak(c, (a+b)/2, (b-a)*0.55, 650, 720, '#FFB347', 0.16, t));
  lights.forEach(L=>streak(c, L.x, 10, 640, 720, L.c, 0.32, t));
  c.globalCompositeOperation='source-over';
  // puddles that mirror lights and the bus windows
  for(const p of PUDDLES){ const px = p.x - cam*ROAD_F; if(px < -120) continue; if(px > W+120) break;
    c.save(); c.beginPath(); c.ellipse(px, p.y, p.rx, p.ry, 0, 0, Math.PI*2); c.fillStyle='#2E2262'; c.fill(); c.clip();
    c.globalCompositeOperation='lighter';
    if(busLit) WINDOWS.forEach(([a,b])=>{ if(b>px-p.rx && a<px+p.rx){ for(let k=0;k<4;k++){ c.fillStyle=rgba('#FFC66B',0.35); c.fillRect(a+Math.sin(t*4+k)*2, p.y-p.ry+k*3, b-a, 2); } } });
    lights.forEach(L=>{ if(Math.abs(L.x-px)<p.rx+20){ c.fillStyle=rgba(L.c,0.6); c.fillRect(L.x-6+Math.sin(t*5)*2, p.y-p.ry, 12, p.ry*2); } });
    c.restore();
    c.strokeStyle=rgba('#8E7BC9',0.4); c.lineWidth=1.2; c.beginPath(); c.ellipse(px, p.y, p.rx, p.ry, 0, Math.PI*1.1, Math.PI*1.9); c.stroke();
  }
  // splashes
  c.strokeStyle=rgba('#D9C8FF',0.5); c.lineWidth=1.2;
  for(const s of RAIN.splash){ const k=s.t/0.25, rr=2+k*6; c.beginPath(); c.arc(s.x, s.y, rr, Math.PI*1.1, Math.PI*1.9); c.stroke(); }
}
function drawSpray(c){ c.fillStyle=rgba('#E6D9FF',0.75); for(const s of RAIN.spray){ const r=2.2*(1-s.t); c.beginPath(); c.arc(s.x,s.y,Math.max(0.5,r),0,6.3); c.fill(); } }
function streak(c, x, w, y0, y1, col, a, t){
  c.fillStyle = rgba(col, a);

}

function makeGrain(){

  if(phone && d.phase!=='choices' && (d.speaker==='mom' || d.speaker==='dani')) return;

let MIR = null;
function drawMirrorScene(mc, w, h, t){

  mc.fillStyle='#4B2A6A'; poly(mc,[0,h, w,h, VPx+rw/2,VPy+rh/2, VPx-rw/2,VPy+rh/2]); mc.fill();
  mc.fillStyle='#C87838'; poly(mc,[0,0, VPx-rw/2,VPy-rh/2, VPx-rw/2,VPy+rh/2, 0,h]); mc.fill();

    mc.save(); poly(mc,[xo, h*0.12, xi, VPy-rh*0.32, xi, VPy+rh*0.02, xo, h*0.5]); mc.clip();
    for(let i=0;i<6;i++){ const z = ((t*0.25*(R?R.speed+0.05:0.1)*3 + i/6) % 1); const x = lerp(xo, xi, z); mc.globalCompositeOperation='lighter'; drawGlow(mc, ['#FFB347','#FF4FA3','#3FF0FF'][i%3], x, lerp(h*0.3, VPy-rh*0.15, z), 40*(1-z)+6, 0.5); mc.globalCompositeOperation='source-over'; }
    mc.restore();

  mc.fillStyle='#1B1240'; mc.fillRect(RW.x, RW.y, rw, rh);
  mc.fillStyle='#2A1E5C'; for(let i=0;i<9;i++){ mc.fillRect(RW.x+i*28, RW.y+10+((i*37)%30), 22, rh); }
  mc.fillStyle='#241A4A'; poly(mc,[RW.x, RW.y+rh, RW.x+rw, RW.y+rh, VPx+12, RW.y+rh*0.45, VPx-12, RW.y+rh*0.45]); mc.fill();
  const cam = R? R.cam : 0;
  for(let i=0;i<5;i++){ const z = (((cam/600) + i/5) % 1); const s = 1-z; const lx = VPx + (i%2?1:-1)*(14+90*s); const ly = RW.y + rh*0.45 + 70*s;
    mc.strokeStyle=INK; mc.lineWidth=2; mc.beginPath(); mc.moveTo(lx, ly); mc.lineTo(lx, ly-60*s-4); mc.stroke(); drawGlow(mc,'#FFB347',lx, ly-60*s-4, 14*s+3, 0.9); }
  const rp = R && PAX[R.runnerId];

    const dist = cam - rp.wx + 800;
    if(dist>0 && dist<4000){ const z = clamp(dist/4000,0,1), s=Math.pow(1-z,1.6); const fx = VPx+24*s+4, fy = RW.y+rh*0.45+66*s;
      mc.save(); mc.translate(fx, fy); mc.scale(0.5*s+0.08, 0.5*s+0.08); drawPerson(mc,'runner',{sit:0, walking:false, dir:-1, t, lean:0.5, pant:true, alpha:1, sleep:0}); mc.restore(); }
  }
  mc.restore(); rrect(mc, RW.x, RW.y, rw, rh, 8); inkIt(mc, null, 4);
  // empty seats on the left
  // passengers by depth
  const list = Object.values(PAX).filter(p=>p.state==='seated' || (p.state==='inside' && p.atFare));
  const spots = [];
  list.map(p=>({p, z: 1 + (p.state==='seated'? p.seat : 0.2)*0.45})).sort((a,b)=>b.z-a.z).forEach(({p,z})=>{
    const side = ((p.state==='seated'? p.seat : 0)%2===0) ? 1 : -1; const S = 215/z, cx = VPx + side*265/z, cy = VPy + 165/z;

function drawMirror(c, t){

  text(c, 'NOTICED '+noticedCount()+' / '+NIGHT.details.length, P.x+P.w-150, P.y+38, '18px '+FD, '#3FF0FF', 'right');

  addBtn({x:P.x+P.w-60, y:P.y+10, w:44, h:42, fn:()=>toggleMirror(false), label:'close mirror'});

/* ============================= AUDIO ============================= */
const AU = { ctx:null };
function initAudio(){
  if(AU.ctx){ if(AU.ctx.state==='suspended') AU.ctx.resume().catch(()=>{}); return; }
  let C; try{ C = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  AU.ctx = C;
  AU.master = C.createGain(); AU.master.connect(C.destination);
  AU.music = C.createGain(); AU.music.gain.value = 0.15; AU.music.connect(AU.master);
  AU.sfx = C.createGain(); AU.sfx.gain.value = 0.55; AU.sfx.connect(AU.master);
  AU.amb = C.createGain(); AU.amb.gain.value = 0.6; AU.amb.connect(AU.master);
  applyVolume();
  const len = C.sampleRate*2, buf = C.createBuffer(1, len, C.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1; AU.noise = buf;
  const loopNoise = ()=>{ const s=C.createBufferSource(); s.buffer=AU.noise; s.loop=true; s.start(); return s; };
  // engine
  AU.engF = C.createBiquadFilter(); AU.engF.type='lowpass'; AU.engF.frequency.value=200;
  AU.engG = C.createGain(); AU.engG.gain.value=0.0; AU.engF.connect(AU.engG); AU.engG.connect(AU.amb);
  AU.o1 = C.createOscillator(); AU.o1.type='sawtooth'; AU.o1.frequency.value=40; AU.o1.connect(AU.engF); AU.o1.start();
  AU.o2 = C.createOscillator(); AU.o2.type='sawtooth'; AU.o2.frequency.value=40.6; AU.o2.detune.value=12; AU.o2.connect(AU.engF); AU.o2.start();
  // rain
  const r1 = loopNoise(), hp = C.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1100; const lp = C.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=7000;
  const rg = C.createGain(); AU.rg = rg; rg.gain.value=0.07; r1.connect(hp); hp.connect(lp); lp.connect(rg); rg.connect(AU.amb);
  const r2 = loopNoise(), bp = C.createBiquadFilter(); bp.type='lowpass'; bp.frequency.value=380; const rg2 = C.createGain(); AU.rg2 = rg2; rg2.gain.value=0.09; r2.connect(bp); bp.connect(rg2); rg2.connect(AU.amb);
  // radio static bed
  const r3 = loopNoise(), sb = C.createBiquadFilter(); sb.type='bandpass'; sb.frequency.value=1900; sb.Q.value=0.8; AU.radioG = C.createGain(); AU.radioG.gain.value=0; r3.connect(sb); sb.connect(AU.radioG); AU.radioG.connect(AU.sfx);
  // music
  AU.musicLP = C.createBiquadFilter(); AU.musicLP.type='lowpass'; AU.musicLP.frequency.value=1300; AU.musicLP.connect(AU.music);
  AU.step = 0; AU.next = C.currentTime + 0.2;
  setInterval(scheduleMusic, 50);
}
function applyVolume(){ if(!AU.ctx) return; AU.master.gain.setTargetAtTime(META.muted? 0 : META.vol, AU.ctx.currentTime, 0.05); }
const CHORDS = [[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]];
const mtof = m=>440*Math.pow(2,(m-69)/12);
function scheduleMusic(){
  const C = AU.ctx; if(!C || C.state!=='running') return;
  const sp = 60/72/4;
  while(AU.next < C.currentTime + 0.25){
    const s = AU.step % 16, bar = Math.floor(AU.step/16), tt = AU.next;
    if(s===0){ const ch = CHORDS[bar%4]; ch.forEach((m,i)=>pad(mtof(m), tt, sp*16, 0.045)); pad(mtof(ch[0]-12), tt, sp*16, 0.06, 'sine'); }
    if(s===0 || s===10) kick(tt);
    if(s===4 || s===12) snare(tt);
    if(s%2===0) hat(tt, s%4===2? 0.018 : 0.01);
    if((s===6 || s===14) && Math.random()<0.45){ const pent=[72,74,77,79,81,84]; pad(mtof(pent[Math.floor(Math.random()*pent.length)]), tt, sp*3, 0.03, 'sine'); }
    AU.step++; AU.next += sp;
  }
}
/* Kit's song: a gentle synthesized acoustic 4-chord loop (C G Am F) with a simple melody */
let SONG = null;
function pluck(f, t, dur, vol, dest){
  const C = AU.ctx; const o = C.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
  const o2 = C.createOscillator(); o2.type='triangle'; o2.frequency.value=f*0.5;
  const lp = C.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(3200,t); lp.frequency.exponentialRampToValueAtTime(520,t+0.45);
  const g = C.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(dest); o.start(t); o2.start(t); o.stop(t+dur+0.05); o2.stop(t+dur+0.05);
}
function startSong(dur){
  const C = AU.ctx; if(!C) return; stopSong();
  const g = C.createGain(); g.gain.value = 0.55; g.connect(AU.sfx); SONG = {g};
  AU.music.gain.setTargetAtTime(0.015, C.currentTime, 0.4);
  const beat = 60/92, bar = beat*4, t0 = C.currentTime + 0.2, bars = Math.max(1, Math.floor(dur/bar));
  const chords = [[48,55,60,64,67],[43,50,55,59,62],[45,52,57,60,64],[41,48,53,57,60]];
  const pat = [0,2,1,3,4,3,2,1];
  for(let b=0;b<bars;b++){ const ch = chords[b%4]; for(let i=0;i<8;i++) pluck(mtof(ch[pat[i]]), t0+b*bar+i*beat/2, 1.7, i===0?0.13:0.085, g); }
  const mel = [[76,0,1],[74,1,0.5],[72,1.5,0.5],[74,2,1],[67,3,1],[74,4,1],[72,5,0.5],[71,5.5,0.5],[67,6,2],[72,8,1],[71,9,0.5],[69,9.5,0.5],[72,10,1],[76,11,1],[77,12,1],[76,13,0.5],[74,13.5,0.5],[72,14,2]];
  for(let ph=1; ph*4<bars; ph++){ mel.forEach(([n,b,l])=>{ const tt = t0 + ph*4*bar + b*beat; if(tt < t0 + bars*bar - 0.2) pluck(mtof(n), tt, Math.max(0.8,l*beat*1.6), 0.1, g); }); }
  pluck(mtof(48), t0+bars*bar, 3, 0.12, g); pluck(mtof(64), t0+bars*bar+0.03, 3, 0.09, g); pluck(mtof(72), t0+bars*bar+0.06, 3, 0.08, g);
}
function stopSong(){
  if(!SONG || !AU.ctx) { SONG = null; return; }
  const C = AU.ctx, g = SONG.g; g.gain.setTargetAtTime(0, C.currentTime, 0.4); setTimeout(()=>{ try{ g.disconnect(); }catch(e){} }, 3500);
  AU.music.gain.setTargetAtTime(0.15, C.currentTime, 1.0); SONG = null;
}
function pad(f, t, dur, vol, type){ const C=AU.ctx; const o=C.createOscillator(); o.type=type||'triangle'; o.frequency.value=f; o.detune.value=(Math.random()-0.5)*14; const g=C.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.35); g.gain.setValueAtTime(vol,t+dur-0.2); g.gain.linearRampToValueAtTime(0,t+dur+0.3); o.connect(g); g.connect(AU.musicLP); o.start(t); o.stop(t+dur+0.4); }
function kick(t){ const C=AU.ctx; const o=C.createOscillator(); o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(42,t+0.18); const g=C.createGain(); g.gain.setValueAtTime(0.35,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.35); o.connect(g); g.connect(AU.music); o.start(t); o.stop(t+0.4); }
function noiseHit(t, freq, q, vol, dur, dest){ const C=AU.ctx; const s=C.createBufferSource(); s.buffer=AU.noise; const f=C.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q; const g=C.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); s.connect(f); f.connect(g); g.connect(dest||AU.sfx); s.start(t, Math.random()); s.stop(t+dur+0.05); return {f,g}; }
function snare(t){ noiseHit(t, 1800, 0.9, 0.12, 0.16, AU.music); }
function hat(t, v){ noiseHit(t, 8000, 1.2, v*3, 0.05, AU.music); }
function tone(f, t, dur, vol, type, dest){ const C=AU.ctx; const o=C.createOscillator(); o.type=type||'sine'; o.frequency.value=f; const g=C.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(dest||AU.sfx); o.start(t); o.stop(t+dur+0.05); return o; }
function sfx(name){
  const C = AU.ctx; if(!C) return; const t = C.currentTime;
  switch(name){
    case 'door': { const h=noiseHit(t, 2600, 0.7, 0.5, 1.0); h.f.frequency.setValueAtTime(3200,t); h.f.frequency.exponentialRampToValueAtTime(700,t+0.9); tone(1318,t+0.5,1.1,0.12); tone(988,t+0.75,1.2,0.1); break; }
    case 'doorclose': { const h=noiseHit(t, 2000, 0.7, 0.35, 0.7); h.f.frequency.exponentialRampToValueAtTime(600,t+0.6); tone(70,t+0.62,0.2,0.3); break; }
    case 'brake': { const h=noiseHit(t, 4000, 0.6, 0.25, 0.6); h.f.frequency.exponentialRampToValueAtTime(1500,t+0.5); break; }
    case 'radio': { noiseHit(t, 2200, 0.5, 0.25, 0.12); tone(1600,t,0.05,0.05,'square'); break; }
    case 'ping': tone(1760,t,0.18,0.12); tone(2349,t+0.1,0.3,0.1); break;
    case 'fareok': tone(1480,t,0.12,0.1,'square'); tone(1980,t+0.08,0.14,0.08,'square'); break;
    case 'farebad': tone(300,t,0.18,0.1,'square'); tone(300,t+0.24,0.22,0.1,'square'); break;
    case 'bump': tone(55,t,0.4,0.6); noiseHit(t, 300, 0.6, 0.6, 0.3); noiseHit(t+0.05, 3000, 1, 0.15, 0.25); break;
    case 'bumpsoft': tone(60,t,0.25,0.25); noiseHit(t, 300, 0.6, 0.2, 0.2); break;
    case 'choose': tone(880,t,0.06,0.05,'triangle'); break;
    case 'silence': tone(220,t,0.4,0.04,'sine'); break;
    case 'notice': tone(880,t,0.4,0.08,'triangle'); tone(1320,t+0.09,0.5,0.07,'triangle'); tone(1760,t+0.18,0.6,0.05,'triangle'); break;
    case 'mirror': { const h=noiseHit(t, 1200, 1.5, 0.08, 0.35); h.f.frequency.exponentialRampToValueAtTime(3000,t+0.3); break; }
    case 'green': tone(660,t,0.08,0.03); break;
    case 'writeup': tone(196,t,0.35,0.12,'square'); tone(147,t+0.3,0.5,0.12,'square'); break;
    case 'thump': tone(78,t,0.16,0.12); noiseHit(t, 1500, 1, 0.03, 0.25, AU.amb); break;
  }
}
function blip(who){
  const C = AU.ctx; if(!C || !CHARS[who] || !CHARS[who].blip) return;
  const t = C.currentTime; const f = CHARS[who].blip * (1 + (Math.random()-0.5)*0.08);

  const lp = C.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = who==='dispatch'? 1400 : 2200;
  const g = C.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.05,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);

let lastWiperPhase = 0;
function updateAudio(){
  const C = AU.ctx; if(!C) return; const t = C.currentTime;

}

    const M = MIRROR_RECT;

/* ============================= LOOP ============================= */
function update(dt){
  G.t += dt;
  if(G.scene==='TITLE') G.titleT += dt;
  if(G.toast){ G.toast.t += dt; if(G.toast.t > G.toast.dur) G.toast = null; }
  if(G.fadeDir===1){ G.fade = Math.min(1, G.fade + dt*2.2); if(G.fade>=1){ const cb=G.fadeCb; G.fadeCb=null; G.fadeDir=0; if(cb) cb(); } }
  else if(G.fadeDir===-1){ G.fade = Math.max(0, G.fade - dt*1.6); if(G.fade<=0) G.fadeDir=0; }
  if(R && (G.scene==='DRIVE'||G.scene==='STOP'||G.scene==='DEPOT_INTRO')) updateWorld(dt);
  updateRain(dt, R && G.scene!=='TITLE' ? R.speed : 0.15);
}
function render(){
  ctx.setTransform(FIT*DPR,0,0,FIT*DPR,0,0);
  G.buttons = [];

  if(G.scene==='TITLE'){ drawTitle(ctx, t); }
  else if(G.scene==='NIGHT_END'){ drawEnd(ctx, t); }
  else if(R){
    drawWorld(ctx, t);
    drawMirror(ctx, t);
    drawHUD(ctx, t);
    drawDialogue(ctx, t);
    if(G.scene==='DEPOT_INTRO' && G.t<1e9){ /* intro shares the world view */ }
    if(G.input.left || G.input.right){ const s = G.input.right? '▶▶ FASTER' : '◀ BRAKE'; text(ctx, s, G.input.right? 1180 : 100, 120, '22px '+FD, rgba('#FFC66B',0.85), 'center'); }
  }
  drawToast(ctx);
  drawGrain(ctx);
  if(G.fade>0){ ctx.fillStyle = rgba('#120A24', G.fade); ctx.fillRect(0,0,W,H); }
}
let lastT = performance.now();
function frame(now){
  let dt = Math.min(0.1, (now-lastT)/1000) * G.ts; lastT = now;
  try{
    while(dt > 0){ const s = Math.min(dt, 1/30); update(s); dt -= s; }
    render(); updateAudio();
  }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
function boot(){
  resize();
  NIGHT = NIGHTS.mon; ROUTE = buildRoute(NIGHT); buildWorld(); initRain();
  document.getElementById('boot').hidden = true;
  requestAnimationFrame(t=>{ lastT=t; frame(t); });
}
// test hooks (used for automated playtesting)
window.__lbh = { G, DLG, PAX, get R(){ return R; }, get META(){ return META; }, chooseIndex, chooseSilence, advanceDlg, toggleMirror, noticeDetail, lateNow, visibleChoices, startNight, replayNight, get NIGHT(){ return NIGHT; } };
const fontsReady = (document.fonts && document.fonts.load) ? Promise.all([document.fonts.load('40px "Bebas Neue"'), document.fonts.load('20px Nunito'), document.fonts.load('italic 20px Nunito'), document.fonts.load('20px "Permanent Marker"')]) : Promise.resolve();
Promise.race([fontsReady, new Promise(r=>setTimeout(r, 2500))]).catch(()=>{}).then(boot);
</script>
