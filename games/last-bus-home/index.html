<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Last Bus Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:ital,wght@0,400;0,600;0,800;1,400&family=Permanent+Marker&display=swap">
<style>
:root{
  /* One committed look: neon-noir night. Canvas game, letterboxed. */
  --ink:#120A24; --night:#1B1240; --violet:#3A1F6B; --amber:#FFC66B; --cyan:#3FF0FF;
  --f-display:"Bebas Neue", "Oswald", Impact, sans-serif;
  --f-body:"Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:8px; box-sizing:border-box; color:#E6D9FF; font-family:var(--f-body)}
#wrap{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{display:block;outline:none;border-radius:6px;box-shadow:0 0 0 1px #2A1E5C, 0 20px 60px rgba(0,0,0,.5)}
#c:focus-visible{box-shadow:0 0 0 2px var(--cyan)}
[hidden]{display:none!important}
#boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);letter-spacing:.12em;color:var(--amber);font-size:28px;pointer-events:none}
@media (prefers-reduced-motion: reduce){ #c{transition:none} }
</style>
<div id="wrap"><canvas id="c" tabindex="0" aria-label="Last Bus Home — a narrative bus-driving game. Use arrow keys, M, number keys and space."></canvas><div id="boot">LOADING ROUTE 9…</div></div>
<script>
"use strict";
/* =====================================================================
   LAST BUS HOME — Night 1 (Monday) prototype
   Structure:
     DATA      CHARS, NIGHTS (nights → stops/segments → events → convos → nodes)
     ENGINE    state machine TITLE → DEPOT_INTRO → DRIVE ↔ STOP (+TALK/MIRROR/RULE_CALL overlays) → NIGHT_END
     RENDER    canvas 2D, logical 1280×720
     AUDIO     Web Audio, all synthesized
   New nights are added as data only: add NIGHTS.tue with the same shape.
   ===================================================================== */

/* ----------------------------- DATA ----------------------------- */
const CHARS = {
  walter:{name:'Walter', color:'#B7E36A', blip:150, skin:'#6B3F26', hair:'#D8CCE8', coat:'#6B7A3E', pants:'#3B3550', hat:'cap', hatColor:'#525E36', rough:'Easy. She’s not a race car.'},
  odessa:{name:'Mrs. Park', color:'#FF8A5C', blip:330, skin:'#D9A06F', hair:'#CFC6E6', coat:'#B4532A', pants:'#4A2E5E', hat:'knit', hatColor:'#B04A7A', rough:'Whoa — easy!'},
  lena:{name:'Lena', color:'#4FFFD0', blip:262, skin:'#5A3422', hair:'#1E0F24', coat:'#6E6A8A', inner:'#2FB5A5', pants:'#2FB5A5', hat:'bun', rough:'Whoa, easy…'},
  calvin:{name:'Calvin', color:'#8FB0FF', blip:185, skin:'#B07444', hair:'#24142E', coat:'#25306B', pants:'#25306B', tie:'#B0344E', hat:'short', rough:'Whoa — hey.'},
  runner:{name:'Kid in a red hoodie', color:'#FF6A6A', blip:225, skin:'#8C5634', hair:'#1E0F24', coat:'#D8323C', pants:'#2A2A4A', hat:'hood', duffel:true, rough:'Whoa!'},
  theo:{name:'Theo', alias:{unless:'theo_named', name:'Kid in the red hoodie'}, color:'#FF6A6A', blip:235, skin:'#8C5634', hair:'#1E0F24', coat:'#D8323C', pants:'#2A2A4A', hat:'phones', duffel:true, rough:'Whoa \u2014'},
  kit:{name:'Kit', color:'#FFE14F', blip:290, skin:'#F2C9A0', hair:'#5A2A8A', coat:'#F2C230', pants:'#3B3550', hat:'bob', rough:'Whoa \u2014 careful, the guitar!'},
  dani:{name:'Dani', color:'#FFC66B', blip:300, skin:'#C88A5A', hair:'#1E0F24', coat:'#3A3F8A'},
  dispatch:{name:'Dispatch · Bev', color:'#3FF0FF', blip:205},
  mom:{name:'Mom', color:'#FF6AD5', blip:520},
  narr:{name:'', color:'#E6D9FF', blip:0}
};

/* Generic convos any night can use (schedule warnings). */
const COMMON_CONVOS = {
  warn3:{with:null, nodes:[{speaker:'dispatch', text:'Route 9, Dispatch. You’re running behind.'}]},
  warn6:{with:null, nodes:[{speaker:'dispatch', expr:'sad', text:'Route 9. That’s six minutes down, Dani. Pick it up.'}]},
  warn9:{with:null, nodes:[{speaker:'dispatch', expr:'sad', text:'Route 9, nine minutes late. I have to write that up. Sorry, kid.'}]}
};

const NIGHTS = {};
const NIGHT_ORDER = ['mon','tue','wed','thu','fri'];
const NIGHT_DAYS = {mon:'Monday', tue:'Tuesday', wed:'Wednesday', thu:'Thursday', fri:'Friday'};
NIGHTS.mon = {
  id:'mon', num:1, day:'Monday', title:'Strangers', storm:false, rain:1,
  next:{day:'Tuesday', id:'tue'},
  startAboard:[{who:'walter', seat:0}],

  /* sched = scheduled arrival in minutes after 11:40 PM */
  stops:[
    {id:'depot', name:'Depot', sched:0, landmark:'depot', steps:[
      {convo:'dispatch_intro'},
      {convo:'walter_intro'},
      {board:'odessa', seat:1, fare:'tap'},
      {convo:'odessa_hello'}
    ]},
    {id:'hospital', name:'Harbor Hospital', sched:15, landmark:'hospital',
      arrive:[{if:{late:'<4'}, set:{'flag.odessa_on_time':true}}],
      steps:[
        {if:{aboard:'odessa'}, convo:'odessa_bye'},
        {alight:'odessa'},
        {board:'lena', seat:2, fare:'tap'}
    ]},
    {id:'mill', name:'Old Mill', sched:30, landmark:'mill', steps:[
      {board:'calvin', fare:'none', hold:true},
      {convo:'calvin_fare'},
      {if:{flag:'calvin_walked'}, exitFront:'calvin'},
      {if:{not:'calvin_walked'}, toSeat:'calvin', seatByTrust:[[1,1],[-99,6]]}
    ]},
    {id:'diner', name:'Lucky Star Diner', sched:45, landmark:'diner', steps:[
      {spawnRunner:'runner'},
      {convo:'runner_choice'},
      {if:{flag:'waited_for_runner_mon'}, runnerBoard:'runner', seat:7, cost:2},
      {if:{flag:'waited_for_runner_mon'}, convo:'runner_board'},
      {if:{flag:'left_runner_mon'}, bark:{who:'walter', text:'Schedule’s the schedule.'}}
    ]},
    {id:'central', name:'Central Station', sched:60, landmark:'station', steps:[
      {if:{aboard:'calvin'}, convo:'calvin_bye'},
      {alight:'calvin'},
      {if:{aboard:'runner'}, convo:'runner_bye'},
      {alight:'runner'}
    ]},
    {id:'waterfront', name:'Waterfront', sched:77, landmark:'waterfront', steps:[
      {if:{aboard:'lena'}, convo:'lena_wake'},
      {if:{flag:'woke_lena'}, alight:'lena'}
    ]},
    {id:'depot_end', name:'Depot', sched:95, landmark:'depot', final:true, steps:[
      {if:{aboard:'lena'}, convo:'lena_depot'},
      {alight:'lena'},
      {convo:'walter_depot'},
      {convo:'dispatch_end'},
      {end:true}
    ]}
  ],

  /* segments[i] = drive from stops[i] to stops[i+1]. at = progress 0..1 */
  segments:[
    {street:'Corliss St', events:[
      {at:0.0, hint:'drive'},
      {at:0.04, convo:'walter_advice'},
      {at:0.47, if:{all:[{flag:'got_pothole_tip'},{aboard:'walter'}]}, bark:{who:'walter', text:'Here it comes. Left side. Ease off.'}, set:{'flag.pothole_warned':true}},
      {at:0.53, pothole:{
        soft:[{set:{'flag.dodged_pothole_mon':true}}, {if:{flag:'pothole_warned'}, bark:{who:'walter', text:'There you go.'}, set:{'trust.walter':'+1'}}],
        hard:[{set:{'flag.hit_pothole_mon':true}}, {if:{aboard:'odessa'}, bark:{who:'odessa', text:'Oh!'}}, {if:{aboard:'walter'}, bark:{who:'walter', text:'That’s the one.', delay:0.9}}]
      }},
      {at:0.6, convo:'odessa_crossword'}
    ]},
    {street:'Tanner Ave', events:[
      {at:0.05, convo:'lena_hello'},
      {at:0.45, do:'sleep:lena'},
      {at:0.56, redlight:true, convo:'mom_text'},
      {at:0.8, convo:'walter_mill'}
    ]},
    {street:'Mill Rd', events:[
      {at:0.08, if:{all:[{aboard:'calvin'},{'trust.calvin':'>=1'}]}, convo:'calvin_talk'},
      {at:0.12, if:{all:[{aboard:'calvin'},{'trust.calvin':'<1'}]}, hint:'Calvin sits at the back, watching his reflection.'},
      {at:0.62, convo:'walter_diner'}
    ]},
    {street:'Quill St', events:[
      {at:0.12, if:{aboard:'runner'}, bark:{who:'runner', text:'Made it. Thanks.'}},
      {at:0.3, if:{noticedCount:'<1'}, convo:'walter_mirror_hint'},
      {at:0.6, if:{aboard:'lena'}, bark:{who:'lena', text:'mm… bed four… juice…'}}
    ]},
    {street:'Harbor Blvd', events:[
      {at:0.2, if:{aboard:'lena'}, convo:'walter_lena'},
      {at:0.7, if:{aboard:'lena'}, bark:{who:'lena', text:'…five more minutes…'}}
    ]},
    {street:'8th & Vale', events:[
      {at:0.1, convo:'walter_end'},
      {at:0.82, convo:'dispatch_home'}
    ]}
  ],

  /* Things you can notice in the rearview mirror */
  details:[
    {id:'odessa_crossword', who:'odessa', flag:'noticed_odessa_crossword', label:'Odessa’s crossword', spot:'lap', rect:[-55,62,110,46],
      text:'Half the squares are filled in a different hand. Neater. Older ink. The new letters are hers.'},
    {id:'walter_badge', who:'walter', flag:'noticed_walter_badge', label:'Walter’s badge', spot:'chest', rect:[-62,42,40,40],
      text:'Pinned inside his coat, where only the mirror can see it: an old Route 9 driver’s badge. No. 4471.'},
    {id:'calvin_briefcase', who:'calvin', flag:'noticed_calvin_briefcase', label:'Calvin’s briefcase', spot:'lap', rect:[-58,62,116,56],
      text:'The briefcase has slipped open a crack. Nothing inside. Not a paper. Not a pen.'},
    {id:'lena_lanyard', who:'lena', flag:'noticed_lena_note', label:'Lena’s lanyard', spot:'chest', rect:[-14,44,30,46],
      text:'L. OKAFOR, RN. A sticky note on the back: “Mia — 7am!! don’t be late.”'},
    {id:'runner_ticket', who:'runner', flag:'noticed_runner_ticket', label:'The kid’s ticket', spot:'lap', rect:[-16,60,52,30],
      text:'Tucked in his duffel strap: a one-way train ticket. Northfield, 1:05 AM.'}
  ],

  /* End-of-night card: first matching line per passenger */
  summary:[
    {who:'walter', lines:[
      {if:{flag:'walter_badge_talk'}, text:'Walter told you about badge 4471. He doesn’t tell everyone.'},
      {if:{flag:'told_route_cut'}, text:'Walter knows about Friday. He didn’t say anything else about it.'},
      {if:{'trust.walter':'>=2'}, text:'Walter stayed in his seat at the depot, watching the rain. He seemed glad of the company.'},
      {text:'Walter was still in his seat when you clocked out.'}]},
    {who:'odessa', lines:[
      {if:{all:[{flag:'odessa_on_time'},{flag:'asked_about_henry'}]}, text:'Odessa got there in time. Across and down, forty-four years.'},
      {if:{flag:'odessa_on_time'}, text:'Odessa got there in time.'},
      {text:'Odessa got there late. She didn’t say anything about it.'}]},
    {who:'lena', lines:[
      {if:{flag:'woke_lena_mia'}, text:'Lena made it home. Mia will have her mom at seven.'},
      {if:{flag:'woke_lena'}, text:'Lena made it home, half awake.'},
      {if:{flag:'lena_rested'}, text:'Lena slept the whole loop. Best sleep in a month, she said.'},
      {text:'Lena woke up at the depot, a long way from home. She called a cab.'}]},
    {who:'calvin', lines:[
      {if:{flag:'calvin_walked'}, text:'Calvin walked home from the Mill in the rain.'},
      {if:{flag:'reported_calvin'}, text:'Calvin didn’t look up when he got off.'},
      {if:{flag:'calvin_confessed'}, text:'Calvin told you the truth. “Same office tomorrow,” he said.'},
      {if:{'trust.calvin':'>=1'}, text:'Calvin nodded at you when he got off.'},
      {text:'Calvin didn’t look up when he got off.'}]},
    {who:'runner', lines:[
      {if:{flag:'wished_runner_luck'}, text:'The kid in the red hoodie ran for his train to Northfield. You wished him luck.'},
      {if:{flag:'waited_for_runner_mon'}, text:'The kid in the red hoodie made his train. Probably.'},
      {text:'The kid in the red hoodie stopped running. He got smaller in the mirror.'}]},
    {who:'mom', lines:[
      {if:{flag:'mom_honest'}, text:'Mom says there’s arroz in the fridge. The good one.'},
      {if:{flag:'told_mom_ate'}, text:'You told Mom you ate. You didn’t.'},
      {text:'Mom’s text is still unread.'}]}
  ],

  /* ---------------------------- CONVOS ----------------------------
     node: {id?, speaker, expr, text, if, else, set, do, next, end, choices:[{text, if, eye, set, do, next}], silence:{set, next}}
     next defaults to the following node in the list.                       */
  convos:{
    dispatch_intro:{with:null, nodes:[
      {speaker:'narr', text:'Depot 3. 11:40 PM. Rain on the roof like someone drumming their fingers.'},
      {speaker:'dispatch', text:'Route 9, Dispatch. You on, Dani?'},
      {choices:[
        {text:'On and dripping.', next:'memo'},
        {text:'Here, Bev.', next:'memo'}],
       silence:{next:'static'}},
      {id:'static', speaker:'dispatch', expr:'warm', text:'I’ll take the static as a yes.'},
      {id:'memo', speaker:'dispatch', text:'Listen. Memo came down from the fourth floor tonight.'},
      {speaker:'dispatch', expr:'sad', text:'They’re cutting Route 9. Friday’s the last run.'},
      {choices:[
        {text:'Cut? It’s the only bus out past the Mill.', next:'chart'},
        {text:'Friday. This Friday?', next:'four'}],
       silence:{next:'pause'}},
      {id:'chart', speaker:'dispatch', text:'Ridership numbers. Somebody made a chart. The chart won.', next:'secret'},
      {id:'four', speaker:'dispatch', text:'This Friday. Four more nights after tonight.', next:'secret'},
      {id:'pause', speaker:'dispatch', expr:'sad', text:'…Yeah. That’s about what I said too.'},
      {id:'secret', speaker:'dispatch', text:'One more thing. Don’t tell the passengers. Company wants to “manage the messaging.”'},
      {choices:[
        {text:'Copy.', next:'safe'},
        {text:'They ride every night, Bev.', next:'iknow'}],
       silence:{next:'safe'}},
      {id:'iknow', speaker:'dispatch', expr:'sad', text:'I know, hon. I know.'},
      {id:'safe', speaker:'dispatch', expr:'warm', text:'Drive safe. Roads are slick out past the Waterfront.'}
    ]},

    walter_intro:{with:'walter', nodes:[
      {speaker:'walter', expr:'warm', text:'Evening, driver.'},
      {speaker:'walter', text:'Bad news on the radio? You’ve got the face.'},
      {choices:[
        {text:'Just dispatch being dispatch.', set:{'flag.hid_route_cut':true}, next:'day'},
        {text:'They’re cutting the route. Friday’s the last run.', set:{'flag.told_route_cut':true,'trust.walter':'+1'}, next:'huh'}],
       silence:{set:{'trust.walter':'+1'}, next:'mm'}},
      {id:'day', speaker:'walter', text:'Mm. They were like that in my day too.', end:true},
      {id:'huh', speaker:'walter', expr:'sad', text:'Huh.'},
      {speaker:'walter', text:'Thirty-one years I drove this loop. They tried to cut it twice.'},
      {speaker:'walter', expr:'warm', text:'Third time’s somebody’s charm, I guess. Not mine.', end:true},
      {id:'mm', speaker:'walter', text:'Mm.'},
      {speaker:'walter', text:'I drove this route thirty-one years. I know what that radio voice sounds like.'}
    ]},

    odessa_hello:{with:'odessa', nodes:[
      {speaker:'odessa', expr:'warm', text:'Evening, Walter. Evening, driver.'},
      {speaker:'walter', expr:'warm', text:'Odessa.'},
      {speaker:'odessa', text:'Hospital, please. Same as always.'}
    ]},

    walter_advice:{with:'walter', nodes:[
      {speaker:'walter', text:'First week on the night loop?'},
      {choices:[
        {text:'Second.', next:'pot'},
        {text:'Is it that obvious?', next:'owes'}],
       silence:{next:'pot'}},
      {id:'owes', speaker:'walter', expr:'warm', text:'You hold the wheel like it owes you money.'},
      {id:'pot', speaker:'walter', text:'Corliss Street, past the laundromat. Pothole. Left side.', set:{'flag.got_pothole_tip':true}},
      {speaker:'walter', text:'Ate my hubcap in ’96. They fix everything on this route except that.'},
      {choices:[
        {text:'Thanks, Walter.', next:'mirror'},
        {text:'Did you ever get the hubcap back?', set:{'trust.walter':'+1'}, next:'wall'}],
       silence:{next:'mirror'}},
      {id:'wall', speaker:'walter', expr:'warm', text:'Lady at the laundromat hung it on the wall. It’s still there too.'},
      {id:'mirror', speaker:'walter', text:'And check your mirror now and then. You’d be surprised what people carry.', do:'hint:mirror'}
    ]},

    odessa_crossword:{with:'odessa', nodes:[
      {speaker:'odessa', text:'Driver. Five letters. “A watch kept through the night.”'},
      {speaker:'odessa', text:'There’s a G in the middle.'},
      {choices:[
        {text:'Vigil.', set:{'flag.solved_crossword':true,'trust.odessa':'+1'}, next:'yes'},
        {text:'Guard?', next:'guard'},
        {text:'Is that Henry’s handwriting in the other squares?', eye:true, if:{flag:'noticed_odessa_crossword'}, set:{'flag.asked_about_henry':true,'trust.odessa':'+2'}, next:'eyes'}],
       silence:{set:{'flag.odessa_opened_up':true,'trust.odessa':'+1'}, next:'quiet'}},
      {id:'yes', speaker:'odessa', expr:'surprised', text:'Vigil. Yes.'},
      {speaker:'odessa', expr:'warm', text:'Henry would have had it before I finished reading.', next:'floor'},
      {id:'guard', speaker:'odessa', expr:'warm', text:'Guard has its G in the front, dear.'},
      {speaker:'odessa', text:'…Vigil. There. Thank you for trying.', next:'floor'},
      {id:'eyes', speaker:'odessa', expr:'surprised', text:'You have good eyes for a bus driver.'},
      {speaker:'odessa', expr:'warm', text:'He does the across. I do the down. Forty-four years.'},
      {speaker:'odessa', expr:'sad', text:'His hands aren’t steady right now. So I bring it, and I do both.'},
      {speaker:'odessa', text:'Vigil, by the way. I had it already. I wanted to see if you would.', end:true},
      {id:'quiet', speaker:'narr', text:'Her pencil moves. The wipers keep time.'},
      {speaker:'odessa', text:'…Vigil.'},
      {speaker:'odessa', expr:'sad', text:'That’s what the nurses call it. What I do every night. Sitting with him.', end:true},
      {id:'floor', speaker:'odessa', text:'Henry’s on the fourth floor. They let me sit with him until two.'},
      {choices:[
        {text:'How’s he doing?', next:'can'},
        {text:'Tell him Route 9 says hello.', set:{'trust.odessa':'+1'}, next:'hello'}],
       silence:{set:{'trust.odessa':'+1'}, next:'notask'}},
      {id:'can', speaker:'odessa', expr:'sad', text:'He’s doing what he can.', end:true},
      {id:'hello', speaker:'odessa', expr:'warm', text:'He’ll like that. He always said this bus has squeaky brakes.', end:true},
      {id:'notask', speaker:'odessa', expr:'warm', text:'…Thank you for not asking.'}
    ]},

    odessa_bye:{with:'odessa', nodes:[
      {speaker:'odessa', expr:'warm', text:'Goodnight, Walter. Goodnight, driver.'},
      {if:{flag:'odessa_on_time'}, speaker:'odessa', expr:'warm', text:'Right on time. He’ll still be awake.', end:true},
      {speaker:'odessa', expr:'sad', text:'Well. He’ll still be there.'}
    ]},

    lena_hello:{with:'lena', nodes:[
      {speaker:'lena', text:'Is it always this warm in here, or am I dying?'},
      {choices:[
        {text:'Heater’s stuck on. Since August.', set:{'trust.lena':'+1'}, next:'heat'},
        {text:'Long shift?', set:{'trust.lena':'+1'}, next:'double'}],
       silence:{set:{'flag.lena_quiet':true,'trust.lena':'+1'}, next:'thanks'}},
      {id:'heat', speaker:'lena', expr:'warm', text:'Don’t fix it. Please. Don’t ever fix it.', next:'stop'},
      {id:'double', speaker:'lena', text:'Double. Sixteen hours.'},
      {speaker:'lena', expr:'warm', text:'A man on my floor told me I had kind hands. Then he threw his juice at me.'},
      {speaker:'lena', text:'Both true, honestly.', next:'stop'},
      {id:'thanks', speaker:'lena', expr:'sad', text:'…Thank you. Everyone in that building wants me to talk.'},
      {id:'stop', speaker:'lena', text:'I’m at the Waterfront. Wake me if I—'},
      {speaker:'lena', expr:'warm', text:'I won’t fall asleep. I never fall asleep.', do:'sleep:lena'}
    ]},

    mom_text:{with:null, phone:true, nodes:[
      {speaker:'mom', text:'you eating? love you'},
      {choices:[
        {text:'Yes, Ma. Love you.', set:{'flag.told_mom_ate':true}, next:'good'},
        {text:'Not yet. Soon. Love you.', set:{'flag.mom_honest':true}, next:'arroz'}],
       silence:{set:{'flag.mom_unanswered':true}, next:'green'}},
      {id:'good', speaker:'mom', text:'good. text me when ur home', end:true},
      {id:'arroz', speaker:'mom', text:'there’s arroz in the fridge. the good one. love u', end:true},
      {id:'green', speaker:'narr', text:'The light turns green before you answer.'}
    ]},

    walter_mill:{with:'walter', nodes:[
      {speaker:'walter', text:'Old Mill’s next. My father worked there twenty-two years.'},
      {choices:[
        {text:'What did they make?', next:'thread'},
        {text:'Nobody gets on at the Mill anymore.', next:'most'}],
       silence:{next:'whistle'}},
      {id:'thread', speaker:'walter', expr:'warm', text:'Thread. Miles of it. Whole city’s stitched together with it somewhere.', next:'look'},
      {id:'most', speaker:'walter', text:'Most nights.', next:'look'},
      {id:'whistle', speaker:'walter', text:'Shift whistle used to go at midnight. You could hear it from the harbor.'},
      {id:'look', speaker:'walter', text:'Somebody’s under the lamp tonight, though. Look.'}
    ]},

    calvin_fare:{with:'calvin', header:'RULE CALL', timer:12, nodes:[
      {speaker:'narr', text:'The fare box blinks red. No tap.'},
      {speaker:'calvin', text:'Ah. My card’s — I must have left it at the office.'},
      {speaker:'calvin', text:'Long day.'},
      {choices:[
        {text:'It’s fine. Go sit down.', set:{'flag.let_calvin_ride':true,'flag.bent_rule_mon':true,'trust.calvin':'+1'}, next:'thank'},
        {text:'It’s two-fifty. Cash works too.', next:'cash'},
        {text:'I’m supposed to call that in.', set:{'flag.reported_calvin':true,'trust.calvin':'-2'}, do:'radio', next:'logged'}],
       silence:{set:{'flag.let_calvin_ride':true,'flag.bent_rule_mon':true}, next:'nothing'}},
      {id:'thank', speaker:'calvin', expr:'surprised', text:'…Thank you. It won’t happen again.', end:true},
      {id:'cash', speaker:'narr', text:'He pats his pockets. Then the other pockets.'},
      {speaker:'calvin', expr:'sad', text:'A dollar eighty-five. And a button.'},
      {choices:[
        {text:'Close enough.', set:{'flag.calvin_paid_some':true,'trust.calvin':'+1'}, next:'button'},
        {text:'Then I can’t take you. Sorry.', set:{'flag.calvin_walked':true,'trust.calvin':'-3'}, next:'fair'}],

      {speaker:'calvin', expr:'sad', text:'…Right. Of course.', end:true},
      {id:'nothing', speaker:'narr', text:'You don’t say anything. Neither does he.'},
      {speaker:'calvin', text:'I’ll just — I’ll sit.'}

    calvin_talk:{with:'calvin', nodes:[
      {speaker:'calvin', text:'Quiet route.'},
      {speaker:'calvin', text:'I’m usually on an earlier bus. Late night at the office.'},
      {choices:[
        {text:'What do you do?', next:'logi'},
        {text:'Your office is out by the Mill?', next:'sat'},
        {text:'Your briefcase is empty.', eye:true, if:{flag:'noticed_calvin_briefcase'}, set:{'flag.calvin_confessed':true,'trust.calvin':'+2'}, next:'empty'}],
       silence:{set:{'flag.calvin_hinted':true,'trust.calvin':'+1'}, next:'hint'}},
      {id:'logi', speaker:'calvin', text:'Logistics. Regional. I move things from where they are to where they need to be.'},
      {speaker:'calvin', expr:'sad', text:'Lately, mostly myself.', end:true},
      {id:'sat', speaker:'calvin', expr:'surprised', text:'Satellite office. It’s… new.'},
      {speaker:'walter', text:'Mill’s been closed since ’09, son.', set:{'flag.calvin_caught_lie':true}},
      {speaker:'calvin', expr:'sad', text:'…Yeah.', end:true},
      {id:'empty', speaker:'calvin', expr:'surprised', text:'…'},
      {speaker:'calvin', expr:'sad', text:'Eleven weeks. I put on the suit. I take the 7:10 in. I sit in the library until it closes.'},
      {speaker:'calvin', text:'Then I walk until it’s late enough to come home.'},
      {speaker:'calvin', expr:'sad', text:'My wife thinks I got promoted. Longer hours.'},
      {choices:[
        {text:'I won’t tell anybody.', set:{'trust.calvin':'+1'}, next:'thx'},
        {text:'You should tell her.', set:{'flag.told_calvin_tell_wife':true}, next:'tomorrow'}],
       silence:{set:{'trust.calvin':'+1'}, next:'loud'}},
      {id:'thx', speaker:'calvin', expr:'warm', text:'Thanks. That’s — thanks.', end:true},
      {id:'tomorrow', speaker:'calvin', expr:'sad', text:'I know. Tomorrow. I keep saying tomorrow.', end:true},
      {id:'loud', speaker:'calvin', expr:'warm', text:'…Feels better, saying it out loud. Weirdly.', end:true},
      {id:'hint', speaker:'calvin', text:'…'},
      {speaker:'calvin', expr:'sad', text:'You ever keep doing something because stopping means you have to say why?'},
      {choices:[
        {text:'Every night, kind of.', set:{'trust.calvin':'+1'}, next:'ha'},
        {text:'What aren’t you saying?', next:'nothing2'}],
       silence:{next:'never'}},
      {id:'ha', speaker:'calvin', expr:'warm', text:'Ha. Yeah. Thought so.', end:true},
      {id:'nothing2', speaker:'calvin', text:'Nothing. Long day at the office.', end:true},
      {id:'never', speaker:'calvin', text:'…Never mind. Long day.'}
    ]},

    walter_diner:{with:'walter', nodes:[
      {speaker:'walter', text:'Lucky Star’s coming up. Best pie on the route. Worst coffee in the city.'},
      {choices:[
        {text:'What’s the pie tonight?', next:'cherry'},
        {text:'You still wear your badge.', eye:true, if:{all:[{flag:'noticed_walter_badge'},{not:'walter_badge_talk'}]}, set:{'flag.walter_badge_talk':true,'trust.walter':'+2'}, next:'badge'}],
       silence:{next:'dot'}},
      {id:'cherry', speaker:'walter', expr:'warm', text:'Cherry. Always cherry on Mondays. Ask for Dot.', end:true},
      {id:'badge', speaker:'walter', expr:'surprised', text:'…Inside the coat. Where it doesn’t bother anybody.'},
      {speaker:'walter', expr:'warm', text:'Number 4471. They gave me a plaque when I retired. Gave the plaque to my sister. Kept the badge.'},
      {speaker:'walter', text:'A plaque can’t tell you what route it drove.', end:true},
      {id:'dot', speaker:'walter', text:'Dot’ll wave. She always waves at the bus.'}

    runner_choice:{with:null, header:'WAIT OR LEAVE', timer:7, nodes:[
      {speaker:'narr', text:'Someone’s running for the bus. Red hoodie, duffel bag, a block back.'},

      {if:{'trust.calvin':'>=1'}, speaker:'calvin', text:'Night. Thanks for the ride.', end:true},
      {speaker:'narr', text:'Calvin gets off without a word.'}
    ]},

    runner_bye:{with:'runner', nodes:[
      {speaker:'runner', text:'Hey. Thanks for waiting back there.'},
      {choices:[
        {text:'Go. You’ll make it.', next:'yeah'},

      {id:'most', speaker:'walter', expr:'warm', text:'Most people on this bus do.', end:true},
      {id:'know', speaker:'walter', expr:'warm', text:'Then you know what to do.', end:true},
      {id:'rain', speaker:'walter', text:'…Rain’s letting up.'}

      {speaker:'narr', text:'Waterfront. Lena’s still asleep, her cheek against the cold window.'},
      {choices:[

        {text:'Let her sleep. One more loop.', say:'(You let her sleep.)', set:{'flag.let_lena_sleep':true}, next:'soft'}],
       silence:{set:{'flag.let_lena_sleep':true}, next:'stir'}},
      {id:'wasnt', speaker:'lena', expr:'surprised', text:'I wasn’t asleep.'},
      {speaker:'lena', expr:'warm', text:'…I was asleep. Thank you.', end:true},
      {id:'note', speaker:'lena', expr:'surprised', text:'How do you — oh. The note.'},
      {speaker:'lena', expr:'warm', text:'Thank you. Seriously.', end:true},
      {id:'soft', speaker:'narr', text:'You close the doors softly.', end:true},
      {id:'stir', speaker:'narr', text:'The doors close. She doesn’t stir.'}
    ]},

    walter_end:{with:'walter', nodes:[
      {speaker:'walter', text:'Last stretch.'},
      {speaker:'walter', text:'You know the best part of this route?'},
      {choices:[
        {text:'The pothole.', next:'second'},
        {text:'The pie.', next:'third'}],
       silence:{next:'reg'}},
      {id:'second', speaker:'walter', expr:'warm', text:'Ha. Second best.', next:'reg'},
      {id:'third', speaker:'walter', text:'Third.', next:'reg'},
      {id:'reg', speaker:'walter', expr:'warm', text:'The regulars. You can’t fix anybody’s night. But you get to see how it ends.'},
      {if:{flag:'told_route_cut'}, speaker:'walter', expr:'sad', text:'Four more nights, then.', else:'same'},
      {speaker:'walter', expr:'warm', text:'Better make them good ones.', end:true},
      {id:'same', speaker:'walter', text:'Same faces tomorrow. Mostly.'}
    ]},

    dispatch_home:{with:null, nodes:[
      {speaker:'dispatch', expr:'warm', text:'Route 9, Dispatch. Bring her home, Dani.'}
    ]},

    lena_depot:{with:'lena', nodes:[
      {speaker:'lena', expr:'surprised', text:'Is this — that’s the depot.', do:'wake:lena'},
      {if:{'trust.lena':'>=2'}, speaker:'lena', expr:'warm', text:'…That’s the best I’ve slept in a month. Don’t tell anyone I said that.', set:{'flag.lena_rested':true}, next:'cab'},

      {id:'cab', speaker:'lena', text:'I’ll get a cab.'}
    ]},

    walter_depot:{with:'walter', nodes:[
      {speaker:'narr', text:'Walter doesn’t get up.'},
      {speaker:'walter', expr:'warm', text:'I’ll sit a minute. Go on, clock out.'},
      {choices:[
        {text:'Night, Walter.', next:'end'},
        {text:'Night, 4471.', eye:true, if:{all:[{flag:'noticed_walter_badge'},{not:'walter_badge_talk'}]}, set:{'trust.walter':'+1','flag.called_4471':true}, next:'num'}],
       silence:{next:'cap'}},
      {id:'num', speaker:'walter', expr:'surprised', text:'…Night, driver.', end:true},
      {id:'cap', speaker:'narr', text:'He tips his cap anyway.', end:true},
      {id:'end', speaker:'walter', expr:'warm', text:'Same time tomorrow.'}
    ]},

    dispatch_end:{with:null, nodes:[
      {speaker:'dispatch', expr:'warm', text:'Route 9, welcome home.'},
      {if:{flag:'let_calvin_ride'}, speaker:'dispatch', text:'Fare box flagged a no-pay at Old Mill.', else:'late'},
      {if:{late:'>=3'}, speaker:'dispatch', expr:'sad', text:'That, plus a late loop. I have to write it up, Dani. Sorry.', set:{'writeups':'+1','flag.writeup_fare_mon':true}, else:'slide', next:'late'},

      {id:'late', if:{late:'>=6'}, speaker:'dispatch', text:'You were behind most of the night. Tomorrow, tighter.', else:'clean', end:true},
      {id:'clean', speaker:'dispatch', expr:'warm', text:'Go home. Eat something.'}
    ]}
  }
};

      {choices:[
        {text:'Just tired.', next:'tired'},
        {text:'Did you ever have a route you didn’t want to end?', set:{'flag.hinted_route_tue':true,'trust.walter':'+1'}, next:'ever'}],
       silence:{set:{'trust.walter':'+1'}, next:'mind'}},
      {id:'tired', speaker:'walter', text:'Tired looks different. But okay.', end:true},
      {id:'ever', speaker:'walter', expr:'surprised', text:'…Every one of them.'},
      {speaker:'walter', text:'Why do you ask?'},
      {choices:[{text:'No reason.', next:'mmhm'}], silence:{next:'thought'}},
      {id:'mmhm', speaker:'walter', text:'Mm-hm.', end:true},
      {id:'thought', speaker:'walter', expr:'sad', text:'That’s what I thought.', set:{'flag.walter_suspects':true}, end:true},
      {id:'mind', speaker:'walter', expr:'warm', text:'I’ll mind my own business. For about a mile.'}
    ]},

    odessa_hello_tue:{with:'odessa', nodes:[
      {speaker:'odessa', expr:'warm', text:'Evening, Walter. Evening, driver.'},
      {speaker:'walter', expr:'warm', text:'Odessa.'},
      {if:{flag:'solved_crossword'}, speaker:'odessa', expr:'warm', text:'Henry says hello to the driver who knew “vigil.”', end:true},
      {if:{flag:'asked_about_henry'}, speaker:'odessa', expr:'warm', text:'I told Henry you noticed his handwriting. He was pleased. He won’t admit it.', end:true},
      {speaker:'odessa', text:'Hospital, please.'}
    ]},

    odessa_cross_tue:{with:'odessa', nodes:[
      {speaker:'odessa', expr:'warm', text:'He’s a little better tonight. He ate the pudding. All of it.'},
      {choices:[
        {text:'That’s good news.', next:'good'},
        {text:'What kind of pudding?', set:{'trust.odessa':'+1'}, next:'pud'}],
       silence:{next:'jinx'}},
      {id:'good', speaker:'odessa', expr:'warm', text:'It is. I’m trying not to hold on to it too tight.', next:'clue'},
      {id:'pud', speaker:'odessa', expr:'warm', text:'Butterscotch. He hates butterscotch. That’s how hungry he was.', next:'clue'},
      {id:'jinx', speaker:'odessa', text:'You can say it’s good. I won’t jinx it.'},
      {id:'clue', speaker:'odessa', text:'Five letters. “Recover, as a patient might.” Starts with R.'},
      {choices:[
        {text:'Rally.', set:{'flag.solved_crossword_tue':true,'trust.odessa':'+1'}, next:'rally'},
        {text:'Mend?', next:'mend'},
        {text:'Henry filled in a square tonight, didn’t he?', eye:true, if:{flag:'noticed_odessa_square'}, set:{'flag.henry_square_talk':true,'trust.odessa':'+2'}, next:'square'}],
       silence:{set:{'trust.odessa':'+1'}, next:'pen'}},
      {id:'rally', speaker:'odessa', expr:'surprised', text:'Rally.'},
      {speaker:'odessa', expr:'warm', text:'That’s what the doctor said this afternoon. “He’s rallying.”', end:true},
      {id:'mend', speaker:'odessa', expr:'warm', text:'Four letters, dear. Close, though. Mending is the idea.'},
      {speaker:'odessa', text:'Rally. There.', end:true},
      {id:'square', speaker:'odessa', expr:'surprised', text:'He did. One square. Top corner.'},
      {speaker:'odessa', expr:'warm', text:'His R still leans left. Forty-four years, and it still leans left.', end:true},
      {id:'pen', speaker:'odessa', text:'…Rally.'},
      {speaker:'odessa', expr:'sad', text:'I’m afraid to write it in pen.'}
    ]},

    odessa_bye_tue:{with:'odessa', nodes:[
      {speaker:'odessa', expr:'warm', text:'Goodnight, both of you.'},
      {if:{flag:'odessa_on_time_tue'}, speaker:'odessa', expr:'warm', text:'Right on time again. I could get used to this.', end:true},
      {speaker:'odessa', expr:'sad', text:'Late. Well. The pudding will have kept him company.'}
    ]},

    lena_hello_tue:{with:'lena', nodes:[
      {if:{flag:'let_lena_sleep'}, speaker:'lena', expr:'warm', text:'You.', else:'thanks'},
      {if:{flag:'lena_rested'}, speaker:'lena', expr:'warm', text:'You let me sleep the whole loop. Best sleep I’ve had in a month.', else:'cab'},
      {speaker:'lena', text:'I’m still mad about it. A little. Like, four percent.', next:'ask'},
      {id:'cab', speaker:'lena', text:'Thirty-four dollars, that cab. I’m sending the city an invoice.'},
      {speaker:'lena', expr:'warm', text:'Kidding. Mostly.', next:'ask'},
      {id:'thanks', if:{flag:'woke_lena_mia'}, speaker:'lena', expr:'warm', text:'You knew about Mia last night. I don’t know how. Thank you.', else:'thanks2', next:'ask'},
      {id:'thanks2', speaker:'lena', expr:'warm', text:'Hey. Thanks for waking me last night. Really.'},
      {id:'ask', speaker:'lena', text:'Wake me tonight? Please. Same stop.', set:{'flag.lena_asked_wake_tue':true}},
      {choices:[
        {text:'I will.', set:{'trust.lena':'+1'}, next:'will'},
        {text:'Only if you snore less.', set:{'trust.lena':'+1'}, next:'snore'},
        {text:'Mia has a recital Thursday?', eye:true, if:{flag:'noticed_lena_recital'}, set:{'flag.lena_recital_talk':true,'trust.lena':'+2'}, next:'recital'}],
       silence:{next:'nod'}},
      {id:'will', speaker:'lena', expr:'warm', text:'Thank you.', do:'sleep:lena', end:true},
      {id:'snore', speaker:'lena', expr:'surprised', text:'I do not snore.'},
      {speaker:'lena', text:'…Walter. Do I snore?'},
      {speaker:'walter', expr:'warm', text:'Like a ferry horn.', do:'sleep:lena', end:true},
      {id:'recital', speaker:'lena', expr:'surprised', text:'Six PM. Thursday. She’s a tree. The tree has one line.'},
      {speaker:'lena', expr:'sad', text:'I haven’t asked for the night off yet. I keep not asking.', do:'sleep:lena', end:true},
      {id:'nod', speaker:'lena', text:'I’ll take that as a yes.', do:'sleep:lena'}
    ]},

    mom_text_tue:{with:null, phone:true, nodes:[
      {if:{flag:'mom_honest'}, speaker:'mom', text:'did u eat the arroz', next:'c1'},
      {if:{flag:'told_mom_ate'}, speaker:'mom', text:'tía rosa says she saw u at the gas station at 2am buying coffee. coffee is not dinner dani', next:'c2'},
      {speaker:'mom', text:'u didnt answer last night. just tell me ur ok'},
      {choices:[
        {text:'I’m okay, Ma. Sorry.', set:{'flag.mom_ok_tue':true}, next:'love'},
        {text:'Driving. Talk tomorrow?', next:'love'}],
       silence:{set:{'flag.mom_unanswered_tue':true}, next:'green'}},
      {id:'c1', choices:[
        {text:'Every bite. It was perfect.', set:{'flag.mom_happy_tue':true}, next:'recipe'},
        {text:'Saving some for Friday.', set:{'flag.mom_friday_hint':true}, next:'friday'}],
       silence:{set:{'flag.mom_unanswered_tue':true}, next:'green'}},
      {id:'recipe', speaker:'mom', text:'ur grandma’s recipe. dont tell ur tía i gave u the big container', next:'love'},
      {id:'friday', speaker:'mom', text:'whats friday', next:'love'},
      {id:'c2', choices:[
        {text:'Busted. I’ll eat, Ma.', set:{'flag.mom_honest_tue':true}, next:'eat'},
        {text:'Tía Rosa needs glasses.', set:{'flag.mom_lie_tue':true}, next:'glasses'}],
       silence:{set:{'flag.mom_unanswered_tue':true}, next:'green'}},
      {id:'eat', speaker:'mom', text:'there’s still arroz. EAT IT', next:'love'},
      {id:'glasses', speaker:'mom', text:'tía rosa has perfect eyes and a big mouth', next:'love'},
      {id:'love', speaker:'mom', text:'love u. drive slow in the rain', end:true},
      {id:'green', speaker:'narr', text:'The light turns green. The phone goes dark on your knee.'}
    ]},

    walter_mill_tue:{with:'walter', nodes:[
      {speaker:'walter', text:'Two under the lamp tonight. One of them’s got a guitar.'},
      {choices:[
        {text:'And the other one?', next:'other'},
        {text:'A guitar. On my bus.', next:'trumpet'}],
       silence:{next:'side'}},
      {id:'other', if:{flag:'reported_calvin'}, speaker:'walter', text:'Your fella from last night. Looking at the bus like it might bite.', else:'other2', end:true},
      {id:'other2', speaker:'walter', text:'Your fella from last night. Same suit.', end:true},
      {id:'trumpet', speaker:'walter', expr:'warm', text:'Man used to ride the 14 with a trumpet. I never let him play. Still think about that.', end:true},
      {id:'side', speaker:'walter', text:'Rain’s coming in sideways now.'}
    ]},

    calvin_fare_tue:{with:'calvin', header:'RULE CALL', timer:12, nodes:[
      {speaker:'narr', text:'The fare box beeps. Red again. Louder than you remember.'},
      {if:{any:[{flag:'let_calvin_ride'},{flag:'calvin_paid_some'}]}, speaker:'dispatch', text:'Route 9, Dispatch. Your fare count came up short last night. Anything I should know?', next:'cal'},
      {if:{flag:'reported_calvin'}, speaker:'dispatch', text:'Route 9. That no-fare you logged last night — he riding with you again?', next:'cal'},
      {speaker:'dispatch', text:'Route 9, your fare box is pinging. Everything okay out there?'},
      {id:'cal', if:{flag:'calvin_confessed'}, speaker:'calvin', expr:'sad', text:'I don’t have it tonight either. I was going to tell you before it beeped.', next:'choose'},
      {if:{flag:'reported_calvin'}, speaker:'calvin', expr:'sad', text:'Go ahead. Call it in. You did last time.', next:'choose'},
      {if:{flag:'calvin_walked'}, speaker:'calvin', expr:'sad', text:'Please. It’s raining harder than yesterday.', next:'choose'},
      {if:{'trust.calvin':'>=1'}, speaker:'calvin', expr:'sad', text:'Same driver. I’m — sorry. Again.', next:'choose'},
      {speaker:'calvin', text:'My card’s at the office.'},
      {id:'choose', choices:[
        {text:'“Fare box glitch, Bev. I’ll reset it.”', set:{'flag.covered_calvin_tue':true,'flag.bent_rule_tue':true,'trust.calvin':'+2'}, next:'cover'},
        {text:'Can you pay tonight, Calvin?', next:'ask'},
        {text:'“He’s on. No fare. Logging it.”', set:{'flag.reported_calvin_tue':true,'trust.calvin':'-2'}, do:'radio', next:'report'}],
       silence:{set:{'flag.covered_calvin_tue':true,'flag.bent_rule_tue':true}, next:'sil'}},
      {id:'cover', speaker:'dispatch', text:'…Copy. Glitchy box. Second night running.'},
      {speaker:'calvin', expr:'surprised', text:'…Thank you. I mean it.', end:true},
      {id:'ask', if:{flag:'calvin_confessed'}, speaker:'calvin', expr:'warm', text:'I brought coins. I counted them on the bench outside the library.', set:{'flag.calvin_paid_tue':true,'trust.calvin':'+1'}, next:'paid', else:'cant'},
      {id:'cant', speaker:'calvin', expr:'sad', text:'I — no. I don’t.'},
      {choices:[
        {text:'Then ride. Just tonight.', set:{'flag.covered_calvin_tue':true,'flag.bent_rule_tue':true,'trust.calvin':'+1'}, next:'tonight'},
        {text:'Then I have to report it.', set:{'flag.reported_calvin_tue':true,'trust.calvin':'-2'}, do:'radio', next:'report'}],
       silence:{set:{'flag.covered_calvin_tue':true,'flag.bent_rule_tue':true}, next:'tonight'}},
      {id:'tonight', speaker:'dispatch', text:'Route 9? You still there?'},
      {speaker:'narr', text:'You tell Bev it’s handled. She doesn’t sound convinced.', end:true},
      {id:'paid', speaker:'narr', text:'Two-fifty, in quarters and dimes. The fare box turns green.'},
      {speaker:'dispatch', expr:'warm', text:'Never mind, Route 9. Box shows paid.', end:true},
      {id:'report', speaker:'dispatch', text:'Copy. That’s two nights. They might flag his card, Dani.'},
      {speaker:'calvin', expr:'sad', text:'…Okay.', end:true},
      {id:'sil', speaker:'dispatch', text:'Route 9? …I’ll call it a glitch. Don’t make me call it twice.'}
    ]},

    calvin_talk_tue:{with:'calvin', nodes:[
      {if:{flag:'calvin_confessed'}, speaker:'calvin', text:'I applied for something today. Warehouse. Nights. Funny, right? Nights.', next:'job'},
      {speaker:'calvin', text:'Same office. Same late night.'},
      {choices:[
        {text:'How’s the office?', next:'office'},
        {text:'There’s a job listing in your pocket.', eye:true, if:{flag:'noticed_calvin_listing'}, set:{'flag.calvin_opened_tue':true,'trust.calvin':'+2'}, next:'listing'}],
       silence:{set:{'trust.calvin':'+1'}, next:'pretend'}},
      {id:'office', speaker:'calvin', expr:'sad', text:'Quiet. Very quiet.', end:true},
      {id:'listing', speaker:'calvin', expr:'surprised', text:'…You and that mirror.'},
      {speaker:'calvin', expr:'sad', text:'There’s no office. Hasn’t been for eleven weeks.', set:{'flag.calvin_confessed':true}},
      {speaker:'calvin', text:'Warehouse, nights. Interview Thursday. I underlined “no experience necessary.”', set:{'flag.calvin_job_tue':true}, end:true},
      {id:'pretend', speaker:'calvin', text:'…'},
      {speaker:'calvin', expr:'sad', text:'You don’t have to pretend you believe me. It’s nice that you do, though.', end:true},
      {id:'job', choices:[
        {text:'That’s not funny. That’s good.', set:{'flag.calvin_job_tue':true,'trust.calvin':'+1'}, next:'good'},
        {text:'Did you tell her yet?', next:'tell'},
        {text:'You underlined something.', eye:true, if:{flag:'noticed_calvin_listing'}, set:{'flag.calvin_job_tue':true,'trust.calvin':'+1'}, next:'under'}],
       silence:{set:{'flag.calvin_job_tue':true}, next:'jinx'}},
      {id:'good', speaker:'calvin', expr:'warm', text:'Interview’s Thursday. I’m wearing the suit. It finally has somewhere to go.', end:true},
      {id:'tell', if:{flag:'told_calvin_tell_wife'}, speaker:'calvin', expr:'sad', text:'You asked me that last night too. No. After Thursday.', else:'tell2', end:true},
      {id:'tell2', speaker:'calvin', expr:'sad', text:'Not yet. After Thursday. If.', end:true},
      {id:'under', speaker:'calvin', expr:'warm', text:'“No experience necessary.” First thing in eleven weeks that didn’t ask who I used to be.', end:true},
      {id:'jinx', speaker:'calvin', expr:'warm', text:'Interview’s Thursday. Don’t say anything. You’ll jinx it.'}
    ]},

    kit_hello_tue:{with:'kit', nodes:[
      {speaker:'kit', expr:'warm', text:'Sorry. I’m dripping on your bus.'},
      {choices:[
        {text:'Bus has seen worse.', next:'worse'},
        {text:'Big night?', next:'big'}],
       silence:{next:'quiet'}},
      {id:'worse', speaker:'kit', expr:'warm', text:'Ha. Okay. Good.', next:'pier'},
      {id:'big', speaker:'kit', text:'Maybe. Depends how my hands feel.', next:'pier'},
      {id:'quiet', speaker:'kit', text:'You’re the quiet kind. That’s good. I’m the nervous kind.'},
      {id:'pier', speaker:'kit', text:'Open mic at Pier 4. I go on last. Last means one in the morning.'},
      {speaker:'kit', expr:'sad', text:'Nobody stays for last.'},
      {speaker:'walter', expr:'warm', text:'I would.'}
    ]},

    kit_song_tue:{with:'kit', header:'RULE CALL', timer:12, nodes:[
      {speaker:'kit', text:'Can I ask something weird?'},
      {speaker:'kit', text:'Can I play one song? Just one. I need to hear it out loud once before strangers do.'},
      {speaker:'narr', text:'The sign by the door says NO MUSIC WITHOUT HEADPHONES. It has said that since before you were born.'},
      {choices:[
        {text:'One song. Go ahead. (costs 1 min)', set:{'flag.kit_played':true,'trust.kit':'+2','schedule':'+1'}, next:'play'},
        {text:'Sorry. Rules say no music.', set:{'flag.kit_declined':true}, next:'no'},
        {text:'You’re last on that setlist. Practice on us.', eye:true, if:{flag:'noticed_kit_setlist'}, set:{'flag.kit_played':true,'trust.kit':'+3','schedule':'+1'}, next:'setlist'}],
       silence:{set:{'flag.kit_declined':true}, next:'maybe'}},
      {id:'setlist', speaker:'kit', expr:'surprised', text:'You read my setlist? In the mirror?'},
      {speaker:'kit', expr:'warm', text:'Okay. For the people who stay for last.'},
      {id:'play', speaker:'kit', expr:'warm', text:'It’s called “Last Stop Lights.”', do:'song:start'},
      {waitSong:true},
      {if:{aboard:'walter'}, speaker:'walter', expr:'warm', text:'Hm. That was all right.'},
      {if:{aboard:'theo'}, speaker:'theo', expr:'surprised', text:'…That was really good.'},
      {speaker:'kit', expr:'warm', text:'Okay. I can do this. I can actually do this.', set:{'flag.kit_ready':true}, end:true},
      {id:'no', speaker:'kit', expr:'sad', text:'No, that’s fair. It’s your bus.'},
      {speaker:'kit', expr:'warm', text:'I’ll hum it in my head. You’ll never know how good it was.', end:true},
      {id:'maybe', speaker:'kit', expr:'sad', text:'…I’ll take that as a no. That’s okay.'}
    ]},

    kit_talk_tue:{with:'kit', nodes:[
      {if:{flag:'kit_played'}, speaker:'kit', expr:'warm', text:'First time anybody’s let me play it for real people.', next:'kp'},
      {speaker:'kit', text:'It’s fine about the song. Really. Buses are for sleeping. Ask her.', end:true},
      {id:'kp', choices:[
        {text:'It was good.', next:'good'},
        {text:'Who’s it about?', next:'who'}],
       silence:{next:'face'}},
      {id:'good', speaker:'kit', expr:'warm', text:'You have to say that. You’re a captive audience.', end:true},
      {id:'who', speaker:'kit', expr:'warm', text:'Everybody who rides the last bus. So, um. You.', set:{'flag.kit_song_about_you':true,'trust.kit':'+1'}, end:true},
      {id:'face', speaker:'kit', expr:'warm', text:'You don’t have to say anything. Your face did.'}
    ]},

    kit_bye_tue:{with:'kit', nodes:[
      {if:{flag:'kit_played'}, speaker:'kit', expr:'warm', text:'If they boo, I’m blaming you.', end:true},
      {speaker:'kit', text:'Wish me luck anyway.'}
    ]},

    walter_diner_tue:{with:'walter', nodes:[
      {speaker:'walter', expr:'warm', text:'Dot’s waving. Wave back, or she sulks for a week.'},
      {choices:[{text:'(Wave.)', say:'(You lift two fingers off the wheel.)', set:{'flag.waved_dot':true}, next:'wave'}], silence:{next:'sulk'}},
      {id:'wave', speaker:'narr', text:'Through the diner glass, Dot beams.', end:true},
      {id:'sulk', speaker:'walter', text:'She’ll sulk.'}
    ]},

    runner_choice_tue:{with:null, header:'WAIT OR LEAVE', timer:7, nodes:[
      {if:{flag:'waited_for_runner_mon'}, speaker:'narr', text:'The kid from last night. Red hoodie, the same duffel bag, running a block back. Again.', next:'ch'},
      {speaker:'narr', text:'Someone’s running for the bus. Red hoodie, a duffel bag bigger than he is.'},
      {id:'ch', choices:[
        {text:'Wait for him. (costs 2 min)', say:'(You keep the doors open.)', set:{'flag.waited_for_theo_tue':true,'trust.walter':'+1'}, do:'runner:wait', next:'end'},
        {text:'Leave on time.', say:'(You close the doors.)', set:{'flag.left_theo_tue':true}, do:'runner:leave', next:'end'}],
       silence:{set:{'flag.left_theo_tue':true}, do:'runner:leave', next:'hes'}},
      {id:'hes', speaker:'narr', text:'You hesitate. The doors close on schedule.', end:true},
      {id:'end', speaker:'narr', text:'', end:true}
    ]},

    theo_board_tue:{with:'theo', nodes:[
      {if:{flag:'waited_for_runner_mon'}, speaker:'theo', expr:'surprised', text:'You waited. Again. Okay, I owe you, like, two.', next:'name'},
      {speaker:'theo', text:'You’re the bus that left me yesterday.'},
      {speaker:'theo', expr:'warm', text:'It’s cool. I’d have left me too.'},
      {id:'name', speaker:'theo', text:'I’m Theo, by the way.', set:{'flag.theo_named':true}},
      {choices:[
        {text:'Dani.', set:{'trust.theo':'+1','flag.theo_knows_name':true}, next:'dani'},
        {text:'Central again?', next:'central'}],
       silence:{next:'phones'}},
      {id:'dani', speaker:'theo', expr:'warm', text:'Dani. Cool.', end:true},
      {id:'central', speaker:'theo', text:'Central. Yeah.', end:true},
      {id:'phones', speaker:'narr', text:'He nods and puts his headphones back on.'}
    ]},

    theo_talk_tue:{with:'theo', nodes:[
      {speaker:'narr', text:'His phone lights up. He turns it face-down on his knee.'},
      {speaker:'theo', text:'Sorry. It keeps doing that. It’s nothing.'},
      {choices:[
        {text:'You can answer it. I don’t mind.', next:'nah'},
        {text:'Seven missed calls is a lot of nothing.', eye:true, if:{flag:'noticed_theo_calls'}, set:{'flag.theo_opened_tue':true,'trust.theo':'+1'}, next:'calls'},
        {text:'One-way ticket, huh?', eye:true, if:{flag:'noticed_theo_ticket'}, set:{'flag.theo_opened_tue':true,'trust.theo':'+1'}, next:'ticket'},
        {text:'That bag looks like everything you own.', eye:true, if:{flag:'noticed_theo_bag'}, set:{'flag.theo_opened_tue':true,'trust.theo':'+1'}, next:'bag'}],
       silence:{set:{'trust.theo':'+1'}, next:'quiet'}},
      {id:'nah', speaker:'theo', text:'Nah. I know what they’ll say.', next:'loud'},
      {id:'calls', speaker:'theo', expr:'sad', text:'My mom. And my stepdad. Mostly him.', next:'loud'},
      {id:'ticket', speaker:'theo', expr:'surprised', text:'Northfield. Friday. My aunt has a room over her garage.', next:'locker'},
      {id:'bag', speaker:'theo', expr:'sad', text:'Not everything. Everything I could carry.', next:'loud'},
      {id:'quiet', speaker:'narr', text:'You let the quiet sit. The wipers keep time.'},
      {speaker:'theo', text:'…I’m not running away. I’m running toward. That’s what my aunt says.', set:{'flag.theo_opened_tue':true}, next:'locker'},
      {id:'loud', speaker:'theo', text:'It’s not a big dramatic thing. It’s just loud there. All the time.'},
      {id:'locker', if:{flag:'waited_for_runner_mon'}, speaker:'theo', expr:'sad', text:'Last night I sat on the platform till the 1:05 left. Couldn’t get on.'},
      {speaker:'theo', text:'So I’m putting stuff in a locker at the station. One bag a night. So it’s already gone when I go.'},
      {choices:[
        {text:'That’s smart.', next:'smart'},
        {text:'Does anyone know?', next:'anyone'}],
       silence:{next:'central'}},
      {id:'smart', speaker:'theo', expr:'warm', text:'My aunt’s idea. She’s smart.', end:true},
      {id:'anyone', speaker:'theo', expr:'sad', text:'My aunt. And now you, I guess.', set:{'flag.theo_trusts_dani':true,'trust.theo':'+1'}, end:true},
      {id:'central', speaker:'theo', text:'Anyway. Central.'}
    ]},

    theo_bye_tue:{with:'theo', nodes:[
      {if:{all:[{'trust.theo':'>=2'},{flag:'theo_knows_name'}]}, speaker:'theo', expr:'warm', text:'Night, Dani. Same bus tomorrow?', end:true},
      {if:{flag:'theo_named'}, speaker:'theo', text:'Thanks for waiting. Night.', end:true},
      {speaker:'narr', text:'He gets off with the bag on both shoulders.'}
    ]},

    theo_glimpse_tue:{with:'walter', nodes:[
      {speaker:'walter', text:'That kid from the diner. He’ll catch the 12:50.'},
      {speaker:'walter', expr:'sad', text:'Always looks late for his own life, that one.'}
    ]},

    lena_wake_tue:{with:'lena', header:'HER STOP', timer:10, nodes:[
      {speaker:'narr', text:'Waterfront. Lena is asleep, the way she promised she wouldn’t be.'},
      {choices:[
        {text:'“Lena. Your stop.”', set:{'flag.woke_lena_tue':true,'trust.lena':'+1'}, do:'wake:lena', next:'up'},
        {text:'“Lena. Go ask for Thursday.”', eye:true, if:{flag:'noticed_lena_recital'}, set:{'flag.woke_lena_tue':true,'flag.lena_recital_push':true,'trust.lena':'+2'}, do:'wake:lena', next:'push'},
        {text:'Let her sleep.', say:'(You let her sleep.)', set:{'flag.let_lena_sleep_tue':true}, next:'soft'}],
       silence:{set:{'flag.let_lena_sleep_tue':true}, next:'stir'}},
      {id:'up', speaker:'lena', expr:'surprised', text:'Mm — I’m up. I’m up.'},
      {speaker:'lena', expr:'warm', text:'Same time tomorrow?', end:true},
      {id:'push', speaker:'lena', expr:'surprised', text:'What? Oh.'},
      {speaker:'lena', expr:'warm', text:'…Okay. Okay, I’ll ask. Goodnight.', end:true},
      {id:'soft', speaker:'narr', text:'You close the doors softly. She did ask, though.', end:true},
      {id:'stir', speaker:'narr', text:'The doors close. She doesn’t stir.'}
    ]},

    lena_depot_tue:{with:'lena', nodes:[
      {speaker:'lena', expr:'surprised', text:'Depot? Again?', do:'wake:lena'},

/* ----------------------------- UTIL ----------------------------- */
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp = (a,b,t)=>a+(b-a)*t;
const ease = t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut = t=>1-Math.pow(1-t,3);
function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd = (a,b)=>a+Math.random()*(b-a);
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function fmtClock(min){
  let total = Math.floor(23*60+40+min); total = ((total%1440)+1440)%1440;
  let h = Math.floor(total/60), m = total%60; const ap = h>=12?'PM':'AM'; h = h%12; if(h===0) h=12;
  return h+':'+String(m).padStart(2,'0')+' '+ap;
}

/* ----------------------------- SAVE ----------------------------- */
function defaultMeta(){ return {v:1, nightIndex:0, completed:{}, nightStarts:{}, flags:{}, trust:{walter:0,odessa:0,lena:0,calvin:0,runner:0}, writeups:0, checkpoint:null, nightStart:null, vol:0.7, muted:false, seenMirror:false}; }
function loadMeta(){
  try{ const raw = localStorage.getItem(SAVE_KEY); if(raw){ const m = JSON.parse(raw); if(m && m.v===1){ const out = Object.assign(defaultMeta(), m); if(m.nightStart && !m.nightStarts) out.nightStarts = {[m.nightStart.night||'mon']: m.nightStart}; return out; } } }catch(e){}
  return defaultMeta();
}
function saveMeta(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(META)); }catch(e){} }
let META = loadMeta();

/* ----------------------------- STATE ----------------------------- */
// Top-level scene: TITLE | DEPOT_INTRO | DRIVE | STOP | NIGHT_END
// Overlays while driving/stopped: TALK (DLG.cur), MIRROR (R.mirror.open), RULE_CALL (convo with header)
const G = { scene:'TITLE', t:0, titleT:0, ts:1, input:{left:false,right:false, ptrSide:0}, buttons:[], hover:null, toast:null, fade:0, fadeDir:0, fadeCb:null, endPage:0 };
let NIGHT = NIGHTS.mon;
let R = null;           // current run
let ROUTE = null;       // {C:[], D:[]}
const DLG = { cur:null, queue:[] };
const PAX = {};         // runtime passenger objects

function buildRoute(night){
  const st = night.stops, C=[0], D=[];
  for(let i=0;i<st.length-1;i++){
    const dep = st[i].sched + (i===0?0:DWELL);
    const dur = st[i+1].sched - dep;
    D.push(dur/RATE*PACE*VN); C.push(C[i]+D[i]);
  }
  return {C, D};
}

function newRun(night, cp){
  NIGHT = night; ROUTE = buildRoute(night); buildWorld();
  R = {
    night:night.id, scene:'DEPOT_INTRO', stopIndex:0, seg:-1, cam:0, speed:0, speedHist:0,
    clock:0, segDep:0, stopElapsed:0, atStop:true,
    flags:clone(META.flags), trust:clone(META.trust), writeups:META.writeups, nightWriteups:0,
    done:{}, warned:{}, rode:{}, segFired:{}, seq:null, doorOpen:0, barks:[], hold:null,
    mirror:{open:false, t:0, hover:null, caption:null, captionT:0, spots:[]},
    shake:0, bump:0, accel:0, prevSpeed:0, roughCD:0, overSpeedT:0, fareLight:null, runnerMode:null,
    radioT:0, wiperT:0, wiperPh:0, lightning:0, ending:false, clockFlash:0, runnerId:null, song:null
  };
  stopSong();
  for(const k in PAX) delete PAX[k];
  DLG.cur = null; DLG.queue = [];
  if(cp){
    Object.assign(R, {flags:cp.flags, trust:cp.trust, writeups:cp.writeups, nightWriteups:cp.nightWriteups||0, done:cp.done, warned:cp.warned, rode:cp.rode||{}, clock:cp.clock, segDep:cp.segDep});
    R.stopIndex = cp.stop; R.cam = ROUTE.C[cp.stop];
    cp.aboard.forEach(a=>{ const p = spawnPax(a.who); seatPax(p, a.seat); p.asleep=!!a.asleep; p.sleep=a.asleep?1:0; });
    startSegment(cp.stop, true);
  } else {
    for(const k in (night.trustCarry||{})){ if(R.trust[k]===undefined) R.trust[k] = R.trust[night.trustCarry[k]]||0; }
    night.startAboard.forEach(a=>{ const p=spawnPax(a.who); seatPax(p, a.seat); R.rode[a.who]=true; });
    G.scene = 'DEPOT_INTRO'; R.scene='DEPOT_INTRO';
    arriveStop(0);
    R.doorOpen = 0;
  }
}

function startNight(fromCheckpoint, nightId){
  initAudio();
  if(fromCheckpoint && META.checkpoint && NIGHTS[META.checkpoint.night]){
    newRun(NIGHTS[META.checkpoint.night], META.checkpoint);
  } else {
    const night = NIGHTS[nightId || NIGHT.id] || NIGHTS.mon;
    META.nightStarts = META.nightStarts || {};
    if(!META.nightStarts[night.id]) META.nightStarts[night.id] = {night:night.id, flags:clone(META.flags), trust:clone(META.trust), writeups:META.writeups};
    META.checkpoint = null; saveMeta();
    newRun(night, null);
  }
  fadeIn();
}
// Replaying a night restores the state from before it and clears every later night.
function replayNight(nightId){
  const night = NIGHTS[nightId || NIGHT.id] || NIGHTS.mon;
  const ns = (META.nightStarts||{})[night.id];
  if(ns){ META.flags = clone(ns.flags); META.trust = clone(ns.trust); META.writeups = ns.writeups; }
  NIGHT_ORDER.forEach((id,i)=>{ const num=i+1; if(num>=night.num){ delete META.completed[id]; if(num>night.num && META.nightStarts) delete META.nightStarts[id]; } });
  META.nightIndex = night.num-1;
  META.checkpoint = null; saveMeta();
  startNight(false, night.id);
}
function charName(id){ const C = CHARS[id]; if(!C) return ''; if(C.alias && !(R && R.flags[C.alias.unless])) return C.alias.name; return C.name; }

function saveCheckpoint(){
  const aboard = [];
  for(const id in PAX){ const p=PAX[id]; if(p.state==='seated') aboard.push({who:id, seat:p.seat, asleep:p.asleep}); }
  META.checkpoint = { day:NIGHT.day, night:R.night, stop:R.stopIndex, clock:R.clock, segDep:R.segDep, flags:R.flags, trust:R.trust, writeups:R.writeups, nightWriteups:R.nightWriteups, done:R.done, warned:R.warned, rode:R.rode, aboard, nextName:NIGHT.stops[R.stopIndex+1].name };
  META.checkpoint = clone(META.checkpoint);
  saveMeta();
}

/* ----------------------------- CONDITIONS & EFFECTS ----------------------------- */
function cmp(val, spec){
  if(typeof spec==='number') return val===spec;
  if(typeof spec==='boolean') return !!val===spec;
  const m = /^(>=|<=|==|!=|>|<)\s*(-?[\d.]+)$/.exec(String(spec)); if(!m) return false;
  const n = parseFloat(m[2]);
  switch(m[1]){ case '>=':return val>=n; case '<=':return val<=n; case '>':return val>n; case '<':return val<n; case '==':return val===n; case '!=':return val!==n; }
  return false;
}
function noticedCount(){ return NIGHT.details.filter(d=>R.flags[d.flag]).length; }
function getNum(k){
  if(k.startsWith('trust.')) return R.trust[k.slice(6)]||0;
  if(k==='late') return lateNow();
  if(k==='writeups') return R.writeups;
  if(k==='noticedCount') return noticedCount();
  if(k.startsWith('flag.')) return R.flags[k.slice(5)]?1:0;
  return 0;
}
function cond(c){
  if(!c) return true;
  if(Array.isArray(c)) return c.every(cond);
  for(const k in c){
    const v = c[k];
    if(k==='if'){ if(!cond(v)) return false; }
    else if(k==='flag'){ if(!R.flags[v]) return false; }
    else if(k==='not'){ if(R.flags[v]) return false; }
    else if(k==='all'){ if(!v.every(cond)) return false; }
    else if(k==='any'){ if(!v.some(cond)) return false; }
    else if(k==='aboard'){ if(!isAboard(v)) return false; }
    else if(k==='awake'){ if(!isAboard(v) || PAX[v].asleep) return false; }
    else { if(!cmp(getNum(k), v)) return false; }
  }
  return true;
}
function applySet(set){
  if(!set) return;
  for(const k in set){
    const v = set[k];
    const delta = (typeof v==='string' && /^[+-]\d/.test(v)) ? parseFloat(v) : null;
    if(k.startsWith('trust.')){
      const id=k.slice(6); const cur=R.trust[id]||0;
      R.trust[id] = clamp(delta!==null? cur+delta : +v, TRUST_MIN, TRUST_MAX);
    } else if(k==='writeups'){
      const n = delta!==null? delta : (+v - R.writeups);
      R.writeups += n; R.nightWriteups += n;
      if(n>0){ toast('WRITE-UP  ' + R.writeups + ' of 3', '#FF4B4B'); sfx('writeup'); }
    } else if(k==='schedule'){
      R.clock += (delta!==null? delta : +v); R.clockFlash = 1.5;
    } else {
      const id = k.startsWith('flag.')? k.slice(5) : k;
      R.flags[id] = v;
    }
  }
}
function doCmd(cmd){
  if(!cmd) return;
  if(Array.isArray(cmd)){ cmd.forEach(doCmd); return; }
  const [op, arg] = cmd.split(':');
  if(op==='sleep' && PAX[arg] && PAX[arg].state==='seated'){ PAX[arg].asleep = true; }
  else if(op==='wake' && PAX[arg]){ PAX[arg].asleep = false; PAX[arg].wakeJolt = 1; }
  else if(op==='hint'){ hint(arg); }
  else if(op==='radio'){ R.radioT = 1.2; sfx('radio'); }
  else if(op==='runner'){ R.runnerMode = arg; const p=PAX[R.runnerId]; if(p && arg==='leave'){ p.runSpeed = 0; p.panting = true; } }
  else if(op==='song' && arg==='start'){ R.song = {t:0, dur:(NIGHT.song&&NIGHT.song.dur)||30, fired:{}}; startSong(R.song.dur); }
}
function runAction(a){
  if(a.if && !cond(a.if)) return;
  if(a.set) applySet(a.set);
  if(a.do) doCmd(a.do);
  if(a.hint) hint(a.hint);
  if(a.bark) bark(a.bark.who, a.bark.text, a.bark.delay||0);
  if(a.convo) queueConvo(a.convo, !!a.priority);
  if(a.redlight){ R.hold = {type:'red', t:0, convo:a.convo||null}; if(a.convo){ DLG.queue = DLG.queue.filter(q=>q!==a.convo); DLG.queue.unshift(a.convo); } }
  if(a.pothole){ doPothole(a.pothole); }
}
const HINTS = {
  drive:'Hold → (or the right side) to speed up · ← (or the left side) to brake',
  mirror:'Press M or tap the mirror to look back'
};
function hint(k){ toast(HINTS[k] || k, '#E6D9FF', 5); }
function toast(text, color, dur){ G.toast = {text, color:color||'#E6D9FF', t:0, dur:dur||3.2}; }

/* ----------------------------- PASSENGERS ----------------------------- */
function spawnPax(id){
  const p = PAX[id] = { id, x:0, wx:0, state:'gone', seat:-1, tasks:[], walkPh:0, sleep:0, asleep:false, lean:0, leanV:0,
    blinkT:rnd(2,5), blink:0, lookT:rnd(3,7), look:0, enterT:0, alpha:1, runSpeed:0, panting:false, wakeJolt:0, nod:0, nodT:rnd(4,9), faceDir:1, sitT:0, atFare:false };
  return p;
}
function seatPax(p, seat){ p.seat = seat; p.x = SEATS[seat]; p.state='seated'; p.sitT=1; p.faceDir=1; p.enterT=1; }
function isAboard(id){ const p=PAX[id]; return !!p && (p.state==='seated' || p.state==='inside'); }
function seatTaken(i, except){ for(const id in PAX){ const p=PAX[id]; if(id!==except && p.seat===i && (p.state==='seated'||p.state==='inside')) return true; } return false; }
function freeSeat(pref){ if(!seatTaken(pref)) return pref; for(let d=1; d<SEATS.length; d++){ for(const s of [pref+d, pref-d]) if(s>=0 && s<SEATS.length && !seatTaken(s)) return s; } return pref; }

function updatePax(p, dt){
  // blink / look
  p.blinkT -= dt; if(p.blinkT<=0){ p.blink = 0.14; p.blinkT = rnd(3,6); } if(p.blink>0) p.blink -= dt;
  const trust = R.trust[p.id]||0;
  p.lookT -= dt; if(p.lookT<=0){ p.look = rnd(1.2,2.4); p.lookT = rnd(7,12) - trust*1.2; } if(p.look>0) p.look -= dt;
  // sway spring (lean opposite to acceleration)
  const target = clamp(-R.accel*0.06, -0.16, 0.16) + R.bump*0.08*Math.sin(G.t*40);
  p.leanV += ((target - p.lean)*28 - p.leanV*6)*dt; p.lean += p.leanV*dt;
  // sleep
  const talking = DLG.cur && DLG.cur.c.with===p.id;
  p.sleep = clamp(p.sleep + (p.asleep && !talking?dt*0.25:-dt*2), 0, 1);
  if(p.asleep){ p.nodT -= dt; if(p.nodT<=0){ p.nod = 1; p.nodT = rnd(6,11); } }
  if(p.nod>0) p.nod = Math.max(0, p.nod - dt*2.5);
  if(p.wakeJolt>0) p.wakeJolt = Math.max(0, p.wakeJolt-dt*2);
  if(p.id==='theo'){ p.phoneT = (p.phoneT===undefined? rnd(3,6) : p.phoneT) - dt; if(p.phoneT<=0){ p.phoneUp = 2.6; p.phoneT = rnd(7,11); } if(p.phoneUp>0) p.phoneUp -= dt; }
  if(p.state==='outside'){
    // runner behaviour
    if(p.id===R.runnerId && R.runnerMode!=='leave' && p.tasks.length===0 && p.runSpeed>0){
      const doorWX = (R.atStop? ROUTE.C[R.stopIndex] : R.cam) + FRONT_DOOR_X;
      p.wx = Math.min(doorWX, p.wx + p.runSpeed*dt); p.walkPh += dt*p.runSpeed/26;
      if(p.wx>=doorWX){ p.runSpeed = 0; p.panting = true; }
    }
  }
  // tasks
  const tk = p.tasks[0]; if(!tk) return;
  if(tk.to!==undefined){
    const spd = tk.speed || 118; const dx = tk.to - p.x;
    p.faceDir = dx>=0?1:-1;
    if(Math.abs(dx) < spd*dt){ p.x = tk.to; p.tasks.shift(); }
    else { p.x += Math.sign(dx)*spd*dt; p.walkPh += dt*spd/24; }
  } else if(tk.outTo!==undefined){
    const spd = tk.speed||90; const dx = tk.outTo - p.wx; p.faceDir = dx>=0?1:-1;
    if(Math.abs(dx) < spd*dt){ p.wx = tk.outTo; p.tasks.shift(); } else { p.wx += Math.sign(dx)*spd*dt; p.walkPh += dt*spd/24; }
  } else if(tk.wait!==undefined){
    tk.wait -= dt; if(tk.wait<=0){ p.tasks.shift(); }
  } else if(tk.fn){ p.tasks.shift(); tk.fn(p); }
  else if(tk.enter){ // outside → inside
    p.enterT = Math.min(1, p.enterT + dt/0.45);
    if(p.enterT>=1){ p.state='inside'; p.x = FRONT_DOOR_X; p.tasks.shift(); }
  } else if(tk.exit){
    p.enterT = Math.max(0, p.enterT - dt/0.45);
    if(p.enterT<=0){ p.state='outside'; p.wx = R.cam + p.x; p.tasks.shift(); }
  } else if(tk.sit!==undefined){
    p.seat = tk.sit; p.faceDir = 1; p.sitT = Math.min(1, p.sitT + dt/0.4);
    if(p.sitT>=1){ p.state='seated'; p.tasks.shift(); }
  } else if(tk.stand){
    p.sitT = Math.max(0, p.sitT - dt/0.35); p.asleep=false;
    if(p.sitT<=0){ p.state='inside'; p.tasks.shift(); }
  } else if(tk.fadeOut){
    p.alpha = Math.max(0, p.alpha - dt/1.2); if(p.alpha<=0){ p.state='gone'; p.seat=-1; p.tasks.shift(); }
  } else p.tasks.shift();
}

function boardPax(id, seat, fare, hold){
  const p = PAX[id] || spawnPax(id);
  const doorWX = R.cam + FRONT_DOOR_X;
  if(p.state==='gone' || p.state==='outside'){
    if(p.state==='gone'){ p.wx = doorWX + 150; }
    p.state='outside'; p.alpha=1; p.enterT=0; p.sitT=0; p.asleep=false;
  }
  R.rode[id] = true;
  p.tasks = [ {outTo:doorWX, speed: id==='runner'?210:105}, {enter:true}, {to:FARE_STAND_X, speed:80}, {wait:0.25},
    {fn:()=>{ R.fareLight = {ok: fare==='tap', t:1.2}; sfx(fare==='tap'?'fareok':'farebad'); }}, {wait:0.45} ];
  if(hold){ p.tasks.push({fn:pp=>{ pp.atFare = true; }}); }
  else { const s = freeSeat(seat); p.tasks.push({to:SEATS[s]}, {sit:s}); }
  return p;
}
function sendToSeat(p, seat){ p.atFare=false; const s=freeSeat(seat); p.tasks.push({to:SEATS[s]}, {sit:s}); }
function alightPax(p, door){
  const dx = door==='front'? FRONT_DOOR_X : REAR_DOOR_X;
  p.atFare=false;
  if(p.state==='seated') p.tasks.push({stand:true});
  p.tasks.push({to:dx}, {exit:true}, {fn:pp=>{ pp.seat=-1; pp.tasks.push({outTo: pp.wx + (door==='front'?220:-260), speed:70}, {fadeOut:true}); }});
}

/* ----------------------------- BARKS ----------------------------- */
function bark(who, text, delay){ if(who!=='dani' && !PAX[who]) return; R.barks.push({who, text, t:-(delay||0), dur:2.2+text.length*0.04}); }

/* ----------------------------- DIALOGUE ----------------------------- */
function getConvo(id){
  const c = NIGHT.convos[id] || COMMON_CONVOS[id]; if(!c) return null;
  if(!c._map){ c._map={}; c.nodes.forEach((n,i)=>{ if(n.id) c._map[n.id]=i; }); }
  return c;
}
function queueConvo(id, prio){
  const c = getConvo(id); if(!c) return;
  if(R.done[id]) return;
  if(DLG.cur && DLG.cur.id===id) return;
  if(DLG.queue.includes(id)) return;

}
function dlgIdle(){ return !DLG.cur && DLG.queue.length===0; }
function startConvo(id){
  const c = getConvo(id); if(!c) return;
  R.done[id] = true;
  if(c.with && (!PAX[c.with] || PAX[c.with].state==='gone')) return; // passenger gone
  DLG.cur = { id, c, nodeIdx:-1, node:null, phase:'none', speaker:null, text:'', shown:0, hold:0, next:null, timer:0, timerMax:1, phone:[], paused:false, blipAcc:0, chosen:null };

}
function endConvo(){ DLG.cur = null; }
function gotoNode(ref){
  const d = DLG.cur; if(!d) return;
  let guard = 0;
  while(true){
    if(++guard>80){ endConvo(); return; }
    if(ref===null || ref===undefined){ endConvo(); return; }
    const idx = typeof ref==='number' ? ref : d.c._map[ref];
    if(idx===undefined || idx>=d.c.nodes.length){ endConvo(); return; }
    const n = d.c.nodes[idx];
    if(n.if && !cond(n.if)){ ref = (n.else!==undefined)? n.else : idx+1; continue; }
    const nextDefault = n.end ? null : (n.next!==undefined ? n.next : idx+1);
    d.nodeIdx = idx; d.node = n;
    if(n.set) applySet(n.set);
    if(n.do) doCmd(n.do);
    if(n.waitSong){ d.phase='wait'; d.next=nextDefault; d.speaker=null; return; }
    if(n.choices){ d.phase='choices'; d.timerMax = d.timer = (n.timer || d.c.timer || 9); d.choiceNext = nextDefault; d.speaker=null; return; }
    if(n.text){ showLine(n.speaker||'narr', n.text, n.expr, nextDefault); return; }
    ref = nextDefault;
  }
}
function showLine(sp, text, expr, next, silent){
  const d = DLG.cur;
  d.phase='typing'; d.speaker=sp; d.text=text; d.shown=0; d.expr=expr||'neutral'; d.next=next; d.hold=0; d.silent=!!silent;
  if(d.c.phone && (sp==='mom'||sp==='dani')){ if(text && text!=='…') d.phone.push({from:sp, text}); if(sp==='mom') sfx('ping'); }
  if(sp==='dispatch'){ R.radioT = 0.6 + text.length/45; sfx('radio'); }
}
function visibleChoices(n){ return (n.choices||[]).filter(ch=>cond(ch.if)); }
function choose(ch, isSilence){
  const d = DLG.cur; if(!d || d.phase!=='choices') return;
  if(ch && ch.set) applySet(ch.set);
  if(ch && ch.do) doCmd(ch.do);
  const next = (ch && ch.next!==undefined) ? ch.next : d.choiceNext;
  sfx(isSilence?'silence':'choose');
  if(isSilence){ showLine('dani', '…', 'neutral', next, true); }
  else { const say = ch.say || ch.text.replace(/\s*\(costs[^)]*\)/,''); showLine('dani', say, 'neutral', next); }
}
function chooseIndex(i){
  const d = DLG.cur; if(!d || d.phase!=='choices') return;
  const vis = visibleChoices(d.node);
  if(i<vis.length) choose(vis[i], false);
}
function chooseSilence(){ const d=DLG.cur; if(!d||d.phase!=='choices') return; choose(d.node.silence||{}, true); }
function advanceDlg(){
  const d = DLG.cur; if(!d || d.paused) return false;
  if(d.phase==='typing'){ d.shown = d.text.length; d.phase='hold'; d.hold=0; return true; }
  if(d.phase==='hold'){ gotoNode(d.next); return true; }
  return false;
}
function holdTime(d){ if(d.silent) return 1.3; return 1.5 + d.text.length*0.034; }
function updateDlg(dt){
  if(!DLG.cur && DLG.queue.length){ startConvo(DLG.queue.shift()); }
  const d = DLG.cur; if(!d) return;
  // speeding interrupts passenger conversations
  const listener = d.c.with;
  if(listener && isAboard(listener) && !PAX[listener].asleep){
    if(!d.paused && R.overSpeedT>0.5){
      d.paused = true; bark(listener, CHARS[listener].rough || 'Whoa, easy!');
      if(!R.flags['rough_'+listener]){ R.flags['rough_'+listener]=true; R.trust[listener]=clamp((R.trust[listener]||0)-1, TRUST_MIN, TRUST_MAX); }
    } else if(d.paused && R.speed<1.12){ d.paused=false; }
  } else d.paused=false;
  if(d.paused) return;
  if(d.phase==='typing'){
    const before = Math.floor(d.shown);
    d.shown += dt*46;
    const after = Math.floor(Math.min(d.shown, d.text.length));
    for(let i=before;i<after;i++){ const ch=d.text[i]; if(ch && ch!==' ' && i%2===0) blip(d.speaker); }
    if(d.shown>=d.text.length){ d.shown=d.text.length; d.phase='hold'; d.hold=0; }
  } else if(d.phase==='hold'){
    d.hold += dt; if(d.hold>=holdTime(d)) gotoNode(d.next);
  } else if(d.phase==='choices'){
    d.timer -= dt; if(d.timer<=0) chooseSilence();
  } else if(d.phase==='wait'){
    if(!R.song) gotoNode(d.next);
  }
}

/* ----------------------------- SCHEDULE ----------------------------- */
function segProgress(){ if(R.seg<0) return 0; return clamp((R.cam - ROUTE.C[R.seg]) / ROUTE.D[R.seg], 0, 1); }
function schedNow(){
  if(G.scene==='DEPOT_INTRO' || (R.atStop && R.stopIndex===0)) return R.clock;
  if(R.atStop){ return NIGHT.stops[R.stopIndex].sched + Math.min(R.stopElapsed, DWELL); }
  const arr = NIGHT.stops[R.seg+1].sched;
  return R.segDep + segProgress()*(arr - R.segDep);
}
function lateNow(){ if(!R) return 0; return R.clock - schedNow(); }
function checkLate(){
  const L = lateNow();
  for(const th of [3,6,9]){
    if(L>=th && !R.warned[th]){
      R.warned[th] = true;
      if(th===9){ applySet({writeups:'+1', ['flag.writeup_late_'+NIGHT.id]:true}); }
      queueConvo('warn'+th, true);
      if(DLG.cur && DLG.cur.c.with===null && !DLG.cur.c.header){} // dispatch lines queue behind current
    }
  }
}

/* ----------------------------- DRIVE / STOP ----------------------------- */
function startSegment(k, resumed){
  R.seg = k; R.stopIndex = k; R.atStop = false; R.segFired = {}; R.hold = null;
  G.scene = 'DRIVE'; R.scene = 'DRIVE';
  if(!resumed){ R.segDep = schedNowAtStopForDepart(k); saveCheckpoint(); }
}
function schedNowAtStopForDepart(k){ if(k===0) return 0; return NIGHT.stops[k].sched + Math.min(R.stopElapsed, DWELL); }

function arriveStop(k){
  R.atStop = true; R.stopIndex = k; R.stopElapsed = 0; R.speed = 0; R.hold = null;
  if(k>0){ G.scene='STOP'; R.scene='STOP'; }
  const st = NIGHT.stops[k];
  (st.arrive||[]).forEach(runAction);
  R.seq = {steps:st.steps||[], i:0, wait:null, phase:'opening', delay:0};
  sfx('brake');
}
function seatFor(s, id, def){ if(s.seatByTrust){ for(const [min, st] of s.seatByTrust){ if((R.trust[id]||0)>=min) return st; } } return s.seat!==undefined? s.seat : def; }
function runStep(s){
  if(s.convo){ queueConvo(s.convo); return ()=>dlgIdle(); }
  if(s.alight){ const p=PAX[s.alight]; if(!p || !isAboard(s.alight)) return null; alightPax(p, 'rear'); return ()=>p.state==='outside'||p.state==='gone'; }
  if(s.board){ const p = boardPax(s.board, s.seat||0, s.fare||'tap', s.hold); return s.hold? ()=>p.atFare : ()=>p.state==='seated'; }
  if(s.toSeat){ const p=PAX[s.toSeat]; if(!p) return null; sendToSeat(p, seatFor(s, p.id, 6)); return ()=>p.state==='seated'; }
  if(s.exitFront){ const p=PAX[s.exitFront]; if(!p) return null; alightPax(p,'front'); return ()=>p.state==='outside'||p.state==='gone'; }
  if(s.spawnRunner){ R.runnerId = s.spawnRunner; const p=spawnPax(s.spawnRunner); p.state='outside'; p.wx = R.cam - 380; p.runSpeed = 120; p.alpha=1; R.runnerMode='running'; R.rode[s.spawnRunner]=true; return null; }
  if(s.runnerBoard){ const p=PAX[s.runnerBoard]; if(!p) return null; applySet({schedule:'+'+(s.cost||2)}); toast('+'+(s.cost||2)+' MIN · holding the doors', '#FFB347'); p.runSpeed=0; boardPax(p.id, seatFor(s, p.id, 7), 'tap', false); return ()=>p.state==='seated'; }
  if(s.bark){ bark(s.bark.who, s.bark.text); return null; }
  if(s.set){ applySet(s.set); return null; }
  if(s.end){ R.ending = true; return ()=>false; }
  return null;
}
function updateStop(dt){
  const q = R.seq; if(!q) return;
  if(q.phase==='opening'){
    if(R.doorOpen===0) sfx('door');
    R.doorOpen = Math.min(1, R.doorOpen + dt*2.5);
    if(R.doorOpen>=1){ q.phase='steps'; q.delay=0.35; }
    return;
  }
  if(q.phase==='steps'){
    if(R.ending){ if(dlgIdle() && !G.fadeDir){ endNight(); } return; }
    if(q.wait){ if(!q.wait()) return; q.wait=null; q.delay=0.3; }
    if(q.delay>0){ q.delay-=dt; return; }
    if(q.i>=q.steps.length){ q.phase='closing'; sfx('doorclose'); return; }
    const s = q.steps[q.i++];
    if(s.if && !cond(s.if)) return;
    q.wait = runStep(s);
    return;
  }
  if(q.phase==='closing'){
    // never leave someone half-way through the door
    for(const id in PAX){ const p=PAX[id]; if(p.state==='inside' && p.tasks.length) return; }

}
function doPothole(ph){
  const soft = R.speed < 0.8;
  R.bump = soft? 0.5 : 1.6; R.shake = soft? 4 : 14;
  sfx(soft?'bumpsoft':'bump');
  (soft? ph.soft : ph.hard).forEach(runAction);
}
function updateDrive(dt){
  const k = R.seg;
  let target = 1;
  if(G.input.right) target = SPEED_MAX; else if(G.input.left) target = SPEED_MIN;
  // red light
  if(R.hold && R.hold.type==='red'){
    R.hold.t += dt; target = 0;
    const convoWaiting = R.hold.convo && (DLG.queue.includes(R.hold.convo) || (DLG.cur && DLG.cur.id===R.hold.convo));
    if((R.hold.t>6 && !convoWaiting) || R.hold.t>24){ R.hold = null; sfx('green'); }
  }
  // approach the stop
  const remaining = ROUTE.C[k+1] - R.cam;
  const maxS = Math.sqrt(2*150*Math.max(0,remaining))/VN;
  const kAcc = target>R.speed ? 0.9 : 2.2;
  R.speed += (target - R.speed) * (1 - Math.exp(-dt*kAcc));
  if(R.speed > maxS) R.speed = Math.max(maxS, remaining>2?0.035:0);
  if(R.speed < 0.002 && target===0) R.speed = 0;

  R.overSpeedT = R.speed>1.28 ? R.overSpeedT+dt : 0;
  // events
  const p = segProgress();
  const seg = NIGHT.segments[k];
  (seg.events||[]).forEach((e,i)=>{ if(!R.segFired[i] && p>=e.at){ R.segFired[i]=true; runAction(e); } });
  if(remaining <= 1.0){ R.cam = ROUTE.C[k+1]; arriveStop(k+1); }
}

function updateWorld(dt){
  const prev = R.speed;
  if(G.scene==='DRIVE') updateDrive(dt);
  else if(G.scene==='STOP' || G.scene==='DEPOT_INTRO'){ updateStop(dt); R.speed = Math.max(0, R.speed - dt*2); R.overSpeedT = 0; }

    const rr = R.atStop? RATE_STOP : RATE;
    R.clock += rr*dt;
    if(R.atStop) R.stopElapsed += rr*dt;
    checkLate();
  }
  // shake from speed and bumps
  R.shake = Math.max(0, R.shake - dt*30);
  R.bump = Math.max(0, R.bump - dt*2.5);
  R.wiperT += dt;
  const RI = NIGHT.rain||0; if(RI>0) R.wiperPh += dt/(1.2/(0.75+0.25*RI));

    R.song.t += dt;
    ((NIGHT.song&&NIGHT.song.barks)||[]).forEach((b,i)=>{ if(!R.song.fired[i] && R.song.t>=b.t){ R.song.fired[i]=true; runAction(b); } });
    if(R.song.t >= R.song.dur){ R.song = null; stopSong(); R.flags['heard_song_'+NIGHT.id] = true; }
  }
  if(R.fareLight){ R.fareLight.t -= dt; if(R.fareLight.t<=0) R.fareLight=null; }
