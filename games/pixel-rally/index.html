<template id="tpl-park">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-screen app. The diorama fills the stage; a control rail sits beside it (below it on phones); the flip scoreboard stands in the stage corner. */
:root{
  --bg:#dfe7d6; --panel:#f1f4ea; --ink:#1c2920; --muted:#56665a; --line:#bdcab3;
  --chip:#e3e9d8; --chip-on:#1c2920; --chip-on-ink:#f3f6ec;
  --sun:#d9a420; --teal:#1d7c75;
  --board:#232a2b; --board-2:#323c3d; --board-ink:#f3f0e2; --tile:#131819; --leg:#6a7470;
  --f-pix:'Silkscreen', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --f-ui:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111819; --panel:#172123; --ink:#e2e9da; --muted:#93a297; --line:#2b3b3a;
    --chip:#1e2b2c; --chip-on:#e2e9da; --chip-on-ink:#111819;
    --sun:#f0c43a; --teal:#3aa79e;
    --board:#0b0f10; --board-2:#1d2627; --board-ink:#f3f0e2; --tile:#040606; --leg:#3c4644;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111819; --panel:#172123; --ink:#e2e9da; --muted:#93a297; --line:#2b3b3a;
  --chip:#1e2b2c; --chip-on:#e2e9da; --chip-on-ink:#111819;
  --sun:#f0c43a; --teal:#3aa79e;
  --board:#0b0f10; --board-2:#1d2627; --board-ink:#f3f0e2; --tile:#040606; --leg:#3c4644;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 276px;gap:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px}
.stage{position:relative;min-width:0;min-height:0;display:grid;place-items:center;overflow:hidden}
#view{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
#view.drag{cursor:grabbing}
.hint{position:absolute;right:6px;bottom:4px;margin:0;font:400 10px/1.3 var(--f-pix);color:var(--muted);letter-spacing:.04em;text-align:right;pointer-events:none;max-width:60%}

/* flip scoreboard on a folding stand */
.board{position:absolute;left:4px;top:4px;width:226px;pointer-events:none;z-index:2}
.card{background:var(--board);color:var(--board-ink);border-radius:6px;padding:8px 9px 7px;box-shadow:0 2px 0 var(--board-2), 0 6px 14px rgba(0,0,0,.18);font-family:var(--f-pix)}
.ctop{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.08em;opacity:.8;margin-bottom:6px}
.row{display:grid;grid-template-columns:10px 1fr 8px 22px auto;align-items:center;gap:6px;padding:3px 0}
.row + .row{border-top:1px dashed var(--board-2)}
.sw{width:10px;height:10px;border-radius:2px}
.nm{font-size:12px;letter-spacing:.05em;white-space:nowrap;overflow:hidden}
.srv{width:7px;height:7px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1px var(--board-2)}
.srv.on{background:var(--sun);box-shadow:none}
.pips{display:flex;gap:3px}
.pips i{width:8px;height:8px;border-radius:1px;box-shadow:inset 0 0 0 1px var(--board-2)}
.pips i.on{background:var(--board-ink);box-shadow:none}
.dg{display:flex;gap:2px}
.dg b{display:grid;place-items:center;width:20px;height:27px;background:var(--tile);border-radius:3px;font:700 18px/1 var(--f-pix);position:relative;font-variant-numeric:tabular-nums}
.dg b::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--board)}
.dg b.flip{animation:flip .32s steps(4)}
@keyframes flip{0%{transform:scaleY(1)}45%{transform:scaleY(.08)}100%{transform:scaleY(1)}}
.cfoot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:9px;letter-spacing:.08em;opacity:.85}
.cfoot span:last-child{display:flex;align-items:center;gap:5px;opacity:1}
.legs{position:relative;height:14px}
.legs::before,.legs::after{content:"";position:absolute;top:-2px;width:3px;height:17px;background:var(--leg);border-radius:1px}
.legs::before{left:46px;transform:rotate(14deg)}
.legs::after{right:46px;transform:rotate(-14deg)}
.callout{margin-top:2px;display:inline-block;font:400 10px/1.2 var(--f-pix);letter-spacing:.05em;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:3px 6px;border-radius:3px}

#bubbles{position:absolute;inset:0;pointer-events:none;z-index:3}
.bub{position:absolute;transform:translate(-50%,-100%);font:400 10px/1 var(--f-pix);background:var(--panel);color:var(--ink);border:2px solid var(--ink);padding:3px 5px;white-space:nowrap;border-radius:2px}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;width:6px;height:6px;background:var(--ink);transform:translateX(-50%);clip-path:polygon(0 0,100% 0,50% 100%)}

/* rail */
.rail{min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:15px}
.brand h1{margin:0;font:700 22px/1 var(--f-pix);letter-spacing:.02em;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
.rail section{display:flex;flex-direction:column;gap:7px}
.rail h2{margin:0;display:flex;justify-content:space-between;align-items:baseline;font:400 10px/1 var(--f-pix);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.live{font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:.04em}
.seg{display:flex;flex-wrap:wrap;gap:4px}
button{font:700 12.5px/1 var(--f-ui);color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:7px 9px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.seg button{flex:1 1 auto}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns button{flex:1 1 auto}
.slider{display:grid;grid-template-columns:auto 1fr 18px;align-items:center;gap:8px;font-size:13px}
.slider input{width:100%;accent-color:var(--teal)}
.slider output{font:400 11px/1 var(--f-pix);text-align:right}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;font-size:13px}
.checks label{display:flex;align-items:center;gap:6px;cursor:pointer}
.checks input{accent-color:var(--teal);margin:0}
.note{margin:0;font-size:12px;color:var(--muted);line-height:1.45}

/* how it's drawn */
.how{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb, var(--bg) 70%, transparent);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px}
.how-in{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:560px;max-height:100%;overflow:auto;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.how h3{margin:0 0 4px;font:700 16px/1.2 var(--f-pix)}
.how ol{margin:10px 0 12px;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.5;font-size:14px;max-width:65ch}
.how b{font-weight:700}

/* game shell */
.app.playing{grid-template-columns:minmax(0,1fr)}
.app.playing .rail{position:fixed;top:12px;bottom:12px;right:max(16px, env(safe-area-inset-right, 0px));width:min(300px, calc(100vw - 32px));z-index:30;box-shadow:0 10px 40px rgba(0,0,0,.28)}
.app.playing:not(.menu-open) .rail{display:none}
.app.playing .hint{display:none}
.hud{position:absolute;top:4px;right:4px;display:flex;gap:6px;z-index:6}
.hud button{font:400 11px/1 var(--f-pix);letter-spacing:.05em;padding:9px 10px;background:var(--panel)}
.app:not(.playing) .hud{display:none}
.app:not(.playing) .only-playing{display:none}
#fx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.ring{position:absolute;border-radius:50%;border:3px solid var(--sun);transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--board), inset 0 0 0 2px var(--board)}
.ring.core{border:2px dashed var(--board-ink);box-shadow:0 0 0 2px var(--board)}
.pop{position:absolute;transform:translate(-50%,-100%);font:700 12px/1 var(--f-pix);letter-spacing:.06em;color:var(--board-ink);background:var(--board);padding:4px 7px;border-radius:3px;white-space:nowrap;animation:pop 1.1s steps(8) forwards}
.pop.perfect{color:var(--sun)} .pop.bad{color:#ff9a7a}
@keyframes pop{0%{opacity:0;margin-top:8px}15%{opacity:1;margin-top:0}75%{opacity:1}100%{opacity:0;margin-top:-16px}}
.prompt{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font:400 11px/1.35 var(--f-pix);letter-spacing:.05em;background:var(--board);color:var(--board-ink);padding:8px 11px;border-radius:4px;z-index:5;text-align:center;width:max-content;max-width:calc(100% - 24px);pointer-events:none}
.meter{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);width:min(240px,70%);height:16px;background:var(--board);border-radius:3px;z-index:5;overflow:hidden;box-shadow:0 0 0 2px var(--board-2);pointer-events:none}
.meter b{position:absolute;top:0;bottom:0;left:45%;width:35%;background:var(--teal)}
.meter i{position:absolute;top:2px;bottom:2px;width:4px;margin-left:-2px;background:var(--board-ink);left:50%}
.calls{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);display:flex;gap:6px;z-index:6;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 16px)}
.calls button{font:400 12px/1 var(--f-pix);letter-spacing:.04em;padding:13px 14px;background:var(--board);color:var(--board-ink);border-color:var(--sun)}
.screen{position:fixed;inset:0;z-index:40;display:grid;place-items:center;overflow:auto;background:color-mix(in srgb, var(--bg) 52%, transparent);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;width:min(560px,100%);display:flex;flex-direction:column;gap:15px;box-shadow:0 14px 50px rgba(0,0,0,.25)}
.scard h2{margin:0;font:700 34px/1 var(--f-pix);letter-spacing:.01em;text-wrap:balance}
.scard .lede{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.scard h3{margin:0 0 7px;font:400 10px/1 var(--f-pix);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.courts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.court{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;padding:10px;min-width:0;font-weight:400}
.court strong{font:700 14px/1 var(--f-pix)}
.court span{font-size:12px;color:var(--muted);line-height:1.3}
.court em{font-style:normal;font:400 9px/1 var(--f-pix);letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);padding:3px 5px;border-radius:3px}
.court[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.court[aria-pressed="true"] span{color:inherit;opacity:.8}
.court[disabled]{opacity:.6;cursor:not-allowed}
.howto{margin:0;font-size:13px;color:var(--muted);line-height:1.5;min-height:3em}
.go{font:700 15px/1 var(--f-pix);letter-spacing:.06em;padding:15px;background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.res{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.res th,.res td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.res th:first-child,.res td:first-child{text-align:left}
.res thead th{font:400 10px/1 var(--f-pix);letter-spacing:.08em;color:var(--muted)}
@media (max-width:520px){.courts{grid-template-columns:minmax(0,1fr)}.scard h2{font-size:28px}}
@media (max-width:760px){
  .app.playing{height:100%}
  .app.playing .stage{height:100%}
  .app{height:auto;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
  .stage{height:64vh;min-height:320px}
  .rail{overflow:visible}
  .board{width:200px}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){ .dg b.flip{animation:none} }

<div class="app">

        <div class="row" id="rowB"><span class="sw"></span><span class="nm"></span><span class="srv"></span><span class="pips"><i></i><i></i></span><span class="dg"><b>0</b><b>0</b></span></div>

<div class="how" id="how" hidden>
  <div class="how-in" role="dialog" aria-labelledby="howTitle">
    <h3 id="howTitle">How it's drawn</h3>
    <ol>
      <li><b>A tiny 3D park.</b> Everything is built from boxes, rough spheres and one bumpy sheet of grass, lit by a sun and a sky light, with hard shadows.</li>
      <li><b>Drawn small on purpose.</b> The camera looks down at a fixed angle with no perspective, and renders into a picture only a few hundred dots wide, with no smoothing.</li>
      <li><b>The pond mirror.</b> Before the main picture, the trees, people and sky are drawn again upside down around the water line. The pond shows that picture with a slight ripple.</li>
      <li><b>Outlines from depth.</b> Every dot knows how far away it is. If a neighbouring dot is more than half a metre closer, this dot gets darker, which draws a crisp edge around shapes.</li>
      <li><b>Snapping to the palette.</b> Each colour is swapped for the closest of about 80 paint colours. Closeness is measured the way eyes judge colour, with lightness counting a bit more than hue.</li>
      <li><b>Dither.</b> An optional 4×4 checker pattern nudges lightness up and down, so smooth light breaks into tidy patterns instead of bands.</li>
      <li><b>Blown up in whole pixels.</b> Each dot becomes an exact square of screen pixels, and the camera snaps to that grid so the park doesn't shimmer.</li>
    </ol>
    <div class="btns"><button id="howClose">Close</button></div>
  </div>
</div>

<script type="text/plain" class="code">
import * as THREE from 'three';

/* ================= helpers ================= */
const $=s=>document.querySelector(s);

function simPath(p0,v0,ws=1,spin=0,maxT=6){const out=[{t:0,x:p0.x,y:p0.y,z:p0.z,vy:v0.y}];let px=p0.x,py=p0.y,pz=p0.z,vx=v0.x,vy=v0.y,vz=v0.z,sA=spin;const wx=windState.vec.x*ws,wz=windState.vec.z*ws,dt=1/60;
  for(let t=dt;t<maxT;t+=dt){const rx=vx-wx,rz=vz-wz,sp=Math.sqrt(rx*rx+vy*vy+rz*rz);vx-=KDRAG*sp*rx*dt;vy-=(9.81+KDRAG*sp*vy+sA)*dt;vz-=KDRAG*sp*rz*dt;sA*=1-SPIN_DECAY*dt;
    px+=vx*dt;py+=vy*dt;pz+=vz*dt;out.push({t,x:px,y:py,z:pz,vy});if(py<=BALL_R)break;}return out;}
function simQuick(p0,v0,ws,spin,ty){let px=p0.x,py=p0.y,pz=p0.z,vx=v0.x,vy=v0.y,vz=v0.z,sA=spin,netY=null;const wx=windState.vec.x*ws,wz=windState.vec.z*ws,dt=1/60;let t=0;
  for(t=dt;t<6;t+=dt){const rx=vx-wx,rz=vz-wz,sp=Math.sqrt(rx*rx+vy*vy+rz*rz);vx-=KDRAG*sp*rx*dt;vy-=(9.81+KDRAG*sp*vy+sA)*dt;vz-=KDRAG*sp*rz*dt;sA*=1-SPIN_DECAY*dt;
    const ox=px;px+=vx*dt;py+=vy*dt;pz+=vz*dt;if(netY===null&&ox*px<=0&&ox!==px)netY=py;if((vy<0&&py<=ty)||py<=BALL_R)break;}
  return {x:px,y:py,z:pz,t,netY};}
function solveDrive(from,tx,tz,speed,spin=0,clear=0.1){
  const dist=Math.hypot(tx-from.x,tz-from.z);let ang=Math.atan2(tz-from.z,tx-from.x);const v=V();let r=null;
  for(let it=0;it<3;it++){let lo=-1.1,hi=0.8;const ca=Math.cos(ang),sa=Math.sin(ang);
    for(let k=0;k<20;k++){const el=(lo+hi)/2;v.set(Math.cos(el)*ca*speed,Math.sin(el)*speed,Math.cos(el)*sa*speed);r=simQuick(from,v,0.7,spin,BALL_R);
      const along=(r.x-from.x)*ca+(r.z-from.z)*sa;if(along<dist)lo=el;else hi=el;}
    const lat=-(r.x-tx)*sa+(r.z-tz)*ca;ang-=lat/Math.max(dist,1);}
  return {v:v.clone(),ok:r.netY===null||r.netY>NET_TOP+clear};}
function solveLob(from,tx,tz,ty,apex){
  const h=Math.max(apex,from.y+0.4,ty+0.3);const vy=Math.sqrt(2*9.81*(h-from.y));const T=vy/9.81+Math.sqrt(2*(h-ty)/9.81);
  const v=V((tx-from.x)/T,vy,(tz-from.z)/T);
  for(let i=0;i<4;i++){const r=simQuick(from,v,0.7,0,ty);v.x+=(tx-r.x)/Math.max(0.3,r.t);v.z+=(tz-r.z)/Math.max(0.3,r.t);}
  return v;}
function findCross(path,side,hc,minX=0.05){for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i];if(a.y>hc&&b.y<=hc&&b.vy<0&&(side===0||b.x*side>minX))return b;}return null;}

function clearRally(){for(const p of activePlayers()){p.task=null;p.base=null;p.jumpAt=null;}G.plan=null;G.block=null;}
function touch(p){const t=p.team;if(G.touchTeam!==t){G.touchTeam=t;G.touches=0;}G.touches++;G.lastTouch=t;G.lastHitter=p;ball.float=false;ball.spinA=0;if(t!==G.serving||G.lastShotKind!=='serve')G.recvTouched=G.recvTouched||t!==G.serving;}
function afterContact(){G.plan=null;G.missP=null;planNext();}

function planNext(){
  G.plan=null;G.leave=null;if(!ball.live)return;
  const path=simPath(ball.p,ball.v,1,ball.spinA);const land=path[path.length-1];if(!land)return;
  const cur=sideOf(ball.p.x);let ci=-1;for(let i=1;i<path.length;i++)if(path[i-1].x*path[i].x<=0&&path[i-1].x!==path[i].x){ci=i;break;}
  const crosses=ci>=0&&path[ci].y>netTop(path[ci].z)&&Math.abs(path[ci].z)<4.6;const ls=crosses?-cur:cur;const recv=teamOnSide(ls);const same=recv===G.touchTeam;const n=same?G.touches+1:1;
  if(n>3)return;
  let type=!same?'pass':(n===2?'set':'attack');
  if(!same){const outBy=Math.max(Math.abs(land.x)-9,Math.abs(land.z)-4.5);if(outBy>0.4&&Math.random()<0.92){G.leave=recv;return;}}
  if(type!=='pass'){for(const p of recv.players)p.base=null;for(const p of other(recv).players)if(p.task!=='block')p.base=null;}
  let hc=0.85;let cand=recv.players.filter(p=>!(same&&p===G.lastHitter)&&p!==G.missP);
  if(type==='set'){const cH=findCross(path,ls,2.1,-0.1),cL=findCross(path,ls,0.9,-0.1);
    const pickRole=r=>{const f=cand.filter(p=>p.role===r);if(f.length)cand=f;};
    if(cH&&Math.abs(cH.x)<3.8){hc=2.1;pickRole('W');if(cand[0].role!=='W')type='bumpset';}
    else if(cL&&Math.abs(cL.x)<2.6){type='bumpset';hc=0.9;pickRole('W');}
    else{type='bumpset';hc=0.9;pickRole('M');}}
  if(type==='attack'){if(G.attacker&&G.attacker.team===recv&&G.attacker!==G.lastHitter){cand=[G.attacker];hc=G.attacker.role==='W'?2.8:3.0;}else{type='free';hc=1.0;}}
  const mx=type==='pass'?0.05:-0.15;let c=findCross(path,ls,hc,mx);
  if(!c&&type==='attack'){type='free';hc=1.0;cand=recv.players.filter(p=>p!==G.lastHitter);c=findCross(path,ls,hc,mx);}
  if(!c){hc=0.6;c=findCross(path,ls,hc,mx);if(!c)return;}
  let best=null,bs=1e9;const short=Math.abs(c.x)<3.5,deep=Math.abs(c.x)>5.2;
  for(const p of cand){if(p.air&&type!=='attack')continue;if(p.task==='block'&&G.t<p.blockUntil)continue;
    let need=0.18+distXZ(p,c.x,c.z)/5.2+(type==='pass'&&G.lastShotKind==='spike'?0.16:0);if(type==='pass'){if(short&&p.role==='M')need+=0.35;if(deep&&p.role==='W')need+=0.35;}if(need<bs){bs=need;best=p;}}
  if(!best||bs>c.t+(type==='pass'?0.42:0.75)+(playing()&&!isYou(recv)?DIFF[ui.diff].reach:0))return;
  if(type==='pass'&&Math.random()<0.035&&recv.players.length>1){
    const two=recv.players.filter(p=>p.task!=='block').sort((a,b)=>distXZ(a,c.x,c.z)-distXZ(b,c.x,c.z)).slice(0,2);
    if(two.length===2&&distXZ(two[1],c.x,c.z)<4){G.mixup=true;two.forEach((p,i)=>{p.task='mix';p.mixX=lerp(p.pos.x,c.x,0.55);p.mixZ=lerp(p.pos.z,c.z,0.55);});say(two[0],'Yours!',1.3);setTimeout(()=>say(two[1],'Mine?',1.2),350);return;}}
  G.plan={p:best,type,hc,team:recv,side:ls,pt:V(c.x,c.y,c.z),tc:G.t+c.t};best.task='play';best.jumped=false;onPlan(G.plan);
  if(type==='attack')setupBlock(recv,G.plan);
}
function refreshPlan(){const pl=G.plan;if(pl.type==='serve')return;const path=simPath(ball.p,ball.v,1,ball.spinA);const c=findCross(path,pl.side,pl.hc,pl.type==='pass'?0.05:-0.15);
  if(!c){if(ball.p.y>pl.hc||ball.v.y>0)planNext();return;}pl.pt.set(c.x,c.y,c.z);pl.tc=G.t+c.t;}
function setupBlock(att,plan){
  const d=other(att),s=d.side,A=plan.p,C=plan.pt;G.block=null;
  const lineZ=sgn(C.z||0.01);
  const ws=d.players.filter(p=>p.role==='W'),ms=d.players.filter(p=>p.role==='M');
  let bl=[];
  const pref=isYou(d)&&G.blockPref!=null;if(pref||Math.random()<(A.role==='W'?0.95:0.45)){const bz=pref?G.blockPref:clamp(C.z*0.95,-4.1,4.1);ws.sort((a,b)=>Math.abs(a.pos.z-bz)-Math.abs(b.pos.z-bz));bl=[ws[0]];if(Math.random()<(A.role==='W'?0.55:0.3))bl.push(ws[1]);
    bl.forEach((b,i)=>{b.task='block';b.blockZ=i===0?bz:clamp(bz-sgn(bz)*0.62,-4.1,4.1);b.jumpAt=plan.tc-0.33+rand(-0.05,0.05);b.jumpH=0.45;b.blockUntil=plan.tc+0.8;});
    G.block={team:d,players:bl,until:plan.tc+0.7};if(ui.mode==='player'&&ui.assist==='full'&&d===G.you){for(const b of bl)b.jumpAt=null;G.tapBlock={bl,att:plan,tapped:null};}}
  for(const p of ws)if(!bl.includes(p))p.base={x:s*3.0,z:-lineZ*1.4};
  const sorted=ms.slice().sort((a,b)=>Math.abs(a.pos.z-lineZ*3.6)-Math.abs(b.pos.z-lineZ*3.6));
  if(sorted[0])sorted[0].base={x:s*7.2,z:lineZ*3.5};if(sorted[1])sorted[1].base={x:s*6.2,z:-lineZ*1.7};
}

/* contacts */
function attemptContact(pl){
  const p=pl.p;const d=Math.hypot(ball.p.x-p.pos.x,ball.p.z-p.pos.z);
  if(pl.type==='serve'){doServe(p);return;}
  if(ui.mode==='player'&&isYou(pl.team)&&G.tap&&G.tap.plan===pl&&G.tap.tapped==null&&Math.random()<0.5){popAt(p,'NO TAP','miss');G.tap=null;G.timing.n++;G.missP=p;G.plan=null;return;}
  const reach={pass:0.95,set:0.85,bumpset:0.95,attack:1.15,free:1.0}[pl.type];

    <p class="sub">A real 3D gym, squeezed through a few simple steps so it reads as pixel art.</p>
    <ol>
      <li><h3>A tiny canvas</h3><p>The scene is rendered into a small image, about <b id="howres">480 × 300</b> pixels, then each pixel is blown up to a <b id="howpx">3 × 3</b> block on your screen. No smoothing, so the edges stay crisp.</p></li>
      <li><h3>A flat, tilted camera</h3><p>The camera looks down at about 31° with no perspective, like an architect's drawing. It is nudged so the gym's centre always lands on a whole pixel, which stops edges from shimmering as things move.</p></li>
      <li><h3>A mirror for the floor</h3><p>Before the main picture, the whole gym is drawn again upside down. The varnished floor borrows a faint, slightly smeared copy of that image, which gives the soft glossy reflections of players, lamps and windows.</p></li>
      <li><h3>Outlines from depth</h3><p>Every pixel knows how far away it is. Where a neighbouring pixel is more than half a metre closer, the farther pixel is darkened, which traces the edge of each player, post and bleacher row.</p></li>
      <li><h3>A fixed box of paints</h3><p>Each colour is snapped to the nearest of about 70 hand-picked colours: maple, court-line paint, cinder block, pad blue, team orange and purple. The match is measured in a perceptual colour space so light and dark are judged the way eyes judge them. A 4 × 4 pattern of tiny nudges (dithering) blends neighbouring paints.</p></li>
      <li><h3>Light that behaves</h3><p>The sun comes through the high windows past a hidden roof that only exists to cast shadows, so beams land in patches. At night, eight hanging lamps take over and warm up with a flicker when switched on.</p></li>
      <li><h3>Box people</h3><p>Every person is about twenty boxes. Each frame their hands and feet get targets (a platform, a setting window, a spike swing) and a two-bone solver bends elbows and knees to reach them.</p></li>
      <li><h3>Players who look ahead</h3><p>The ball flies with gravity, drag, float wobble and topspin. Players simulate its flight to decide who can reach it, then aim passes, sets and attacks by testing launch angles until the simulated ball lands on target.</p></li>
    </ol>

  const doorHoles = { 0: [[6.6, 9.0]], 2: [[-8.5, -7.3]] };
  for (const w of walls) {
    const i = w.idx, D = WALLDEF[i];
    const L = D.u1 - D.u0, n = D.along === 'x' ? 7 : 5, sp = L / n, ww = D.along === 'x' ? 2.6 : 2.4;
    const winHoles = [];
    for (let k = 0; k < n; k++) { const uc = D.u0 + sp * (k + 0.5); winHoles.push([uc - ww / 2, uc + ww / 2]); WINDOWS.push({ idx: i, u0: uc - ww / 2, u1: uc + ww / 2, v0: 6.3, v1: 8.2 }); }
    const bands = [
      [0, 2.45, '#d0c6b0', doorHoles[i] || []], [2.45, 3.0, '#e3d9c3', []], [3.0, 3.13, '#e8701a', []], [3.13, 3.26, '#7146bd', []],
      [3.26, 6.3, '#f1e9d6', []], [6.3, 8.2, '#f1e9d6', winHoles], [8.2, 9.0, '#e3d9c3', []]
    ];
    for (const [v0, v1, col, holes] of bands) {

    wbox(proxy, i, D.u0, D.u1, 9.0, 9.14, -WT / 2, WT / 2, '#000');

    for (const [a, b] of winHoles) {

   ========================================================= */
const trussParts = [];  // {m:Matrix4, cx, cz}
let trussMesh = null;
function tPart(w, h, d, x, y, z, rx, cx, cz) {
  const M = new THREE.Matrix4().compose(V3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, 0, 0)), V3(w, h, d));
  trussParts.push({ m: M, cx, cz });
}
const TRUSS_X = [-13.5, -8.1, -2.7, 2.7, 8.1, 13.5];
function buildTrusses() {
  const yb = 7.95, yt = 8.95, step = 1.5;
  for (const x of TRUSS_X) {
    for (let z0 = -IN_Z; z0 < IN_Z - 0.01; z0 += step) {
      const z1 = Math.min(IN_Z, z0 + step), cz = (z0 + z1) / 2, len = z1 - z0;
      tPart(0.14, 0.12, len, x, yb, cz, 0, x, cz);
      tPart(0.14, 0.12, len, x, yt, cz, 0, x, cz);
      tPart(0.08, yt - yb, 0.08, x, (yb + yt) / 2, z0, 0, x, cz);
      const dl = Math.hypot(len, yt - yb), ang = Math.atan2(yt - yb, len) * (((z0 / step) | 0) % 2 ? 1 : -1);
      tPart(0.06, 0.06, dl, x, (yb + yt) / 2, cz, ang, x, cz);
    }
  }
  for (const z of [-11.0, -5.0, 0, 5.0, 11.0]) {
    const xs = [-IN_X, ...TRUSS_X, IN_X];
    for (let k = 0; k < xs.length - 1; k++) {
      const a = xs[k], b = xs[k + 1], cx = (a + b) / 2;
      const M = new THREE.Matrix4().compose(V3(cx, 9.08, z), new THREE.Quaternion(), V3(b - a, 0.12, 0.1));
      trussParts.push({ m: M, cx, cz: z });
    }
  }
  trussMesh = new THREE.InstancedMesh(unitBox, lambert({ color: 0x767c83 }), trussParts.length);
  trussMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(trussParts.length * 3), 3);
  trussParts.forEach((p, i) => { trussMesh.setMatrixAt(i, p.m); trussMesh.setColorAt(i, C(i % 7 === 0 ? '#555a61' : '#767c83')); });
  trussMesh.castShadow = true; trussMesh.frustumCulled = false;
  scene.add(trussMesh);
}
const _zero = new THREE.Matrix4().makeScale(0, 0, 0);
let lastTrussKey = '';
function updateTrussVis() {
  const c = view.camDir, key = c.x.toFixed(2) + c.y.toFixed(2);
  if (key === lastTrussKey) return; lastTrussKey = key;
  trussParts.forEach((p, i) => {
    const d = p.cx * c.x + p.cz * c.y;
    trussMesh.setMatrixAt(i, d < -6.0 ? p.m : _zero);
  });
  trussMesh.instanceMatrix.needsUpdate = true;
}

  <div class="how-in" role="dialog" aria-labelledby="howTitle">
    <h3 id="howTitle">How it's drawn</h3>
    <ol>
      <li><b>A tiny 3D park.</b> Everything is built from boxes, rough spheres and one bumpy sheet of grass, lit by a sun and a sky light, with hard shadows.</li>
      <li><b>Drawn small on purpose.</b> The camera looks down at a fixed angle with no perspective, and renders into a picture only a few hundred dots wide, with no smoothing.</li>
      <li><b>The sea mirror.</b> Before the main picture, the pier, people and sky are drawn again upside down around the water line. The waves show that picture with a slight ripple, tinted by how deep the water is.</li>
      <li><b>Outlines from depth.</b> Every dot knows how far away it is. If a neighbouring dot is more than half a metre closer, this dot gets darker, which draws a crisp edge around shapes.</li>
      <li><b>Snapping to the palette.</b> Each colour is swapped for the closest of about 80 paint colours. Closeness is measured the way eyes judge colour, with lightness counting a bit more than hue.</li>
      <li><b>Dither.</b> An optional 4×4 checker pattern nudges lightness up and down, so smooth light breaks into tidy patterns instead of bands.</li>
      <li><b>Blown up in whole pixels.</b> Each dot becomes an exact square of screen pixels, and the camera snaps to that grid so the park doesn't shimmer.</li>
    </ol>
    <div class="btns"><button id="howClose">Close</button></div>
  </div>

function simPath(p0,v0,ws=1,spin=0,maxT=6){const out=[{t:0,x:p0.x,y:p0.y,z:p0.z,vy:v0.y}];let px=p0.x,py=p0.y,pz=p0.z,vx=v0.x,vy=v0.y,vz=v0.z,sA=spin;const wx=windState.vec.x*ws,wz=windState.vec.z*ws,dt=1/60;

function solveDrive(from,tx,tz,speed,spin=0,clear=0.1){
  const dist=Math.hypot(tx-from.x,tz-from.z);let ang=Math.atan2(tz-from.z,tx-from.x);const v=V();let r=null;

    const lat=-(r.x-tx)*sa+(r.z-tz)*ca;ang-=lat/Math.max(dist,1);}

function findCross(path,side,hc,minX=0.05){for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i];if(a.y>hc&&b.y<=hc&&b.vy<0&&(side===0||b.x*side>minX))return b;}return null;}

function planNext(){
  G.plan=null;G.leave=null;if(!ball.live)return;
  const path=simPath(ball.p,ball.v,1,ball.spinA);const land=path[path.length-1];if(!land)return;
  const cur=sideOf(ball.p.x);let ci=-1;for(let i=1;i<path.length;i++)if(path[i-1].x*path[i].x<=0&&path[i-1].x!==path[i].x){ci=i;break;}
  const crosses=ci>=0&&path[ci].y>netTop(path[ci].z)&&Math.abs(path[ci].z)<4.1;const ls=crosses?-cur:cur;const recv=teamOnSide(ls);const same=recv===G.touchTeam;const n=same?G.touches+1:1;
  if(n>3)return;

  if(!same){const outBy=Math.max(Math.abs(land.x)-8,Math.abs(land.z)-4);if(outBy>0.4&&Math.random()<0.92){G.leave=recv;return;}}
  if(type!=='pass'){for(const p of recv.players)p.base=null;for(const p of other(recv).players)if(p.task!=='block')p.base=null;}
  let hc=0.85;let cand=recv.players.filter(p=>!(same&&p===G.lastHitter)&&p!==G.missP);
  if(type==='set'){const cH=findCross(path,ls,2.1,-0.1),cL=findCross(path,ls,0.9,-0.1);
    const pickRole=r=>{const f=cand.filter(p=>p.role===r);if(f.length)cand=f;};

  if(!c){hc=0.6;c=findCross(path,ls,hc,mx);if(!c)return;}

  if(!best||bs>c.t+(type==='pass'?0.42:0.75)+(playing()&&!isYou(recv)?DIFF[ui.diff].reach:0))return;

    if(two.length===2&&distXZ(two[1],c.x,c.z)<4){G.mixup=true;two.forEach((p,i)=>{p.task='mix';p.mixX=lerp(p.pos.x,c.x,0.55);p.mixZ=lerp(p.pos.z,c.z,0.55);});say(two[0],'Yours!',1.3);setTimeout(()=>say(two[1],'Mine?',1.2),350);return;}}
  G.plan={p:best,type,hc,team:recv,side:ls,pt:V(c.x,c.y,c.z),tc:G.t+c.t};best.task='play';best.jumped=false;onPlan(G.plan);
  if(type==='attack')setupBlock(recv,G.plan);
}
function refreshPlan(){const pl=G.plan;if(pl.type==='serve')return;const path=simPath(ball.p,ball.v,1,ball.spinA);const c=findCross(path,pl.side,pl.hc,pl.type==='pass'?0.05:-0.15);

function setupBlock(att,plan){

/* contacts */
function attemptContact(pl){
  const p=pl.p;const d=Math.hypot(ball.p.x-p.pos.x,ball.p.z-p.pos.z);
  if(pl.type==='serve'){doServe(p);return;}
  if(ui.mode==='player'&&isYou(pl.team)&&G.tap&&G.tap.plan===pl&&G.tap.tapped==null&&Math.random()<0.5){popAt(p,'NO TAP','miss');G.tap=null;G.timing.n++;G.missP=p;G.plan=null;return;}
  const reach={pass:0.95,set:0.85,bumpset:0.95,attack:1.15,free:1.0}[pl.type];
  if(d<=reach){execute(pl,false);return;}
  if((pl.type==='pass'||pl.type==='free'||pl.type==='bumpset')&&d<=2.2){
    p.setAct(Math.random()<0.3?'pancake':'dive');p.yaw=yawToXZ(p,ball.p.x,ball.p.z);const dx=ball.p.x-p.pos.x,dz=ball.p.z-p.pos.z;p.vel.set(dx/d*3,0,dz/d*3);

    execute(pl,true);if(Math.random()<0.6)setTimeout(()=>cheer(pick(['Great dig!','What a save!','Nice!'])),300);return;}
  if(pl.type==='attack'&&d<=1.8){pl.type='free';execute(pl,true);return;}
  G.missP=p;G.plan=null;
}
function execute(pl,late){
  const p=pl.p;G.plan=null;p.task=null;p.hitT=G.t;G.curQ=qualFor(pl.team);
  if(ui.mode==='player'&&isYou(pl.team)){const g=gradeOf(G.tap&&G.tap.plan===pl?G.tap.tapped:null,G.t);G.tap=null;G.curQ=GR[g].q*(late?1.3:1);G.timing.n++;if(g==='perfect')G.timing.perfect++;if(g==='good')G.timing.good++;popAt(p,GR[g].label,g);if(g==='perfect')sfx('perfect');}
  sfx(pl.type==='set'?'set':pl.type==='attack'?'spike':'pass');
  if(pl.type==='pass'){doPass(p,late);if(!late)p.setAct('pass');}
  else if(pl.type==='set'){doSet(p,false);p.setAct('set');}
  else if(pl.type==='bumpset'){doSet(p,true);if(!late)p.setAct('pass');}
  else if(pl.type==='attack'){doAttack(p,late);}
  else{doFree(p,late);if(!late)p.setAct('pass');}
}
function doPass(p,late){

  if(prevKind==='spike'&&inSp>13&&Math.random()<(0.1+(late?0.15:0))*Math.min(2.5,G.curQ)){G.shank=true;const zs=sgn(ball.p.z||1);ball.v.set(s*rand(0.5,3.5),rand(2.5,6),zs*rand(4,8));G.lastShotKind='pass';afterContact();return;}
  const sig=(0.16+inSp/42+windState.mag/18+(late?0.7:0))*G.curQ;
  let tx=s*rand(1.8,2.5)+gauss()*sig*0.7;const tz=clamp(rand(-0.6,0.8)+gauss()*sig,-4.1,4.1);
  if(s*tx<1.2&&Math.random()>0.1)tx=s*rand(1.2,1.7);

function tick(gdt,dt){simT+=gdt;{
    updateWind(gdt,simT);
    G.phaseT+=gdt;G.t+=gdt;
    switch(G.phase){case 'serve':updServe(gdt);break;case 'rally':updRally(gdt);break;case 'dead':updDead(gdt);break;case 'switch':updSwitch(gdt);break;case 'fetch':updFetch(gdt);break;case 'matchEnd':updMatchEnd(gdt);break;}
