<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Grandma's Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap">
<style>
/* Single deliberate look: a warm, dark walnut letterbox around a 1280x720 hand-drawn canvas. */
:root{--frame:#24160F;--ink:#2E1F1A;--paper:#EADBB8;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--frame);overflow:hidden}
body{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));touch-action:none;-webkit-user-select:none;user-select:none}
#game{display:block;width:100%;height:100%;touch-action:none;outline:none}
#game:focus-visible{outline:3px solid #EBC66A;outline-offset:-3px}
#noscript{color:var(--paper);font:18px Caveat,cursive;padding:24px}
</style>
<canvas id="game" tabindex="0" aria-label="Grandma's Kitchen, a gentle cooking game"></canvas>
<noscript><p id="noscript">Grandma's Kitchen needs JavaScript to run.</p></noscript>
<script>
'use strict';
/* ================= CORE: canvas, math, easing, drawing style ================= */
const W = 1280, H = 720, TAU = Math.PI * 2;
const P = {

  wal:'#6B4226', walD:'#4A2C1A', cream:'#F3E6C8', paper:'#EADBB8', stain:'#C9A86E', rose:'#D79A8F',

// derived tints (computed once)
const T = {

const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;

// damped spring: s = {v, vel}
function spring(s,target,dt,k,d){k=k||180;d=d||16;const a=k*(target-s.v)-d*s.vel;s.vel+=a*dt;s.v+=s.vel*dt;}
const SP=(v)=>({v:v||0,vel:0});
function hn(s,i){const x=Math.sin(s*127.1+i*311.7+s*i*0.013)*43758.5453;return (x-Math.floor(x))*2-1;}
function sstr(str){let h=7;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))%9973;return h+0.37;}
let _rs=1; function rnd(){_rs=(_rs*16807)%2147483647;return (_rs-1)/2147483646;} function seed(s){_rs=(Math.floor(s*9301)%2147483646)+1;}
const R=Math.random;

/* ---------- canvas setup with letterboxing & DPR ---------- */
const cv=document.getElementById('game'); const ctx=cv.getContext('2d');
let DPR=1, VS=1, VX=0, VY=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  const cw=cv.clientWidth||window.innerWidth, ch=cv.clientHeight||window.innerHeight;
  cv.width=Math.round(cw*DPR); cv.height=Math.round(ch*DPR);
  VS=Math.min(cw/W,ch/H); VX=(cw-W*VS)/2; VY=(ch-H*VS)/2;
  if(typeof onResize==='function') onResize();

function setView(c){c.setTransform(DPR*VS,0,0,DPR*VS,VX*DPR,VY*DPR);}
function toLogical(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left-VX)/VS,y:(e.clientY-r.top-VY)/VS};}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c;}

/* ---------- hand-drawn path builders (fixed wobble, seeded per object) ---------- */
const PB=new Float32Array(1024); let _n=0;
function _ap(x,y,s,amp){PB[_n*2]=x+amp*hn(s,_n);PB[_n*2+1]=y+amp*hn(s+7.31,_n);_n++;}
function smoothClosed(c,n){let lx=PB[(n-1)*2],ly=PB[(n-1)*2+1];c.moveTo((lx+PB[0])/2,(ly+PB[1])/2);
  for(let i=0;i<n;i++){const x=PB[i*2],y=PB[i*2+1],j=(i+1)%n;c.quadraticCurveTo(x,y,(x+PB[j*2])/2,(y+PB[j*2+1])/2);}c.closePath();}
// wobbly ellipse
function pEll(c,cx,cy,rx,ry,s,amp,rot){if(amp==null)amp=1.4;const n=Math.max(10,Math.min(120,(Math.PI*(Math.abs(rx)+Math.abs(ry))/13)|0));

  smoothClosed(c,n);}
// wobbly rounded rect
function pRR(c,x,y,w,h,r,s,amp){if(amp==null)amp=1.4;r=Math.max(2,Math.min(r,w/2,h/2));_n=0;
  const cs=[[x+r,y+r,Math.PI],[x+w-r,y+r,1.5*Math.PI],[x+w-r,y+h-r,0],[x+r,y+h-r,.5*Math.PI]];

    const a1=C[2]+Math.PI/2;const ex=C[0]+Math.cos(a1)*r,ey=C[1]+Math.sin(a1)*r;const N=cs[(k+1)%4];const nx=N[0]+Math.cos(N[2])*r,ny=N[1]+Math.sin(N[2])*r;
    const len=Math.hypot(nx-ex,ny-ey),seg=Math.max(1,Math.round(len/26));for(let i=0;i<seg;i++){const t=i/seg;_ap(ex+(nx-ex)*t,ey+(ny-ey)*t,s,amp);}}
  smoothClosed(c,_n);}
// wobbly polygon from flat array; smooth=true rounds it
function pPoly(c,a,s,amp,smooth){if(amp==null)amp=1.2;_n=0;const m=a.length/2;
  for(let i=0;i<m;i++){const x=a[i*2],y=a[i*2+1],j=(i+1)%m,nx=a[j*2],ny=a[j*2+1];const len=Math.hypot(nx-x,ny-y),seg=Math.max(1,Math.round(len/24));
    for(let k=0;k<seg;k++){const t=k/seg;_ap(x+(nx-x)*t,y+(ny-y)*t,s,k===0&&!smooth?amp*.5:amp);}}
  if(smooth) smoothClosed(c,_n); else {c.moveTo(PB[0],PB[1]);for(let i=1;i<_n;i++)c.lineTo(PB[i*2],PB[i*2+1]);c.closePath();}}
// wobbly open line
function pLine(c,x1,y1,x2,y2,s,amp){if(amp==null)amp=1.2;const len=Math.hypot(x2-x1,y2-y1),n=Math.max(2,Math.round(len/18));
  const nx=-(y2-y1)/(len||1),ny=(x2-x1)/(len||1);c.moveTo(x1,y1);let px=x1,py=y1;
  for(let i=1;i<=n;i++){const t=i/n,o=(i===n?0:amp*hn(s,i));const x=x1+(x2-x1)*t+nx*o,y=y1+(y2-y1)*t+ny*o;c.quadraticCurveTo(px,py,(px+x)/2,(py+y)/2);px=x;py=y;}c.lineTo(x2,y2);}
function wline(c,x1,y1,x2,y2,s,col,lw,amp){c.beginPath();pLine(c,x1,y1,x2,y2,s,amp);c.strokeStyle=col||P.ink;c.lineWidth=lw||S.lw;c.lineCap='round';c.stroke();}

/* ---------- the one drawing recipe: base, one shadow, one highlight, ink outline ---------- */
const S={lw:3, sx:1, sy:0.75}; // light from upper-left window
let HT=null, GRAIN=null;
const FOPT={};
function fig(c,path,base,o){o=o||FOPT;const lw=o.lw!=null?o.lw:S.lw, sh=o.sh!=null?o.sh:7, hl=o.hl!=null?o.hl:4;
  c.beginPath();path(c,0,0);c.fillStyle=base;c.fill();
  if(o.ht||o.detail||sh||hl||o.bright){c.save();c.clip();
    if(o.ht){c.fillStyle=HT;c.fillRect(-2000,-2000,6000,6000);}
    if(o.detail)o.detail(c);
    if(sh){c.beginPath();c.rect(-3000,-3000,8000,8000);path(c,-sh*S.sx,-sh*S.sy);c.globalCompositeOperation='multiply';c.globalAlpha=o.sha||0.35;c.fillStyle=o.shc||P.plum;c.fill('evenodd');c.globalCompositeOperation='source-over';c.globalAlpha=1;}
    if(hl){c.beginPath();c.rect(-3000,-3000,8000,8000);path(c,hl*S.sx,hl*S.sy);c.globalAlpha=o.hla||0.45;c.fillStyle=o.hlc||P.cream;c.fill('evenodd');c.globalAlpha=1;}
    if(o.bright){c.globalAlpha=0.1*o.bright;c.fillStyle=P.sun;c.fillRect(-2000,-2000,6000,6000);c.globalAlpha=1;}
    c.restore();}
  if(lw>0){c.beginPath();path(c,0,0);c.lineJoin='round';c.lineCap='round';c.lineWidth=lw;c.strokeStyle=o.stroke||P.ink;
    if(o.glow){c.save();c.shadowColor=rgba(P.sun,0.95*o.glow);c.shadowBlur=16*o.glow;c.stroke();c.restore();}else c.stroke();}
}
// convenience shape figs
function fEll(c,cx,cy,rx,ry,s,base,o,rot){fig(c,(c,dx,dy)=>pEll(c,cx+dx,cy+dy,rx,ry,s,o&&o.amp,rot),base,o);}
function fRR(c,x,y,w,h,r,s,base,o){fig(c,(c,dx,dy)=>pRR(c,x+dx,y+dy,w,h,r,s,o&&o.amp),base,o);}
function fPoly(c,a,s,base,o,smooth){fig(c,(c,dx,dy)=>{if(dx||dy){const b=_tmpArr(a.length);for(let i=0;i<a.length;i+=2){b[i]=a[i]+dx;b[i+1]=a[i+1]+dy;}pPoly(c,b,s,o&&o.amp,smooth);}else pPoly(c,a,s,o&&o.amp,smooth);},base,o);}
const _tmpPool={};function _tmpArr(n){return _tmpPool[n]||(_tmpPool[n]=new Array(n));}
// soft drop shadow on the surface below an object
const _SSG={};
function softShadow(c,x,y,rx,ry,a,blur){rx=Math.max(1,rx);ry=Math.max(1,ry);blur=blur||0;c.save();c.globalAlpha=a==null?0.25:a;c.translate(x,y);c.scale(rx+blur,ry+blur);
  const k=Math.round(clamp(1-blur*1.6/(rx+blur),0,0.95)*20);let g=_SSG[k];if(!g){g=_SSG[k]=ctx.createRadialGradient(0,0,0,0,0,1);g.addColorStop(0,rgba(P.plum,1));g.addColorStop(k/20,rgba(P.plum,1));g.addColorStop(1,rgba(P.plum,0));}
  c.fillStyle=g;c.beginPath();c.arc(0,0,1,0,TAU);c.fill();c.restore();}
// wood grain strokes inside current clip
function grain(c,x,y,w,h,s,col,a,spacing,horizontal){c.save();c.globalAlpha=a||0.35;c.strokeStyle=col;c.lineWidth=2;c.lineCap='round';spacing=spacing||14;
  if(horizontal!==false){for(let yy=y+spacing*.5,i=0;yy<y+h;yy+=spacing,i++){c.beginPath();let st=x-10;c.moveTo(st,yy);for(let xx=st;xx<x+w+20;xx+=40){c.quadraticCurveTo(xx+20,yy+hn(s,i*13+xx)*4,xx+40,yy+hn(s+3,i*7+xx)*2.5);}c.stroke();
      if(hn(s+9,i)>0.4){const kx=x+w*(0.2+0.6*(hn(s+11,i)*.5+.5));c.beginPath();c.ellipse(kx,yy+3,10,3.5,0,0,TAU);c.stroke();}}}
  else{for(let xx=x+spacing*.5,i=0;xx<x+w;xx+=spacing,i++){c.beginPath();c.moveTo(xx,y-10);for(let yy=y-10;yy<y+h+20;yy+=40){c.quadraticCurveTo(xx+hn(s,i*13+yy)*4,yy+20,xx+hn(s+3,i*7+yy)*2.5,yy+40);}c.stroke();}}
  c.restore();}
function makeTextures(){
  // fine halftone: 2.4px dots on a 6px grid, slightly lighter than the dark surface
  const h=mkCanvas(6,6),hc=h.getContext('2d');hc.fillStyle='rgba(243,230,200,0.09)';hc.beginPath();hc.arc(3,3,1.2,0,TAU);hc.fill();HT=ctx.createPattern(h,'repeat');
  const g=mkCanvas(256,256),gc=g.getContext('2d'),id=gc.createImageData(256,256);
  for(let i=0;i<id.data.length;i+=4){const v=R()<0.5?40:250;id.data[i]=v;id.data[i+1]=v-8;id.data[i+2]=v-20;id.data[i+3]=(R()*255)|0;}
  gc.putImageData(id,0,0);GRAIN=ctx.createPattern(g,'repeat');
}
function paperGrain(c){c.save();c.globalAlpha=0.07;c.fillStyle=GRAIN;c.fillRect(0,0,W,H);c.restore();}
// steam: soft cream curls
function steam(c,x,y,t,str,sc,seed){if(str<=0.01)return;sc=sc||1;c.save();c.lineCap='round';
  for(let k=0;k<3;k++){const ph=(t*0.35+k/3+(seed||0))%1;const a=Math.sin(ph*Math.PI)*0.32*str;if(a<=0.01)continue;
    c.globalAlpha=a;c.strokeStyle=P.cream;c.lineWidth=(7-ph*3)*sc;c.beginPath();
    const bx=x+(k-1)*14*sc,by=y-ph*70*sc;
    for(let i=0;i<=8;i++){const yy=by-i*7*sc,xx=bx+Math.sin(i*0.8+t*1.6+k*2)*7*sc*(0.4+i/8);if(i===0)c.moveTo(xx,yy);else c.lineTo(xx,yy);}
    c.stroke();}
  c.restore();}
// handwritten text helpers
const HAND='Caveat, "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive';
function htext(c,str,x,y,size,col,align,rot,weight,maxW){c.save();c.translate(x,y);if(rot)c.rotate(rot);c.font=`${weight||600} ${size}px ${HAND}`;c.fillStyle=col||P.ink;c.textAlign=align||'center';c.textBaseline='middle';if(maxW)c.fillText(str,0,0,maxW);else c.fillText(str,0,0);c.restore();}
function wrapText(c,str,x,y,maxW,lh,size,col,align,weight){c.font=`${weight||500} ${size}px ${HAND}`;const words=str.split(' ');let line='',yy=y;c.fillStyle=col||P.ink;c.textAlign=align||'left';c.textBaseline='middle';
  for(const w of words){const test=line?line+' '+w:w;if(c.measureText(test).width>maxW&&line){c.fillText(line,x,yy);line=w;yy+=lh;}else line=test;}if(line){c.fillText(line,x,yy);yy+=lh;}return yy;}
/* ================= AUDIO: all Web Audio synthesis, no files ================= */
const AU={ac:null,master:null,muted:false,noise:null,crackle:null,loops:{},music:{on:false,gain:null,next:0,step:0},
  init(){if(this.ac)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{this.ac=new AC();}catch(e){return;}
    const ac=this.ac;this.master=ac.createGain();this.master.gain.value=this.muted?0:0.9;this.master.connect(ac.destination);
    const len=ac.sampleRate*2;const b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.noise=b;
    const cb=ac.createBuffer(1,len,ac.sampleRate),cd=cb.getChannelData(0);for(let i=0;i<len;i++){cd[i]=(Math.random()*2-1)*0.04;if(Math.random()<0.0004)cd[i]=(Math.random()*2-1)*0.9;}this.crackle=cb;
    // continuous loops whose level the game sets every frame
    this.loops.pour=this.mkLoop('bandpass',2600,0.9);this.loops.sizzle=this.mkLoop('highpass',3800,0.7);
    this.loops.scrape=this.mkLoop('bandpass',900,3);this.loops.hiss=this.mkLoop('bandpass',1300,0.6);
    this.loops.amb=this.mkLoop('lowpass',380,0.5);this.loops.amb.set(0.05);
    this.loops.oven=this.mkLoop('lowpass',220,0.8);
    const mg=ac.createGain();mg.gain.value=0;mg.connect(this.master);this.music.gain=mg;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;lp.connect(mg);this.music.lp=lp;
    const cs=ac.createBufferSource();cs.buffer=this.crackle;cs.loop=true;const cg=ac.createGain();cg.gain.value=0.5;cs.connect(cg);cg.connect(mg);cs.start();
  },
  resume(){if(this.ac&&this.ac.state==='suspended')this.ac.resume();},
  mkLoop(type,f,q){const ac=this.ac,s=ac.createBufferSource();s.buffer=this.noise;s.loop=true;s.loopStart=Math.random();const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;
    const g=ac.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(this.master);s.start();let cur=0;
    return {g,fl,set:(v)=>{v=Math.max(0,v);if(Math.abs(v-cur)<0.002)return;cur=v;g.gain.setTargetAtTime(v,ac.currentTime,0.06);}};},
  setLoop(n,v){const l=this.loops[n];if(l)l.set(v);},
  setMuted(m){this.muted=m;if(this.master)this.master.gain.setTargetAtTime(m?0:0.9,this.ac.currentTime,0.05);},
  env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);},
  nz(t,dur,type,f,q,peak,a){const ac=this.ac,s=ac.createBufferSource();s.buffer=this.noise;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q||1;const g=ac.createGain();
    s.connect(fl);fl.connect(g);g.connect(this.master);this.env(g,t,a||0.005,peak,dur);s.start(t,Math.random()*1.5);s.stop(t+dur+0.1);return fl;},
  osc(t,type,f0,f1,dur,peak,a,dest){const ac=this.ac,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    o.connect(g);g.connect(dest||this.master);this.env(g,t,a||0.005,peak,dur);o.start(t);o.stop(t+dur+0.1);return o;},
  play(name,v){if(!this.ac||this.muted)return;const t=this.ac.currentTime;v=v==null?1:v;
    switch(name){
      case 'rustle':for(let i=0;i<5;i++)this.nz(t+i*0.07+Math.random()*0.03,0.09+Math.random()*0.06,'bandpass',2500+Math.random()*2500,0.8,0.25*v);break;

      case 'glug':this.osc(t,'sine',150+Math.random()*60,90,0.12,0.22*v,0.01);this.nz(t,0.08,'lowpass',500,2,0.12*v);break;
